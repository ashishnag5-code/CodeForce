<template>
    <div if:true={isLoaded} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
    </div>
    <template if:false={addSchedule}>
        <article class="slds-card slds-card_boundary">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name=custom:custom9 size="medium"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <a class="slds-card__header-link slds-truncate" title="Schedule"
                                onclick={handleGotoRelatedList}>
                                <span>Schedule ({recordCount})</span>
                            </a>
                        </h2>
                    </div>
                    <div class="slds-no-flex">
                        <lightning-icon icon-name=action:new size="xx-small" onclick={handleAddNewSchedule}></lightning-icon>
                    </div>
                    <div class="slds-no-flex">
                        <lightning-icon icon-name=action:delete size="xx-small" onclick={handleDeleteSelectedRows}></lightning-icon>
                    </div>
                </header>
            </div>
            <lightning-layout>
                <lightning-layout-item size="12" small-device-size="6" large-device-size="8">
                    <!--<lightning-datatable errors={errors}
                    onrowaction={navigateToEditAccountPage}
                        column-widths-mode="auto"
                        onrowselection={getSelectedRows}
                        oncellchange={handleCellChange}
                        key-field="Id"
                        data={scheduleList}
                        columns={columns}
                        onsave={handleEditSave}
                        draft-values={draftValues}>
                    </lightning-datatable>-->
                    <c-vpi-parent schedule-list={scheduleList}></c-vpi-parent>
                </lightning-layout-item>

            </lightning-layout>

            
            <div class="slds-p-top_small">
                <div class="slds-card__body slds-card__body_inner">
                    <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                        <template for:each={scheduleList} for:item="relatedRecord" for:index="index">-->
                            <!--<li class="slds-size_1-of-2 slds-small-size_3-of-6 slds-p-horizontal_small slds-p-bottom_small" key={keyIndex}>
                                <c-vpi-emi-schedule-child is-record-saved={relatedRecord.isSaved} inserted-emi-schedule={relatedRecord} onrowaction={handleRowAction} add-schedule={addSchedule}  key-id={index} loan-app={loanApp}></c-vpi-emi-schedule-child>
                            </li>-->
                            
                        </template>
                    </ul>
                </div>
            </div>
        </article>
    </template>

    <template if:true={addSchedule}>
            <c-vpi-emi-schedule-child inserted-emi-schedule={emiRecord} onrowaction={handleRowAction} add-schedule={addSchedule} onsaveschedule={handleSave} key-id={keyId} stage-number={stageNumber} loan-app={loanApp}></c-vpi-emi-schedule-child>
    </template>
        
</template>

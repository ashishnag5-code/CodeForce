<template>
	<!--<div class="spinner">
		<template if:true={isLoading}>-->
			<!--<c-custom-spinner show-spinner={isLoading}></c-custom-spinner>-->
		<!--</template>
	</div>-->
	<c-common-toast></c-common-toast>
    <c-custom-spinner spinner-image={spinnerImage} show-spinner={isLoading}></c-custom-spinner>
	<lightning-accordion allow-multiple-sections-open="true" active-section-name={activeSections}>
		<lightning-accordion-section name="A" label="Full Match">
			<template if:false={norecordsFull}>
				<div class="slds-text-heading_small slds-m-bottom_x-small"><b>Existing Customer of Bank</b></div>
			</template>
			<template if:true={applicants}>
				<!--<lightning-layout multiple-rows="true">-->
				<template if:false={viewMoreFull}>
					<template for:each={applicants.applicantList_fullMatch} for:item="applicant">
						<lightning-layout key={applicant.strCustomerID}>
							<lightning-layout-item flexibility="auto" class="slds-card_boundary">
								<lightning-card icon-name="standard:account" onclick={viewMoreHandler} data-id={applicant.strCustomerID} data-card="full">
									<h1 slot="title" class="no-wrap"><a>{applicant.strCustomerName}</a></h1>
									<div class="slds-grid slds-wrap slds-p-around_xx-small">
										<div class="slds-size_1-of-2">
											<b><label class="slds-form-element__label">Customer ID</label></b>
											<!--<div class="slds-form-element__control">
												<div class="slds-form-element__static">
													{applicant.strCustomerID}
												</div>
											</div>-->
										</div>
										<div class="slds-size_1-of-2">
											{applicant.strCustomerID}
										</div>
									</div>
									<div class="slds-grid slds-wrap slds-p-around_xx-small">
										<div class="slds-size_1-of-2">
											<b><label class="slds-form-element__label">Gender</label></b>
										</div>
										<div class="slds-size_1-of-2">
											{applicant.strGender}
										</div>
									</div>
									<template if:true={applicant.boolIsInputApplicantIndividual}>
										<div class="slds-grid slds-wrap slds-p-around_xx-small">
											<div class="slds-size_1-of-2">
												<b><label class="slds-form-element__label">Aadhaar</label></b>
											</div>
											<div class="slds-size_1-of-2">
												{applicant.strAadhaar}
											</div>
										</div>
									</template>
									<div class="slds-grid slds-wrap slds-p-around_xx-small">
										<div class="slds-size_1-of-2">
											<b><label class="slds-form-element__label">PAN</label></b>
										</div>
										<div class="slds-size_1-of-2">
											{applicant.strPAN}
										</div>
									</div>
									<div class="slds-grid slds-wrap slds-p-around_xx-small">
										<div class="slds-size_1-of-2">
											<b><label class="slds-form-element__label">Mobile</label></b>
										</div>
										<div class="slds-size_1-of-2">
											{applicant.strMobile}
										</div>
									</div>
								</lightning-card>
							</lightning-layout-item>
						</lightning-layout>
						<div class="slds-p-bottom_xx-small" key={applicant.strCustomerID}></div>
					</template>
				</template>
				<template if:true={viewMoreFull}>
					<c-lead-Dedupe-C-B-S-_details onviewall={viewLessHandler} applicant-input={applicantInput} 
						applicant-record={applicantRecord} applicant-o-d-record={applicantODRecord} applicant-credit-card={applicantCreditCard} 
							count-full-ind={countFullInd} count-full-non-ind={countFullNonInd} 
							oncopyapplicant={setlistview} bool-is-n-p-a={boolIsNPA} 
							spinner-image={spinnerImage} bool-d-p-d-found={boolDPDFound}>
					</c-lead-Dedupe-C-B-S-_details>
				</template>
			</template>
			<template if:true={norecordsFull}>
				No Results to Display
			</template>
		</lightning-accordion-section>
		<lightning-accordion-section name="B" label="Partial Match">
			<template if:false={norecordsPartial}>
				<div class="slds-m-around_small">
					<div class="slds-grid slds-gutters">
						<div class="slds-col">
							<lightning-textarea  disabled={isROLeadDisable} variant="label-stacked" label="RO Lead Dedupe Remarks"
								value={ROLeadDedupeRemarks} onchange={handleChangeRoDedupeRemarks} class={hideROLead}> </lightning-textarea>
						</div>
						<div class="slds-col">
							<lightning-textarea variant="label-stacked" label="Credit Lead Depude Remarks"
							value={CreditLeadDedupeRemarks} onchange={handleChangeCreditDedupeRemarks} required={isRequiredCreditLead} class={hideCreditLead}> </lightning-textarea>
						</div>
					</div>
					<div class="button-container-inner slds-align_absolute-center slds-m-top_small slds-m-left_xx-small">
						<lightning-button variant="brand" label="Save" onclick={handleSave} class={hideRemarksSaveButton}></lightning-button>
					</div>
				</div>
			</template>
			<template if:false={norecordsPartial}>
				<div class="slds-text-heading_small slds-m-bottom_x-small"><b>Phone Number Matching With Existing Customer</b></div>
			</template>
			<template if:true={applicants}>
				<!--<lightning-layout multiple-rows="true">-->
				<template if:false={viewMorePartial}>
					<template for:each={applicants.applicantList_partialMatch} for:item="applicant">
						<lightning-layout key={applicant.strCustomerID}>
							<lightning-layout-item flexibility="auto" class="slds-card_boundary">
								<lightning-card icon-name="standard:account" onclick={viewMoreHandler} data-id={applicant.strCustomerID}  data-card="partial">
									<h1 slot="title" class="no-wrap"><a>{applicant.strCustomerName}</a></h1>
									<div class="slds-grid slds-wrap slds-p-around_xx-small">
										<div class="slds-size_1-of-2">
											<b><label class="slds-form-element__label">Customer ID</label></b>
										</div>
										<div class="slds-size_1-of-2">
											{applicant.strCustomerID}
										</div>
									</div>
									<div class="slds-grid slds-wrap slds-p-around_xx-small">
										<div class="slds-size_1-of-2">
											<b><label class="slds-form-element__label">Gender</label></b>
										</div>
										<div class="slds-size_1-of-2">
											{applicant.strGender}
										</div>
									</div>
									<template if:true={applicant.boolIsInputApplicantIndividual}>
										<div class="slds-grid slds-wrap slds-p-around_xx-small">
											<div class="slds-size_1-of-2">
												<b><label class="slds-form-element__label">Aadhaar</label></b>
											</div>
											<div class="slds-size_1-of-2">
												{applicant.strAadhaar}
											</div>
										</div>
									</template>
									<div class="slds-grid slds-wrap slds-p-around_xx-small">
										<div class="slds-size_1-of-2">
											<b><label class="slds-form-element__label">PAN</label></b>
										</div>
										<div class="slds-size_1-of-2">
											{applicant.strPAN}
										</div>
									</div>
									<div class="slds-grid slds-wrap slds-p-around_xx-small">
										<div class="slds-size_1-of-2">
											<b><label class="slds-form-element__label">Mobile</label></b>
										</div>
										<div class="slds-size_1-of-2">
											{applicant.strMobile}
										</div>
									</div>
								</lightning-card>
							</lightning-layout-item>
						</lightning-layout>
						<div class="slds-p-bottom_xx-small" key={applicant.strCustomerID}></div>
					</template>
				</template>
				<template if:true={viewMorePartial}>
					<c-lead-Dedupe-C-B-S-_details onviewall={viewLessHandler} applicant-record={applicantRecord} 
						applicant-input={applicantInput} applicant-o-d-record={applicantODRecord} applicant-credit-card={applicantCreditCard} 
						count-full-ind={countFullInd} count-full-non-ind={countFullNonInd} 
						oncopyapplicant={setlistview} bool-is-n-p-a={boolIsNPA} 
						spinner-image={spinnerImage} bool-d-p-d-found={boolDPDFound}>
					</c-lead-Dedupe-C-B-S-_details>
				</template>
			</template>
			<template if:true={norecordsPartial}>
				No Results to Display
			</template>
			
		</lightning-accordion-section>
	</lightning-accordion>
</template>

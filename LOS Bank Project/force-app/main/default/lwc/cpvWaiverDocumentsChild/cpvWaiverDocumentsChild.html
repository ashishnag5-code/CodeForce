<template>
    <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
    <template if:true={isOptionElectricityBill}>
        <lightning-accordion-section name="Electricity bill" label="Electricity Bill Details">
            <c-electricity-bill-verification applicant-id={applicantId} loan-app-id={loanAppId} heading-value='Upload Electricity Bill' applicant={applicant} is-edit-restricted={isEditRestricted}></c-electricity-bill-verification>    
        </lightning-accordion-section>            
    </template>

        </lightning-accordion-section>
    </template>
    <template if:true={isOptionPassbook}>
        <lightning-accordion-section name="Passbook" label="Passbook Details">
            <c-passbook-verification applicant-id={applicantId} loan-app-id={loanAppId} heading-value='Upload Passbook' applicant={applicant} is-edit-restricted={isEditRestricted}></c-passbook-verification>
        </lightning-accordion-section>

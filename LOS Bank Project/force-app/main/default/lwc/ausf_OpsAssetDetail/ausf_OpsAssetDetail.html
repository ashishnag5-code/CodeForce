<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid ">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name=standard:user size="medium"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Asset/Collateral Details</span>
                        <!--<a href="#" class="slds-card__header-link slds-truncate" title="Address">
                                    <span>Addresses ({recordCount})</span>
                                </a>-->
                    </h2>
                </div>
                <div class="slds-no-flex">
                </div>
            </header>
        </div>


        <div class="slds-card__body slds-card__body_inner">
            <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                <li class="slds-size_1-of-1 slds-medium-size_3-of-3 slds-p-horizontal_small slds-p-bottom_small"
                     onclick={viewMoreHandler}
                     data-record-name="ViewMoreInformation">
                     <article class="slds-box">
                    
                        <div class="slds-card__body slds-card__body_inner">
                            <lightning-layout horizontal-align="space" multiple-rows>
                                <lightning-layout-item size="6" flexibility="auto">
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Product">
                                        <label class="slds-form-element__label">Product</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            {opsAssetWrapper.product}
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Manufacturer">
                                        <label class="slds-form-element__label">Manufacturer</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            {opsAssetWrapper.manufacture}
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Make">
                                        <label class="slds-form-element__label">Make</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            {opsAssetWrapper.make}
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Vehicle_Number">
                                        <label class="slds-form-element__label">Vehicle Number</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            {opsAssetWrapper.vehicleNumber}
                                            
                                        </div>
                                    </div>
                                    
                                    
                                    
                                </lightning-layout-item>
                                <lightning-layout-item size="6" flexibility="auto">
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Asset_Type">
                                        <label class="slds-form-element__label">Asset Type</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            {opsAssetWrapper.loanType}
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Manufacturer_Year">
                                        <label class="slds-form-element__label">Manufacturer Year</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            {opsAssetWrapper.year}
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Model">
                                        <label class="slds-form-element__label">Model</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            {opsAssetWrapper.model}
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Collateral_Type">
                                        <label class="slds-form-element__label">Collateral Type</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            {opsAssetWrapper.collateralType}
                                            
                                        </div>
                                    </div>
                                    
                                    
                                </lightning-layout-item>
                            </lightning-layout> 
                            
    
                            
                        </div>
                    </article>
                </li>
                    
            </ul>
            <!--End -->
        </div>
    </article>
    
</template>

                                <div class="slds-size_1-of-2">
                                    {productDecision}

                            </div>

                            <template if:true={showSchemeDecision}>
                                <tr>
                                <th class="subheader" colspan="4">Eligible Scheme</th>
                              </tr>
                            

                                    <c-generic-card-pagination-display-credit displayuwcriteria={showuwcriteria}

                            </template>
                            
                    
                        
                        <template lwc:if={showSubjectivityMsgs}>

-->

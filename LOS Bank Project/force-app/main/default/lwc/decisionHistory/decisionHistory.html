<template>
    <template if:true={errorMessage}>
        {errorMessage}
    </template>
    <template if:false={errorMessage}>
        <template if:false={decisionHistoryList}>
            There's no activity on this loan yet. Please revisit this screen after the loan processing begins
        </template>
        <template if:true={decisionHistoryList}>
            <table class="slds-table slds-table--bordered slds-max-medium-table_stacked">
                <thead>
                    <tr>
                        <th class="slds-cell-wrap" style="background-color: #ea8b3e;">Decision</th>
                        <th class="slds-cell-wrap" style="background-color: #ea8b3e;">Remarks</th>
                        <th class="slds-cell-wrap" style="background-color: #ea8b3e;">User Name &amp; ID</th>
                        <th class="slds-cell-wrap" style="background-color: #ea8b3e;">Assigned To</th>
                        <th class="slds-cell-wrap" style="background-color: #ea8b3e;">Loan Details</th>
                        <th class="slds-cell-wrap" style="background-color: #ea8b3e;">Start Date &amp; Time</th>
                        <th class="slds-cell-wrap" style="background-color: #ea8b3e;">End Date &amp; Time</th>
                        <th class="slds-cell-wrap" style="background-color: #ea8b3e;">Work Step Name/Level</th>
                    </tr>
                </thead>
                <tbody class="slds-text-body_regular">
                    <template for:each={decisionHistoryList} for:item="each">
                        <tr key={each.loanTATRecord.Id}>
                            <td data-label='Decision' class="slds-cell-wrap">{each.loanTATRecord.Action_Type__c}</td>
                            <td data-label='Remarks' class="slds-cell-wrap">{each.loanTATRecord.Decision_Remarks__c}</td>
                            
                            <td data-label='User Name & ID' class="slds-cell-wrap">
                                <!--template if:true={each.isLoanTAT}-->
                                    <template if:true={each.loanTATRecord.Actor__r}>
                                        {each.loanTATRecord.Actor__r.Name}
                                        <template if:true={each.loanTATRecord.Actor__r.Employee_Id__c}> - {each.loanTATRecord.Actor__r.Employee_Id__c}</template>
                                    </template>
                                <!--/template-->
                                <!--template if:false={each.isLoanTAT}>
                                    {each.ownerName}
                                    <template if:true={each.ownerEmployeeId}> - {each.ownerEmployeeId}</template>
                                </template-->
                            </td>
                            <td data-label='Assigned To' class="slds-cell-wrap">
                                <template if:true={each.isLoanTAT}>
                                    <template if:true={each.loanTATRecord.Owner__r}>
                                        {each.loanTATRecord.Owner__r.Name}
                                        <template if:true={each.loanTATRecord.Owner__r.Employee_Id__c}> - {each.loanTATRecord.Owner__r.Employee_Id__c}</template>
                                    </template>
                                </template>
                                <template if:false={each.isLoanTAT}>
                                    {each.ownerName}
                                    <template if:true={each.ownerEmployeeId}> - {each.ownerEmployeeId}</template>
                                </template>
                            </td>
                            <td data-label='Loan Details' class="slds-cell-wrap">
                                <template if:true={each.loanTATRecord.Loan_Amount__c}>
                                    Amount - {each.loanTATRecord.Loan_Amount__c}<br/>
                                </template>
                                <template if:true={each.loanTATRecord.ROI__c}>
                                    ROI - {each.loanTATRecord.ROI__c}<br/>
                                </template>
                                <template if:true={each.loanTATRecord.Tenure__c}>
                                    Tenure - {each.loanTATRecord.Tenure__c}<br/>
                                </template>
                                <template if:true={each.loanTATRecord.LTV__c}>
                                    LTV - {each.loanTATRecord.LTV__c}
                                </template>
                            </td>
                            <td data-label='Start Date & Time' class="slds-cell-wrap">
                                <lightning-formatted-date-time value={each.loanTATRecord.Start_Date_Time__c} year="numeric" month="numeric" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                            </td>
                            <td data-label='End Date & Time' class="slds-cell-wrap">
                                <lightning-formatted-date-time value={each.loanTATRecord.End_Date_Time__c} year="numeric" month="numeric" day="numeric" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                            </td>
                            <td data-label='Work Step Name/Level' class="slds-cell-wrap">{each.loanTATRecord.Stage_Activity__c}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
    </template>
</template>

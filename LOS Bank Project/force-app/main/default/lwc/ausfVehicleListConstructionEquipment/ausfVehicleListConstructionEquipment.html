<template>
    <c-custom-spinner show-spinner={isLoaded} spinner-image={spinnerImage}></c-custom-spinner>

    <template if:true={showVehicle}>
        <template if:true={showSection}>
            <!-- Add new Collateral -->
            <lightning-card>
                <div class="slds-card__header slds-grid ">
                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name=custom:custom31 size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">

                                <a class="slds-card__header-link slds-truncate" title="Applicants"
                                    onclick={handleGotoRelatedList}>
                                    <span>Vehicle</span>
                                </a>
                            </h2>
                        </div>
                        <div class="slds-no-flex">
                            <template if:true={showApplicantInsertion}>
                                <lightning-icon icon-name=action:new size="small"
                                    onclick={handleAdditionalInformationClick}></lightning-icon>
                            </template>
                        </div>
                    </header>
                </div>

                <!-- Vehicle detail card -->
                <template if:true={showMainSection}>
                    <lightning-layout>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="12"
                            large-device-size="12">
                            <div class="slds-card__body slds-card__body_inner">
                                <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                                    <template if:false={viewMorePartial}>
                                        <template for:each={applicantLst} for:item="relatedRecord">

                                            <li class="slds-size_1-of-1 slds-medium-size_3-of-6 slds-var-p-horizontal_small slds-var-p-bottom_small"
                                                key={relatedRecord.Id} data-id={relatedRecord.Id}
                                                data-record-name="ViewMoreInformation">
                                                <article class="slds-box">
                                                    <div class="slds-card__header slds-grid">
                                                        <header
                                                            class="slds-media slds-media_center slds-has-flexi-truncate">
                                                            <div class="slds-media__figure">
                                                                <lightning-icon icon-name=custom:custom31
                                                                    size="small"></lightning-icon>
                                                            </div>
                                                            <div class="slds-media__body">
                                                                <h2 class="slds-card__header-title">
                                                                    <a class="slds-card__header-link slds-truncate"
                                                                        title={relatedRecord.Name}
                                                                        data-id={relatedRecord.Id}>
                                                                        {relatedRecord.Collateral_ID__c}
                                                                    </a>
                                                                </h2>
                                                            </div>
                                                            <div class="slds-no-flex">

                                                                <!-- Collateral Edit Action -->
                                                                <lightning-icon icon-name=action:edit size="x-small"
                                                                    data-id={relatedRecord.Id}
                                                                    data-record-name={relatedRecord.Name}
                                                                    alternative-text={relatedRecord.Name}
                                                                    title={relatedRecord.Name}
                                                                    onclick={handleRowAction}></lightning-icon>

                                                                <!-- Collateral Delete Action -->
                                                                <lightning-icon icon-name=action:delete size="x-small"
                                                                    data-id={relatedRecord.Id}
                                                                    data-record-name={relatedRecord.Name}
                                                                    alternative-text={relatedRecord.Name}
                                                                    title={relatedRecord.Name}
                                                                    onclick={handleDeleteAction}
                                                                    if:true={canDeleteCollateral}></lightning-icon>
                                                            </div>
                                                        </header>

                                                    </div>
                                                    <div class="slds-card__body slds-card__body_inner">
                                                        <div class="slds-form-element">

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Collateral
                                                                        ID</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Collateral_ID__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Collateral
                                                                        Type</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Collateral_Name__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span
                                                                        class="slds-form-element__label">Product</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Loan__r.Product__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Make
                                                                        variant</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Variant__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Cost</span>
                                                                </div>
                                                                <div class="slds-form-element__control">
                                                                    <div class="slds-form-element__static">
                                                                        {relatedRecord.Final_Cost__c}
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Apportioned
                                                                        Loan Amount</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Apportioned_Loan_Amount__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Final Cost
                                                                        LTV</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.LTV_offered_On_final_cost__c}<span
                                                                                if:true={relatedRecord.LTV_offered_On_final_cost__c}>%</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small"
                                                                if:true={isFourWheeler}>
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Ex-Showroom
                                                                        LTV</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.LTV_offered_Ex_showroom__c}<span
                                                                                if:true={relatedRecord.LTV_offered_Ex_showroom__c}>%</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </article>
                                            </li>
                                        </template>
                                    </template>
                                </ul>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
            </lightning-card>
        </template>

        <!-- Add Vehicle Information -->
        <!-- <template if:true={showManualCollDetail}> -->
        <lightning-card title={title} icon-name="custom:custom31" class="slds-box" if:true={addVehicleInformation}>
            <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                <lightning-accordion-section name="A" label="Vehicle Details">
                    <div class="slds-p-around_small slds-size_1-of-1 slds-grid slds-wrap">

                        <!-- Auto generated Collateral Id -->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Collateral_ID__c">
                            <label class="slds-form-element__label"></abbr>Collateral ID</label>
                            <lightning-input type="text" variant="label-hidden" disabled
                                value={newVehicleRecord.Collateral_ID__c}></lightning-input>
                        </div>

                        <!-- Product -->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Product__c">
                            <label class="slds-form-element__label"></abbr>Product</label>
                            <lightning-input type="text" variant="label-hidden" disabled
                                value={productName}></lightning-input>
                        </div>

                        <!--  Type of Collateral ( New / Existing )-->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Collateral_Type__c">
                            <label class="slds-form-element__label"></abbr>Type</label>
                            <lightning-combobox name="Collateral_Type__c" data-name="Collateral_Type__c"
                                class="validate" variant="label-hidden" required disabled
                                value={newVehicleRecord.Collateral_Type__c} options={collateralTypes}
                                onchange={handleValueChange}></lightning-combobox>
                        </div>

                        <!-- Attachment -->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component"
                            data-id="Attachment__c">
                            <label class="slds-form-element__label"></abbr>Attachment</label>
                            <lightning-combobox name="Attachment__c" label="" data-name="Attachment__c" class="validate"
                                variant="label-hidden" value={newVehicleRecord.Attachment__c}
                                options={attachmentOptions} onchange={handleAttachmentChange}
                                required></lightning-combobox>
                        </div>
                         <!-- Attachment Type-->
                        <template if:true={isAttachment}>
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component"
                            data-id="Attachment_Type__c">
                                <label class="slds-form-element__label"></abbr>Attachment Type</label>
                                <lightning-combobox name="Attachment_Type__c" label="" data-name="Attachment_Type__c"
                                    class="validate" variant="label-hidden"
                                    value={newVehicleRecord.Attachment_Type__c} options={attachmentTypeOptions}
                                    onchange={handleAttachmentTypeChange} required></lightning-combobox>
                            </div>
                        </template>



                        <!-- Collateral Type options={collateralNames}-->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component"
                            data-id="Collateral_Name__c">
                            <label class="slds-form-element__label"></abbr>Collateral Type</label>
                            <lightning-combobox name="Collateral_Name__c" label="Collateral Type"
                                data-name="Collateral_Name__c" class="validate" variant="label-hidden"
                                value={newVehicleRecord.Collateral_Name__c} options={collateralFilteredPicklist}
                                onchange={handleCollateralName} required></lightning-combobox>
                        </div>
                        <!--disabled={desableField.Make__c}-->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Make__c">
                            <label class="slds-form-element__label">
                                <abbr class="slds-required" title="required">* </abbr>
                                Make
                            </label>
                            <lightning-combobox name="Make__c" label="Make" class="validate" required
                                variant="label-hidden" value={makeOptionValue} options={makeOptions}
                                onchange={handleMakeValueChange}></lightning-combobox>
                        </div>

                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Model__c">
                            <label class="slds-form-element__label">
                                <abbr class="slds-required" title="required">* </abbr>
                                Model
                            </label>
                            <lightning-combobox name="Model__c" label="Model" class="validate"
                                disabled={desableField.Model__c} required variant="label-hidden"
                                value={modelOptionValue} options={modelOptions}
                                onchange={handleModelValueChange}></lightning-combobox>
                        </div>

                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Variant__c">
                            <label class="slds-form-element__label">
                                <abbr class="slds-required" title="required">* </abbr>
                                Variant
                            </label>
                            <lightning-combobox name="Variant__c" label="Variant__c" data-name="Variant__c"
                                class="validate" variant="label-hidden" required value={variantOptionValue}
                                options={variantOptions} disabled={desableField.Variant__c}
                                onchange={handleVaiantValueChange}></lightning-combobox>
                        </div>

                        <template if:false={isAttachment}>
                            <!-- Registrable - CE  -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                                data-id="Registrable__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Registrable
                                </label>
                                <lightning-combobox name="Registrable__c" label="" data-name="Registrable__c"
                                    class="validate" variant="label-hidden" required
                                    value={newVehicleRecord.Registrable__c} options={regisOptions}
                                    onchange={handleValueChange} disabled></lightning-combobox>

                            </div>

                            <!-- Fuel Type -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                                data-id="Fuel_Type__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Fuel Type
                                </label>

                                <lightning-combobox name="Fuel_Type__c" label="Fuel Type" variant="label-hidden"
                                    required value={newVehicleRecord.Fuel_Type__c} disabled={desableField.Fuel_Type__c}
                                    class="validate" options={fuelTypeOptions}
                                    onchange={handleValueChange}></lightning-combobox>
                            </div>

                            <!-- Manufacturer Year -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                                data-id="Manufacture_year_month__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>Manufacture Year</label>
                                <lightning-combobox name="Manufacture_year_month__c" options={manufactureYearOptions}
                                    variant="label-hidden" label="manufactureYear" class="validate"
                                    value={manufactureYear} onchange={handleValueChange}></lightning-combobox>

                                <!-- Manufacture month -->
                                <label class="slds-form-element__label" if:true={allowMonthSelection}>
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Manufacture Month
                                </label>
                                <lightning-combobox if:true={allowMonthSelection} name="Manufacture_year_month__c"
                                    class="validate" label="manufactureMonth" variant="label-hidden"
                                    value={manufactureMonth} disabled={dataFromApi.manufactureMonth}
                                    options={manufactureMonthOptions} required onchange={handleValueChange}>
                                </lightning-combobox>
                            </div>

                            <!-- Engine Category -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                                data-id="Engine_Category__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Engine Category
                                </label>
                                <lightning-combobox name="Engine_Category__c" label="Engine Category"
                                    data-name="Engine_Category__c" class="validate" variant="label-hidden" required
                                    value={newVehicleRecord.Engine_Category__c} options={engineCategoryOptions}
                                    onchange={handleValueChange}></lightning-combobox>
                            </div>

                            <!-- Scheme Selection -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                                data-id="Scheme__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Scheme
                                </label>

                                <lightning-combobox name="Scheme__c" class="validate" label="Scheme"
                                    variant="label-hidden" value={schemeOptionValue} disabled={desableField.Scheme__c}
                                    options={vehicleSchemeOptions} required
                                    onchange={handleSchemeChange}></lightning-combobox>
                            </div>
                        </template>
                        <!-- Vehicle Category -->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Vehicle_Category__c">
                            <label class="slds-form-element__label">
                                <abbr class="slds-required" title="required">* </abbr>
                                Equipment Category
                            </label>
                            <lightning-combobox name="Vehicle_Category__c" class="validate" label="Equipment Usage"
                                variant="label-hidden" value={newVehicleRecord.Vehicle_Category__c}
                                options={vehicleCategoryOptions} required
                                onchange={handleCategoryChange}></lightning-combobox>
                        </div>



                    </div>
                </lightning-accordion-section>
            </lightning-accordion>

            <!-- Price details: Primary Asset -->
            <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                <lightning-accordion-section name="B" label="Price Details">

                    <div class="slds-p-around_small slds-size_1-of-1 slds-grid slds-wrap">
                        <!-- Primary Asset Exshowroom Price -->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Ex_Showroom_Price__c">
                            <label class="slds-form-element__label">
                                <abbr class="slds-required" title="required">* </abbr>
                                Ex-Showroom Price
                            </label>
                            <lightning-input type="number" variant="label-hidden" class="validate"
                                label="Ex-Showroom Price" required name="Ex_Showroom_Price__c"
                                value={newVehicleRecord.Ex_Showroom_Price__c} onchange={handleValueChange}
                                disabled={desableField.Ex_Showroom_Price__c}></lightning-input>
                        </div>

                        <!-- Discount -->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Discount__c">
                            <label class="slds-form-element__label">
                                <abbr class="slds-required" title="required">* </abbr>
                                Discount
                            </label>
                            <lightning-input type="number" variant="label-hidden" class="validate" label="Discount"
                                required name="Discount__c" value={newVehicleRecord.Discount__c}
                                onchange={handleValueChange}>
                            </lightning-input>
                        </div>

                        <!-- Net of Discount Price -->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Net_of_Discount_Price__c">
                            <label class="slds-form-element__label">
                                <abbr class="slds-required" title="required">* </abbr>
                                Net of Discount Price
                            </label> <!--value={netOfDiscountPrice}-->
                            <lightning-input type="number" variant="label-hidden" disabled label="Net of Discount Price"
                                class="validate" required name="Net_of_Discount_Price__c"
                                value={netOfDiscountPrice}></lightning-input>
                        </div>



                        <!-- Tenure in Months -->
                        <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-x-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide"
                            data-id="Tenure__c">
                            <label class="slds-form-element__label">
                                <abbr class="slds-required" title="required">* </abbr>
                                Tenure
                            </label>
                            <lightning-input type="number" variant="label-hidden" label="Tenure__c" class="validate"
                                required name="Tenure__cc" value={newVehicleRecord.Tenure__c}></lightning-input>
                        </div>

                        <!-- IRR -->

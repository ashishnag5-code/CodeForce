<template>
    <!-- <template if:true={isloading}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template> -->

    <c-custom-spinner
        show-spinner={isloading}
        spinner-image={spinnerImage}
        >
    </c-custom-spinner>


    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid ">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name=standard:user size="medium"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Customer Details</span>
                        <!--<a href="#" class="slds-card__header-link slds-truncate" title="Address">
                                    <span>Addresses ({recordCount})</span>
                                </a>-->
                    </h2>
                </div>
                <div class="slds-no-flex">
                    <!--<template if:true={showingwarningIcon}>
                                <lightning-helptext icon-name="action:info"
                                    content="Please fill the required address values in Permanent Address ">
                                </lightning-helptext> &nbsp;
                            </template>
                            <template if:true={showAddressInsertion}>
                                <lightning-icon icon-name=action:new size="small"
                                    onclick={handleAdditionalInformationClick}></lightning-icon>
                            </template>-->
                </div>
            </header>
        </div>


        <div class="slds-card__body slds-card__body_inner">
            <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                <template if:false={viewMorePartial}>
                    <template for:each={applicantDetails} for:item="relatedRecord">

                        <li class="slds-size_1-of-1 slds-medium-size_3-of-6 slds-p-horizontal_small slds-p-bottom_small"
                            key={relatedRecord.Id} onclick={viewMoreHandler} data-id={relatedRecord.Id}
                            data-record-name="ViewMoreInformation">
                            <article class="slds-box">
                                <div class="slds-card__header slds-grid">
                                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                        <div class="slds-media__figure">
                                            <lightning-icon icon-name=standard:user size="small">
                                            </lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <h2 class="slds-card__header-title">
                                                <a href="#" class="slds-card__header-link slds-truncate"
                                                    title={relatedRecord.Name}>{relatedRecord.Customer_Name__c}</a>
                                            </h2>
                                        </div>
                                        <div class="slds-no-flex">
                                            <c-ausf-fetch-button-component applicant-id={relatedRecord.Id} loan-id={recordId} stage={relatedRecord.Loan__r.Stage__c}
                                                customer-id={relatedRecord.CIF_No__c}> </c-ausf-fetch-button-component>
                                            <!--<lightning-button variant="base" data-id={relatedRecord.Id}   name={relatedRecord.CIF_No__c} label="Fetch Existing Details" title="Looks like a link" onclick={handleLoanODDetails}
                                                    class="slds-m-left_x-small"></lightning-button>-->
                                            <!--  <lightning-icon icon-name=action:edit size="x-small"
                                                        data-id={relatedRecord.Id}
                                                        data-record-name={relatedRecord.Pincode__c}
                                                        alternative-text={relatedRecord.Product__c}
                                                        title={relatedRecord.Address_Type__c} onclick={handleRowAction}>
                                                    </lightning-icon>-->
                                        </div>
                                    </header>
                                </div>
                                <div class="slds-card__body slds-card__body_inner">
                                    <div class="slds-form-element" key={relatedRecord.Id}>
                                        <span class="slds-form-element__label">Name</span>
                                        <div class="slds-form-element__control">
                                            <div class="slds-form-element__static">
                                                {relatedRecord.Customer_Name__c}
                                            </div>
                                        </div>

                                        <span class="slds-form-element__label">Father/Husband Name</span>
                                        <div class="slds-form-element__control">
                                            <div class="slds-form-element__static">
                                                {relatedRecord.Father_Name__c}
                                            </div>
                                        </div>

                                        <span class="slds-form-element__label">Customer Entity (Constitution) </span>
                                        <div class="slds-form-element__control">
                                            <div class="slds-form-element__static">
                                                {relatedRecord.Entity_Name__c}
                                            </div>
                                        </div>
                                        <span class="slds-form-element__label">Contact <lightning-icon
                                                icon-name=standard:voice_call size="xx-small">
                                            </lightning-icon> </span>
                                        <div class="slds-form-element__control">
                                            <div class="slds-form-element__static">
                                             <lightning-formatted-phone value={relatedRecord.Mobile_Number__c}></lightning-formatted-phone>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </article>
                        </li>
                    </template>
                </template>
            </ul>
            <!--End -->
        </div>
    </article>

</template>

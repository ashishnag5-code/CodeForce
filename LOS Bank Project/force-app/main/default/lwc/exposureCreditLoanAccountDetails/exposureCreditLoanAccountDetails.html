<template>
    <div if:true={isLoaded} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
    </div>
    <lightning-layout>
        <lightning-layout-item flexibility="auto" class="slds-card_boundary">
            <lightning-card class="no-wrap" icon-name="standard:account">
                <h1 slot="title" class="no-wrap"><a>{objAccountRecord.Account_Number__c}</a></h1>
                <div class="component slds-hide" data-id="Customer_Id__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Cust ID</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Customer_Id__c}
                        </div>
                    </div>
                </div>
                <div class="component slds-hide" data-id="Customer_Relationship__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Customer Account relation</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Customer_Relationship__c}
                        </div>
                    </div>
                </div>

                <div class="component slds-hide" data-id="Account_Number__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Account Number</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Account_Number__c}
                        </div>
                    </div>
                </div>
                <div class="component slds-hide" data-id="Status__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Loan status</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Status__c}
                        </div>
                    </div>
                </div>

                <div class="component slds-hide" data-id="Account_Name__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Customer Name</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Account_Name__c}
                        </div>
                    </div>
                </div>

                <div class="component slds-hide" data-id="Product__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Product Name</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Product__c}
                        </div>
                    </div>
                </div>
                <div class="component slds-hide" data-id="Account_Opening_Date__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Account Open Date</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Account_Opening_Date__c}
                        </div>
                    </div>
                </div>
                <div class="component slds-hide" data-id="Current_Status__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Account Status</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Current_Status__c}
                        </div>
                    </div>
                </div>


                <div class="component slds-hide" data-id="Sanctioned_Amount__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Credit Card Limit</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Sanctioned_Amount__c}
                        </div>
                    </div>
                </div>
                <div class="component slds-hide" data-id="DPP_Value__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">DPD value</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.DPP_Value__c}
                        </div>
                    </div>
                </div>
                <div class="component slds-hide" data-id="Last_Statement_Balance__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Outstanding Balance</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {objAccountRecord.Last_Statement_Balance__c}
                        </div>
                    </div>
                </div>
                <div class="component slds-hide" data-id="ODAmount">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">OD Amount</label></b>
                        </div>
                        <div class="slds-size_1-of-2">

                        </div>
                    </div>
                </div>
                <div class="component slds-hide" data-id="IncludeInExposure">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Include In Exposure</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                          <!--  {objAccountRecord.Include_In_Exposure__c}-->
                            <lightning-combobox name="includeExposure" label="Industry" data-name=""
                                variant="label-hidden" value={includeExposure} options={exposureOptions} disabled={creditOverride}
                                onchange={handleChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                </div>
            </lightning-card>
        </lightning-layout-item>
    </lightning-layout>
    <div class="slds-p-bottom--small"></div>
</template>

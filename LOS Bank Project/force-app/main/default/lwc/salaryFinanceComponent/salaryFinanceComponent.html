<template>

    <!-- Spinner Section
    <div if:true={isLoaded} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
    </div>-->
    <c-custom-spinner show-spinner={isLoaded} spinner-image={spinnerImage}></c-custom-spinner>
    <!--End-->

    <template if:true={salaryView}>
        <!-- New Form-->
        <template if:false={showEditView}>
            <div class="slds-var-p-around_large slds-border_bottom slds-border_right slds-border_left slds-border_top">

                <template if:true={isMobile}>
                    <lightning-accordion allow-multiple-sections-open class="example-accordion"
                        active-section-name={activeSections}>
                        <template if:true={isR2}>
                            <template if:true={readAttribute}>
                                <div slot="actions">
                                    <lightning-icon icon-name=action:edit size="x-small"
                                        onclick={handleEdit}></lightning-icon>
                                </div>
                            </template>
                        </template>

                        <!-- Added in R2-->
                        <template if:true={isDelete}>
                            <template if:true={readAttribute}>
                                <span slot="actions" class="slds-p-left--small">
                                    <lightning-icon title="Delete Other Income Detail" icon-name="action:delete" size="x-small"
                                        alternative-text="" access-key={index} class="slds-m-right_small"
                                        onclick={handleDeleteRow}></lightning-icon>
                                </span>
                            </template>
                        </template>
                        <!--End-->
                        <template if:false={showViewForm}>
                            <lightning-accordion-section name="A" label="Monthly Income Details">
                                <c-bank-statement-upload-financials loan-app-id={loanId} parent-name='financial'
                                    applicant-id={applicantId} document-type='Bank ITR Statement'
                                    read-attribute={disableUpload} heading-value="Upload Bank Statement"
                                    ondeleteremoveverified={deleteContentDocument}
                                    oncartcallbackmonthlyincome={handleCartMonthlyIncome}
                                    applicant-record-id={applicantId}
                                    onenablefetchdetails={handleEnableFetchDetails}></c-bank-statement-upload-financials>

                                <!--<c-upload-multiple-files loan-app-id={loanAppId} document-type={documentType}
                                    oncartcallbackmonthlyincome={handleCartMonthlyIncome} applicant-record-id={applicantId}
                                    onenablefetchdetails={handleEnableFetchDetails}></c-upload-multiple-files>
                                <template if:true={fetchDetails}>
                                <div class="slds-align_absolute-center slds-m-bottom_small">
                                    <lightning-button label="Fetch Details" variant="brand" onclick={handleFetchDetails}>
                                    </lightning-button>
                                </div>-->

                                <lightning-layout multiple-rows class="slds-p-bottom_small slds-p-left--xxx-small">
                                    <lightning-layout-item size="12" small-device-size="12" large-device-size="6">
                                        <div class="component slds-hide" data-id="First_Month__c">
                                            <lightning-input class="validate" type="number" name="First_Month__c"
                                                value={month1Val} onchange={handleChange} step="0.01"
                                                read-only={readAttribute}
                                                placeholder="enter the month1 income details..." label="Month 1"
                                                required></lightning-input>
                                        </div>
                                        <div class="component slds-hide" data-id="Second_Month__c">
                                            <lightning-input class="validate" type="number" name="Second_Month__c"
                                                value={month2Val} onchange={handleChange} step="0.01"
                                                read-only={readAttribute}
                                                placeholder="enter the month2 income details..." label="Month 2"
                                                required></lightning-input>
                                        </div>
                                        <div class="component slds-hide" data-id="Third_Month__c">
                                            <lightning-input class="validate" type="number" name="Third_Month__c"
                                                value={month3Val} onchange={handleChange} step="0.01"
                                                read-only={readAttribute}
                                                placeholder="enter the month3 income details..." label="Month 3"
                                                required>
                                            </lightning-input>
                                        </div>
                                        <div class="component slds-hide" data-id="Average_Monthly_Salary__c">
                                            <lightning-input type="number" name="Average_Monthly_Salary__c"
                                                value={averageMonthlySalary} disabled step="0.01"
                                                read-only={readAttribute} onchange={handleChange}
                                                label="Average Month Salary"></lightning-input>
                                        </div>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-accordion-section>

                            <lightning-accordion-section name="B" label="Net Salary Details">
                                <lightning-layout multiple-rows class="slds-p-bottom_small slds-p-left--xxx-small">
                                    <lightning-layout-item size="12" small-device-size="12" large-device-size="6">
                                        <div class="component slds-hide" data-id="Company_Name__c">
                                            <!--<lightning-input type="text" onchange={handleChange} label="Company Name"
                                                value={cmpValue} read-only={readAttribute} name="Company_Name__c">
                                            </lightning-input>-->
                                            <c-generic-custom-lookup name="Company_Name__c" label="Company Name"
                                                read-only={isCompanyReadOnly} record-type-name="Company"
                                                dependent-field-api="Company_Name__c"
                                                dependent-picklist-value={companyOptionsValue}
                                                fieldapi="Company_Name__c" object-name="Generic Master"
                                                s-object-api-name="Generic_Master__c" default-record-id={companyDefault}
                                                onlookupselect={handleLookupSelect}>
                                            </c-generic-custom-lookup>
                                        </div>

                                        <c-email-verification-through-link class="component"

                                            <lightning-input type="number" onchange={handleChange}
                                                label="Monthly Gross Salary" step="0.01" read-only={readAttribute}
                                                name="Monthly_Gross_Salary__c" value={grossVal}></lightning-input>
                                        </div>
                                        <div class="component slds-hide" data-id="Salary_Received_in_Bank__c">
                                            <lightning-input type="number" onchange={handleChange}
                                                label="Salary Received in Bank" step="0.01" read-only={readAttribute}
                                                disabled name="Salary_Received_in_Bank__c" value={averageMonthlySalary}>
                                            </lightning-input>
                                        </div>
                                        <div class="component slds-hide" data-id="Salary_Received_in_Cash__c">
                                            <lightning-input type="number" onchange={handleChange}
                                                label="Salary Received in Cash " step="0.01" read-only={readAttribute}
                                                value={cashVal} name="Salary_Received_in_Cash__c"></lightning-input>
                                        </div>
                                        <div class="component slds-hide" data-id="Monthly_Net_Salary__c">

                                        </div>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </lightning-accordion-section>

                                    <div class="slds-col slds-size_1-of-3 slds-hide "

                                        <span>

                                                <div class="slds-form-element__control slds-p-around--xx-small">

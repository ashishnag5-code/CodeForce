<template>
    <lightning-accordion allow-multiple-sections-open active-section-name={activeSections} onsectiontoggle={handleSectionToggle}>
        <div class="slds-var-p-around_large slds-border_bottom slds-border_right slds-border_left slds-border_top">
            <lightning-accordion-section name="F"  class="accordClass">
                <br/>
                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-2" data-id="ApplicationId">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Application Id
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.applicationId}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>

                    <div class="slds-col slds-size_1-of-2" data-id="Application_Date">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Application Date
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.applicationDate}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div> 

                </div>

            </lightning-accordion-section>
            <br/>
            <br/>
            <lightning-accordion-section name="A" label="Deal Summary" class="accordClass">
                <br/>
                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Loan_Type">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Loan Type
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.loanType}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Vehicle_Usage">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Vehicle Usage
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.vehicleType}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>                    
                </div>
                <br/>
                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Sourcing_Channel">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Sourcing Channel
                                <!-- <label class="slds-form-element__label">HUB: </label> -->
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static"> {applicationDealSummaryWrapper.sourcingChannel}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Customer_Type">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Customer Type
                                <!-- <label class="slds-form-element__label">HUB: </label> -->
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static"> {applicationDealSummaryWrapper.customerType}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>                 
                </div>
                <br/>

                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Loan_Amount">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Loan Amount/ LTV/ Tenure/ IRR
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.loanAmount}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Dealer_Name">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Dealer Name and TA/ NTA
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.dealerName}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>                                  
                </div>
                <br/>

                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Model">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Make/ Model/ Variant
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.model}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Method_Of_Assessment">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Method of Assessment
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.methodOfAssessment}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>                                  
                </div>
                <br/>

                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Scheme">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Scheme
                                <!-- <label class="slds-form-element__label">HUB: </label> -->
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.scheme}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Campaign">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Campaign
                                <!-- <label class="slds-form-element__label">HUB: </label> -->
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.campaign}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>                                
                </div>
                <br/>

                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Preapproved">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Preapproved
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static"><lightning-input type="checkbox" checked={applicationDealSummaryWrapper.preapproved} disabled="true"></lightning-input></span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Manufacturing_Year">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Manufacturing Year
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{applicationDealSummaryWrapper.manufacturingYear}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>                              
                </div>
                <br/>
                <!--1780,82-->
                <template if:false={isTractorCommercial}>
                    <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                        <div class="slds-col slds-size_1-of-2" data-id="Ops_FTR/FTNR">
                            <span>
                                <lightning-layout-item flexibility="auto">
                                    Ops FTR/FTNR
                                    <div class="slds-form-element__control">
                                        <span class="slds-form-element__static">{applicationDealSummaryWrapper.opsFTR}</span>
                                    </div>
                                </lightning-layout-item>
                            </span>
                        </div>
                        <div class="slds-col slds-size_1-of-2" data-id="Credit_FTR_FTNR__c">
                            <span>
                                <lightning-layout-item flexibility="auto">
                                    Credit FTR/FTNR
                                    <div class="slds-form-element__control">
                                        <span class="slds-form-element__static">{applicationDealSummaryWrapper.creditFTR}</span>
                                    </div>
                                </lightning-layout-item>
                            </span>
                        </div>                              
                    </div>
                </template>
                <!--1780,82-->
                <br/> 


                
                
            </lightning-accordion-section>

            <lightning-accordion-section name="B" label="Customer Details" class="accordClass">
                <br/>
                <!--1780,82-->
                <c-ausf_-applicant-component application-id = {applicationId} is-tractor-commercial = {isTractorCommercial} screen-name = "Summary Page Applicant" stage-name= {stageName}></c-ausf_-applicant-component>
                <br/>
            </lightning-accordion-section>


            <lightning-accordion-section name="C" label="Pricing Details" class="accordClass">
                <br/>
                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-4 slds-hide" data-id="IRR_offered"><!--1780,82-->
                        <span>
                            <lightning-layout-item flexibility="auto">
                                IRR Offered
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{pricingWrapper.roi}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>

                    <div class="slds-col slds-size_1-of-4 slds-hide" data-id="Rate_Variance"><!--1780,82-->
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Rate Variance
                                <!-- <label class="slds-form-element__label">HUB: </label> -->
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static"> {pricingWrapper.rateVariance}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>

                    
                    <div class="slds-col slds-size_1-of-4 slds-hide" data-id="EMI_Due_Date"><!--1780,82-->
                        <span>
                            <lightning-layout-item flexibility="auto">
                                EMI Due Date
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{pricingWrapper.emiDate}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>
                    <!--1780,82-->
                    <template if:true={isTractorCommercial}>
                        <div class="slds-col slds-size_1-of-4 slds-hide" data-id="Collateral_Type">
                            <span>
                                <lightning-layout-item flexibility="auto">
                                    Collateral Type
                                    <div class="slds-form-element__control">
                                        <span class="slds-form-element__static">{pricingWrapper.collateralType}</span>
                                    </div>
                                </lightning-layout-item>
                            </span>
                        </div>
                    </template>
                    <!--1780,82-->
                </div>
                <br/>
                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-4 slds-hide" data-id="EMI_Frequency">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                EMI Frequency
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{pricingWrapper.emiFrequency}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>

                    <div class="slds-col slds-size_1-of-4 slds-hide" data-id="EMI_Amount">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                EMI Amount
                                <!-- <label class="slds-form-element__label">HUB: </label> -->
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{pricingWrapper.emiAmount}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>
                    <div class="slds-col slds-size_1-of-4" data-id="EMI_Amount">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Policy Rate
                                <!-- <label class="slds-form-element__label">HUB: </label> -->
                                <div class="slds-form-element__control">
                                    <span class="slds-form-element__static">{pricingWrapper.rbp}</span>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>
                </div>
                <br/>
                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_3-of-3">
                        <h2 style="padding-bottom: 4px;"><strong style="margin-left: 3px;">WIRR</strong></h2>
                            <table width="100%" style = "border: solid 2px #6D3078;
                                                         border-collapse: separate;
                                                         width: 100% !important;
                                                         text-align: center;
                                                         border-radius: 7px !important;padding-top:7px;">
                                <thead>
                                    <tr>
                                        <th style="width:30%"></th>
                                        <th style="width:30%">Current Month</th>
                                        <th style="width:30%">Last Month</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td style="height : 29px !important; padding-left : 10px;">Branch Aggregate</td>
                                        <td>{pricingWrapper.aggregateBranchWIRRCurrMonth}</td>
                                        <td>{pricingWrapper.aggregateBranchWIRRPrevMonth}</td>
                                    </tr>
                                    
                                    <tr>
                                        <td style="height : 29px !important; padding-left : 10px">RO Aggregate</td>
                                        <td>{pricingWrapper.aggregateROWIRRCurrMonth}</td>
                                        <td>{pricingWrapper.aggregateROWIRRPrevMonth}</td>
                                        
                                    </tr>
                                    <tr>
                                        <td style="height : 29px !important; padding-left : 10px;">Branch {pricingWrapper.branchLoanLabel}</td>
                                        <td>{pricingWrapper.wirrCurrentMonth}</td>
                                        <td>{pricingWrapper.wirrLastMonth}</td>
                                        
                                    </tr>
                                    <tr>
                                        <td style="height : 29px !important; padding-left : 10px;">Branch {pricingWrapper.branchOverallLoanLabel}</td>
                                        <td>{pricingWrapper.overall4_2WCurrMonth}</td>
                                        <td>{pricingWrapper.overall4_2WPrevMonth}</td>
                                        
                                    </tr>
                                </tbody>
                             </table>
                    </div>
                </div>

                
            </lightning-accordion-section>

            <lightning-accordion-section name="D" label="Approval Details" class="accordClass">
                <br/>
                <div class="slds-grid slds-wrap" style="word-wrap: break-word;">
                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Credit_Deviation">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Credit Deviations Name of Authority
                                <div class="slds-form-element__control">
                                    <template for:each={approvalWrapper.creditApprover} for:item="approver">
                                        <div key={approver.Id} class="slds-form-element__static">
                                            {approver.approverLevel} &nbsp; {approver.approverName}
                                        </div>
                                    </template>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-hide" data-id="Pricing_Deviation">
                        <span>
                            <lightning-layout-item flexibility="auto">
                                Pricing & Charges deviation name of Authority
                                <!-- <label class="slds-form-element__label">HUB: </label> -->
                                <div class="slds-form-element__control">
                                    <template for:each={approvalWrapper.pricingApprover} for:item="approver">
                                        <div key={approver.Id} class="slds-form-element__static">
                                            {approver.approverLevel} &nbsp; {approver.approverName}
                                        </div>
                                    </template>
                                </div>
                            </lightning-layout-item>
                        </span>
                    </div>
                </div>
                <br/>
            </lightning-accordion-section>


        </div>
     </lightning-accordion>

    
</template>

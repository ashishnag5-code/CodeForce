<template>
    <!--<div if:true={isLoaded} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
    </div>-->
    <c-custom-spinner show-spinner={isLoaded}></c-custom-spinner>
    <template if:true={isModalOpen}>
        <c-ausf-update-loan-application is-modal-open={isModalOpen} scheme-record={schemeMasterRecord}
            onshowloandetails={showDetails} onclosemodal={closeModal}></c-ausf-update-loan-application>
    </template>
    <template if:true={showLoanDetails}>
        <c-loan-details class="component" record-id={loanApplicationRecord.Id} show-save=true
            onshowvehicle={showVehicleDetail}>
        </c-loan-details>
    </template>
    <!-- Existing Applicant Section-->
    <!--<template if:false={editVehicleRecordPage}>-->
    <template if:true={showVehicle}>
        <template if:true={showSection}>
            <lightning-card>
                <!-- <article class="slds-card slds-card_boundary">-->
                <div class="slds-card__header slds-grid ">
                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name=custom:custom31 size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">

                                <a class="slds-card__header-link slds-truncate" title="Applicants"
                                    onclick={handleGotoRelatedList}>
                                    <span>Vehicle</span>
                                </a>
                            </h2>
                        </div>
                        <div class="slds-no-flex">
                            <template if:true={showApplicantInsertion}>
                                <lightning-icon icon-name=action:new size="small"
                                    onclick={handleAdditionalInformationClick}></lightning-icon>
                            </template>
                        </div>
                    </header>
                </div>
                <template if:true={showMainSection}>
                    <lightning-layout>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="12"
                            large-device-size="12">
                            <div class="slds-card__body slds-card__body_inner">
                                <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                                    <template if:false={viewMorePartial}>
                                        <template for:each={applicantLst} for:item="relatedRecord">

                                            <li class="slds-size_1-of-1 slds-medium-size_3-of-6 slds-var-p-horizontal_small slds-var-p-bottom_small"
                                                key={relatedRecord.Id} data-id={relatedRecord.Id}
                                                data-record-name="ViewMoreInformation">
                                                <article class="slds-box">
                                                    <div class="slds-card__header slds-grid">
                                                        <header
                                                            class="slds-media slds-media_center slds-has-flexi-truncate">
                                                            <div class="slds-media__figure">
                                                                <lightning-icon icon-name=custom:custom31 size="small">
                                                                </lightning-icon>
                                                            </div>
                                                            <div class="slds-media__body">
                                                                <h2 class="slds-card__header-title">
                                                                    <a class="slds-card__header-link slds-truncate"
                                                                        title={relatedRecord.Name}
                                                                        data-id={relatedRecord.Id}>{relatedRecord.Collateral_ID__c}</a>
                                                                    <!--onclick={navigateToAppRecordPage}-->
                                                                </h2>
                                                            </div>
                                                            <div class="slds-no-flex">
                                                                <lightning-icon icon-name=action:edit size="x-small"
                                                                    data-id={relatedRecord.Id}
                                                                    data-record-name={relatedRecord.Name}
                                                                    alternative-text={relatedRecord.Name}
                                                                    title={relatedRecord.Name}
                                                                    onclick={handleRowAction}>
                                                                </lightning-icon>
                                                                <lightning-icon icon-name=action:delete size="x-small"
                                                                    data-id={relatedRecord.Id}
                                                                    data-record-name={relatedRecord.Name}
                                                                    alternative-text={relatedRecord.Name}
                                                                    title={relatedRecord.Name}
                                                                    onclick={handleDeleteAction}
                                                                    if:true={canDeleteCollateral}
                                                                ></lightning-icon>
                                                            </div>
                                                        </header>

                                                    </div>
                                                    <div class="slds-card__body slds-card__body_inner">
                                                        <div class="slds-form-element">

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Collateral
                                                                        ID</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Collateral_ID__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Collateral
                                                                        Name</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Collateral_Name__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span
                                                                        class="slds-form-element__label">Product</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Loan__r.Product__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Make
                                                                        variant</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Variant__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <template if:false={isSingleImplement}>
                                                                <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                    <div class="slds-size_1-of-2">
                                                                        <span class="slds-form-element__label">Cost</span>
                                                                    </div>
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Final_Cost__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </template>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Apportioned
                                                                        Loan
                                                                        Amount</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Apportioned_Loan_Amount__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">LTV offered %</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.LTV_offered__c}<span if:true={relatedRecord.LTV_offered__c}>%</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small" if:true={isFourWheeler}>
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Ex-Showroom LTV</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.LTV_offered_Ex_showroom__c}<span if:true={relatedRecord.LTV_offered_Ex_showroom__c}>%</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </article>
                                            </li>
                                        </template>
                                    </template>
                                </ul>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
                <!--</article>-->
                <!--</template>-->
                <!--End -->

            </lightning-card>
        </template>
        <!-- Add New Applicant Details-->
        <template if:true={addNewApplicant}>
            
            <lightning-card title={title} icon-name="custom:custom31" class="slds-box">
                <template if:false={showBackButton}>
                    <lightning-accordion allow-multiple-sections-open class="example-accordion"
                        active-section-name={activeSections}>
                        <lightning-accordion-section name="A" label="Vehicle Detail">
                            <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                                <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                                    class="slds-var-p-horizontal_small" flexibility="auto">


                                    <div class="component slds-hide" data-id="Collateral_ID__c">
                                        <label class="slds-form-element__label"></abbr>Collateral ID</label>
                                        <lightning-input type="text" variant="label-hidden" disabled
                                            value={newVehicleRecord.Collateral_ID__c}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Collateral_Type__c">
                                        <label class="slds-form-element__label"></abbr>Collateral Type</label>
                                        <lightning-combobox name="Collateral_Type__c" data-name="Collateral_Type__c"
                                            class="validate" variant="label-hidden" required disabled
                                            value={newVehicleRecord.Collateral_Type__c} options={collateralTypes}
                                            onchange={handleValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Product__c">
                                        <label class="slds-form-element__label"></abbr>Product</label>
                                        <lightning-input type="text" variant="label-hidden" disabled value={productName}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Collateral_Name__c">
                                        <label class="slds-form-element__label"></abbr>Collateral Name</label>
                                        <lightning-combobox name="Collateral_Name__c" label="Manufacturer"
                                            data-name="Collateral_Name__c" class="validate" variant="label-hidden"
                                            value={newVehicleRecord.Collateral_Name__c} options={collateralNames} disabled
                                            onchange={handleCollateralName}>
                                        </lightning-combobox>
                                    </div>

                                    <!--  Parent Loan Application - (Primary Asset loan) -->
                                    <div class="slds-large-size_1-of-1 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1" lwc:if={isImplementLoan}>
                                        <label class="slds-form-element__label">
                                            Parent Loan Application
                                        </label>
                                        <div class="slds-grid slds-grid_reverse">
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                class=""
                                                label="Parent Loan Application"
                                                value={parentLoanIdentifier}
                                                name="Parent_Loan__c"
                                                style="flex:1;"
                                                lwc:ref="parentLoan"
                                                onchange={handleParentLoanChange}
                                                disabled={isCollateralUpdatedPostCreation}
                                            ></lightning-input>

                                            <!-- Validate Parent Loan -->
                                            <lightning-button
                                                variant="base"
                                                class="slds-is-absolute slds-p-right_small"
                                                label={parentLoanValiationButtonLabel}
                                                title="validate"
                                                onclick={validateParentLoan}
                                                disabled={allowParentLoanValidate}
                                            ></lightning-button>
                                        </div>
                                    </div>

                                    <template if:true={isSingleImplement}>
                                        <div class="component" data-id="Implement_Type__c">
                                            <label class="slds-form-element__label"></abbr>Implement Type</label>
                                            <lightning-combobox name="Implement_Type__c" label="Manufacturer"
                                                data-name="Implement_Type__c" class="validate" variant="label-hidden"
                                                value={newVehicleRecord.Implement_Type__c} options={implementNames}
                                                onchange={handleImplementName}>
                                            </lightning-combobox>
                                        </div>
                                    </template>

                                    <div class="component slds-hide" data-id="Make__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Make</label>
                                        <lightning-combobox name="Make__c" label="Make" class="validate"
                                            disabled={desableField.Make__c} required variant="label-hidden"
                                            value={makeOptionValue} options={makeOptions} onchange={handleMakeValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Model__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Model</label>
                                        <lightning-combobox name="Model__c" label="Model" class="validate"
                                            disabled={desableField.Model__c} required variant="label-hidden"
                                            value={modelOptionValue} options={modelOptions}
                                            onchange={handleModelValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Variant__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Variant</label>
                                        <lightning-combobox name="Variant__c" label="Variant__c" data-name="Variant__c"
                                            class="validate" variant="label-hidden" required value={variantOptionValue}
                                            options={variantOptions} disabled={desableField.Variant__c}
                                            onchange={handleVaiantValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <!--<div class="component slds-hide" data-id="Collateral_Name__c">
                                        <label class="slds-form-element__label"></abbr>Collateral Name</label>
                                        <lightning-combobox name="Collateral_Name__c" label="Manufacturer"
                                            data-name="Collateral_Name__c" class="validate" variant="label-hidden"
                                            value={newVehicleRecord.Collateral_Name__c} options={collateralNames}
                                            onchange={handleCollateralName}>
                                        </lightning-combobox>
                                    </div>-->
                                    <template if:false={isSingleImplement}>
                                        <div class="component slds-hide" data-id="HP__c">
                                            <label class="slds-form-element__label">
                                                <abbr class="slds-required" title="required">* </abbr>HP</label>
                                            <lightning-input type="text" variant="label-hidden" disabled value={newVehicleRecord.HP__c}>
                                            </lightning-input>
                                        </div>
                                    </template>

                                </lightning-layout-item>

                                <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                                    class="slds-var-p-horizontal_small" flexibility="auto">
                                    
                                    <div class="component slds-hide" data-id="Vehicle_Color__c" if:false={isTwoWheeler}>
                                        <!--<label class="slds-form-element__label">Vehicle Color</label>
                                        <lightning-input type="text" variant="label-hidden" label=""
                                            value={newVehicleRecord.Vehicle_Color__c} name="Vehicle_Color__c"
                                            disabled={dataFromApi.Vehicle_Color__c} onchange={handleValueChange}>
                                        </lightning-input>-->
                                        <c-generic-custom-lookup name="Color_Code__c" label="Vehicle Colour"
                                                record-type-name="Vehicle Color"
                                                dependent-field-api="Color_Code__c" fieldapi="Color_Code__c"
                                                object-name="Generic Master" s-object-api-name="Generic_Master__c" default-record-id={newVehicleRecord.Vehicle_Color__c}
                                                onlookupselect={handleLookupSelect}>
                                            </c-generic-custom-lookup>
                                    </div>
                                    
                                    <template if:false={isSingleImplement}>
                                        <div class="component slds-hide" data-id="Fuel_Type__c">
                                            <label class="slds-form-element__label">
                                                <abbr class="slds-required" title="required">* </abbr>Fuel Type</label>
                                            <lightning-combobox name="Fuel_Type__c" label="Fuel Type" variant="label-hidden"
                                                required value={newVehicleRecord.Fuel_Type__c}
                                                disabled={desableField.Fuel_Type__c} class="validate" options={fuelTypeOptions}
                                                onchange={handleValueChange}>
                                            </lightning-combobox>
                                        </div>


                                        <div class="component slds-hide" data-id="Engine_Category__c" if:false={isTwoWheeler}>
                                            <label class="slds-form-element__label">
                                                <abbr class="slds-required" title="required">* </abbr>Engine Category</label>
                                            <lightning-combobox name="Engine_Category__c" label="Engine Category"
                                                data-name="Engine_Category__c" class="validate" variant="label-hidden" required
                                                value={newVehicleRecord.Engine_Category__c} options={engineCategoryOptions}
                                                onchange={handleValueChange} disabled>
                                            </lightning-combobox>
                                        </div>
                                    </template>

                                    <div class="component slds-hide" data-id="Vehicle_Category__c" if:false={isTwoWheeler}>
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Vehicle Category</label>
                                        <lightning-combobox name="Vehicle_Category__c" class="validate"
                                            label="Vehicle Usage" variant="label-hidden"
                                            value={newVehicleRecord.Vehicle_Category__c}
                                            disabled={desableField.Vehicle_Category__c} options={vehicleCategoryOptions} required
                                            onchange={handleCategoryChange}>
                                        </lightning-combobox>
                                    </div>
                                    <!--
                                    <div class="component slds-hide" data-id="Scheme__c" if:false={isTwoWheeler}>
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Scheme</label>
                                        <lightning-combobox name="Scheme__c" class="validate" label="Scheme"
                                            variant="label-hidden" value={schemeOptionValue}
                                            disabled={desableField.Scheme__c} options={vehicleSchemeOptions} required
                                            onchange={handleSchemeChange}>
                                        </lightning-combobox>
                                    </div>
                                    -->

                                    <div class="component slds-hide" data-id="Vehicle_Usage__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Vehicle Usage</label>
                                        <lightning-combobox name="Vehicle_Usage__c" class="validate" label="Vehicle Usage"
                                            variant="label-hidden" value={newVehicleRecord.Original_Vehicle_Usage__c} disabled
                                            options={vehicleUsageOptions} required onchange={handleValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Manufacture_year_month__c">

                                        <!--<label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Manufacture Month</label>
                                        <lightning-input type="text" variant="label-hidden" class="validate"
                                            label="manufactureMonth" required disabled={dataFromApi.manufactureMonth}
                                            name="Manufacture_year_month__c" value={manufactureMonth}
                                            onchange={handleValueChange}>
                                        </lightning-input>-->
                                        <!-- <lightning-combobox name="Manufacture_year_month__c" class="validate" label="manufactureMonth"
                                            variant="label-hidden" value={manufactureMonth} disabled={dataFromApi.manufactureMonth}
                                            options={manufactureMonthOptions} required onchange={handleValueChange}>
                                        </lightning-combobox> -->


                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Manufacture Year</label>
                                        <!-- <lightning-input type="text" variant="label-hidden" class="validate" pattern="^(0|[1-9][0-9]*)$" 
                                            label="manufactureYear" required disabled={dataFromApi.manufactureYear} message-when-pattern-mismatch="Only numbers can be entered"
                                            name="Manufacture_year_month__c" value={manufactureYear} maxlength="4" formatter="number"
                                            onchange={handleValueChange}>
                                        </lightning-input> -->
                                        <!-- Start - SFAU-2799 - Month not required if manufacture year is current year -->
                                        <lightning-combobox
                                            name="Manufacture_year_month__c"
                                            options={manufactureYearOptions}
                                            variant="label-hidden"
                                            label="manufactureYear"
                                            class="validate"
                                            value={manufactureYear}
                                            onchange={handleValueChange}
                                        ></lightning-combobox>


                                        <label class="slds-form-element__label" if:true={allowMonthSelection}>
                                            <abbr class="slds-required" title="required">* </abbr>
                                            Manufacture Month
                                        </label>
                                        <lightning-combobox if:true={allowMonthSelection}
                                            name="Manufacture_year_month__c"
                                            class="validate"
                                            label="manufactureMonth"
                                            variant="label-hidden"
                                            value={manufactureMonth}
                                            disabled={dataFromApi.manufactureMonth}
                                            options={manufactureMonthOptions}
                                            required
                                            onchange={handleValueChange}>
                                        </lightning-combobox>
                                        <!-- END - SFAU-2799 - Month not required if manufacture year is current year -->
                                    </div>
                                

                                    <div class="component slds-hide" data-id="Vehicle_Delivery__c" if:false={isTwoWheeler}>
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>{vehicleDeliveryLabel}</label>
                                        <lightning-combobox name="Vehicle_Delivery__c" class="validate"
                                            label="Vehicle Delivery Status" variant="label-hidden"
                                            value={newVehicleRecord.Vehicle_Delivery__c}
                                            disabled={desableField.Vehicle_Delivery__c} options={vehicleDeliveryOptions} required
                                            onchange={handleVehicleDeliveryChange}>
                                        </lightning-combobox>
                                    </div>

                                </lightning-layout-item>
                            </lightning-layout>
                        </lightning-accordion-section>
                    </lightning-accordion>
                    
                    <template if:false={isSingleImplement}>
                        <template if:true={isCollateralRequired}>
                            <lightning-accordion allow-multiple-sections-open class="example-accordion"
                                active-section-name={activeSections}>
                                <lightning-accordion-section name="D" label="Collateral Dedupe Section">
                                    <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                                        <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                                            class="slds-var-p-horizontal_small" flexibility="auto">
                                            <div class="component" data-id="Engine_Number__c">
                                                <label class="slds-form-element__label">
                                                    <abbr class="slds-required" title="required">* </abbr>Engine no</label>
                                                <lightning-input type="text" variant="label-hidden" label="Engine no" class="validate"
                                                    required value={newVehicleRecord.Engine_Number__c} name="Engine_Number__c"
                                                    onchange={handleValueChange}>
                                                </lightning-input>
                                            </div>
                                            <div class="component" data-id="Chasis_Number__c">
                                                <label class="slds-form-element__label">
                                                    <abbr class="slds-required" title="required">* </abbr>Chasis no</label>
                                                <lightning-input type="text" variant="label-hidden" label="Chasis no" class="validate"
                                                    required value={newVehicleRecord.Chasis_Number__c} name="Chasis_Number__c"
                                                    onchange={handleValueChange}>
                                                </lightning-input>
                                            </div>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                                            class="slds-var-p-horizontal_small" flexibility="auto">

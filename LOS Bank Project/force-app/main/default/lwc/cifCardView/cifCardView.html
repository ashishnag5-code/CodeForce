<template>

    <c-custom-spinner show-spinner={isLoading} spinner-image={spinnerImage}></c-custom-spinner>

    <article class="slds-box">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <lightning-icon icon-name="standard:user" size="small"></lightning-icon>
                <div class="slds-media__body slds-p-right_small">
                    <h2 class="slds-card__header-title">
                        <a class="slds-card__header-link slds-truncate" title={applicantRecord.Name}
                            data-id={applicantRecord.Name}>&nbsp;&nbsp;{applicantRecord.Name}</a>
                    </h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-form-element">
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="12" small-device-size="12" large-device-size="4">
                        <span class="slds-form-element__label">Name of Customer</span>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">{applicantName}</div>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" large-device-size="4">
                        <span class="slds-form-element__label">Entity</span>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">{applicantRecord.Customer_Type__c}
                            <!--{applicantRecord.RecordType.Name}--></div>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" large-device-size="4">
                        <span class="slds-form-element__label">Relationship</span>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">{applicantRecord.RecordType.Name}<!--{applicantRecord.Relationship_with_applicant__c}-->
                            </div>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" large-device-size="4">
                        <span class="slds-form-element__label">Customer Type</span>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">{customerType}</div>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" large-device-size="4">
                        <span class="slds-form-element__label">KYC Approval Status</span>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">{kycApprovalStatus}</div>
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" large-device-size="4">
                        <span class="slds-form-element__label">CIF NO</span>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">{applicantRecord.CIF_No__c}</div>
                        </div>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" small-device-size="12" large-device-size="10">
                        <div class="slds-align_absolute-center">
                            <lightning-button label={buttonLabel} variant="brand" onclick={handleCreateCIF}
                                disabled={cifButtonDisabled} class="slds-p-around_small buttonColor"></lightning-button>
                            <template if:true={ifExposureFetch}>
                                <c-ausf-fetch-button-component is-disabled={disableExposureButton} onexposurefetched={handleExposureEvent} loan-id={applicantRecord.Loan__c} applicant-id={applicantRecord.Id} customer-id={applicantRecord.CIF_No__c}></c-ausf-fetch-button-component>
                            </template>
                            <lightning-button label="CKYC Insert" variant="brand" onclick={handleCKYCInsert}
                                class="slds-p-around_small buttonColor" disabled={disableCKYCInsert}></lightning-button>
                                <!--disabled={ckycInsertDisabled} -->
                            <template if:true={hasCIF}>
                                <lightning-button label="Submit PSL/BSR" variant="brand" onclick={submitPSLBSR}
                                    class="slds-p-around_x-small buttonColor" disabled={disableCBSBSRPSL}></lightning-button>
                            </template>
                        </div>
                    </lightning-layout-item>
                </lightning-layout>
            </div>

            <template if:true={showCarousel}>
                <div class="slds-align_absolute-center slds-p-around_small">
                    <b>
                        <lightning-formatted-text value="Please Select CIF from the Customer List">
                        </lightning-formatted-text>
                    </b>
                </div>
                <lightning-layout multiple-rows>
                    <template for:each={customerList} for:item="customer">
                        <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                            key={customer.CustomerId}>
                            <c-customer-data-display-carousel onselectcif={handleSelectCIF} customer-record={customer}>
                            </c-customer-data-display-carousel>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>
            </template>
            
        </div>
    </article>
</template>

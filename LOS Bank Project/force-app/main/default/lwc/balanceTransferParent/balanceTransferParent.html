<template>
    <div if:true={isLoaded} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
    </div>

    <div class="slds-box slds-box_x-small slds-theme_shade">
        <template if:true={hideSection}>
          <lightning-icon icon-name="utility:chevronright" onclick={handleOpenSection} size="x-small"></lightning-icon>
        </template>
        <template if:false={hideSection}>
          <lightning-icon icon-name="utility:chevrondown" onclick={handleHideSection} size="x-small"></lightning-icon>
        </template>
        &nbsp;<b>{loanApp.BT_Type__c} Balance Transfer ({recordCount})</b>
    </div>

    <template if:false={hideSection}>
        <lightning-card>
            <!--<template if:true={readOnly}>
                <span slot="actions">
                        <lightning-icon class="slds-m-around_x-small" icon-name="action:edit" size="xx-small" onclick={handleEdit}></lightning-icon>
                </span>
            </template>-->
            
            <!--<template if:false={readOnly}>
                <span slot="actions">
                    <lightning-icon class="slds-m-around_x-small" icon-name="action:reject" size="xx-small" onclick={handleReject}></lightning-icon>
    
                </span>               
            </template>-->
            <div style="overflow-x:scroll;" >
            <lightning-layout>
                <lightning-layout-item size="12" small-device-size="12" large-device-size="12">
                   
                        <table class="slds-m-bottom_xx-large slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="">                                    
                                            <lightning-formatted-text value="" class="slds-text-body_small"></lightning-formatted-text>
                                        </div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate" title="Loan Account Number">
                                            <lightning-formatted-text value="Loan Account Number" class="slds-text-body_small"></lightning-formatted-text>
                                        </div>
                                    </th>
                                    <template if:true={isInternalBT}>
                                        <th class="" scope="col">
                                            <div class="slds-truncate">
                                                <lightning-formatted-text value="BT Loan Status" class="slds-text-body_small"></lightning-formatted-text>
                                            </div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate">
                                                <lightning-formatted-text value="POS" class="slds-text-body_small"></lightning-formatted-text>
                                            </div>
                                        </th>
                                    </template>
                                    <template if:false={isInternalBT}>
                                        <th class="" scope="col">
                                            <div class="slds-truncate">
                                                <lightning-formatted-text value="Financial Institute Name" class="slds-text-body_small"></lightning-formatted-text>
                                            </div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate">
                                                <lightning-formatted-text value="NOC before Disbursement" class="slds-text-body_small"></lightning-formatted-text>
                                            </div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate">
                                                <lightning-formatted-text value="BT Amount" class="slds-text-body_small"></lightning-formatted-text>
                                            </div>
                                        </th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={btList} for:item="relatedRecord" for:index="index">
                                <tr class="slds-hint-parent" key={relatedRecord.key}>
                                    <td data-label="Check">
                                        <div class="slds-truncate">
                                            <div class="slds-align_absolute-center">
                                                <lightning-input onchange={handleChange} disabled={readOnly} name="isChecked" access-key={relatedRecord.key} variant="label-hidden" type="checkbox" value={btRecord.isChecked} checked={btRecord.isChecked}></lightning-input>
                                            </div>  
                                        </div>
                                    </td>
                                    <td data-label="Loan Account Number">
                                        <div title={relatedRecord.Loan_Number__c}>
                                            <template if:true={isInternalBT}>
                                            <lightning-combobox name="Loan_Number__c"
                                            access-key={relatedRecord.key}
                                                            data-name="Loan_Number__c"
                                                            required
                                                            read-only={readOnly}
                                                            variant="label-hidden"
                                                            options={loanNumberOptions}
                                                            value={relatedRecord.Loan_Number__c}
                                                            onchange={handleChange}></lightning-combobox>
                                            </template>
                                            <template if:false={isInternalBT}>
                                                <lightning-input name="Loan_Number__c"
                                                access-key={relatedRecord.key}
                                                                data-name="Loan_Number__c"
                                                                required
                                                                read-only={readOnly}
                                                                variant="label-hidden"
                                                                type="text" pattern="^[0-9]*" 
                                                                value={relatedRecord.Loan_Number__c}
                                                                onchange={handleChange}></lightning-input>
                                                </template>
                                    
                                        </div>
                                    </td>
                                    <template if:true={isInternalBT}>
                                        
                                            <td data-label="BT_Loan_Status__c">
                                                <div title={relatedRecord.BT_Loan_Status__c}>

                            
                                                <div style="overflow:visible !important">
                                                    <lightning-combobox name="BT_Loan_Status__c"
                                                    access-key={relatedRecord.key}
                                                    required
                                                    data-name="BT_Loan_Status__c"
                                                    read-only={readOnly}
                                                    variant="label-hidden"
                                                    options={btLoanStatusOptions}
                                                    value={relatedRecord.BT_Loan_Status__c}
                                                    onchange={handleChange}></lightning-combobox>
                                                </div>
                                                </div>
                                            </td>
                                            
                                        
                                        <td data-label="POS__c">
                                            <div class="slds-truncate" title={relatedRecord.POS__c}>
                                                <lightning-input data-name="POS__c" class="slds-text-body_small"   read-only={readOnly} name="POS__c" variant="label-hidden" access-key={relatedRecord.key} type="number" value={relatedRecord.POS__c} required onchange={handleChange}></lightning-input>                    
                                            </div>
                                        </td>
                                    </template>
                                    
                                    <template if:false={isInternalBT}>
                                        <template if:true={loadIt}>
                                            <template if:true={instituteReadOnly}>
                                                <td data-label="Financial_Institute_Name__c">   
                                                    <lightning-input variant="label-hidden"
                                                    read-only={readOnly} data-name="Financial_Institute_Name__c"
                                                    value={relatedRecord.Financial_Institute_Name__c}></lightning-input>
                                                </td>
                                            </template>
                                            
                                            <template if:false={instituteReadOnly}>
                                                <td data-label="Financial_Institute_Name__c">                      
                                                    <c-generic-custom-lookup name="Financial_Institute_Name__c" record-type-name="Financial Institution Name"
                                                    hide-input-label={hideInpLabel} search-fields="" stepid="0" default-record-id={relatedRecord.InstituteId}
                                                        fieldapi="Financial_Institute_Name__c" object-name="Generic Master"
                                                        s-object-api-name="Generic_Master__c" 
                                                        onlookupselect={handleLookupSelect} key-for-financial-institute={relatedRecord.key}>
                                                    </c-generic-custom-lookup>
                                                </td>
                                            </template>
                                            
                                        </template>
                                        <td data-label="NOC_before_Disbursement__c">                      
                                                <lightning-input onchange={handleChange}
                                                access-key={relatedRecord.key}
                                                data-name="NOC_before_Disbursement__c"
                                                disabled={readOnly}
                                                type="checkbox" 
                                                variant="label-hidden"
                                                name="NOC_before_Disbursement__c"
                                                value={relatedRecord.NOC_before_Disbursement__c}
                                                checked={relatedRecord.NOC_before_Disbursement__c}></lightning-input>
                                        </td>
                                        <td data-label="BT_Amount__c">         
                                            <div class="slds-truncate" title={relatedRecord.BT_Amount__c}>
       
                                            <lightning-input onchange={handleChange}
                                            access-key={relatedRecord.key}
                                                read-only={readOnly}
                                                required
                                                type="text" 
                                                variant="label-hidden"
                                                data-name="BT_Amount__c"
                                                name="BT_Amount__c"
                                                value={relatedRecord.BT_Amount__c}></lightning-input>
                                                </div>
                                        </td>  
                                    </template>
                                </tr>
                                        <!--<c-balance-transfer-child onrecordchange={handleChanges} type={type} collateral={collateral} key={relatedRecord.keyId} bt-type={btType} read-only={readOnly} is-record-saved={relatedRecord.isSaved} ondeletebt={handleDeleteAction} inserted-bt={relatedRecord} onrowaction={handleRowAction} add-b-t={addBT}  key-id={relatedRecord.keyId} loan-app={loanApp}></c-balance-transfer-child>-->
                                </template>
                                <tr class="slds-hint-parent">  
                                    <td data-label="Check">
                                        <div class="slds-truncate">
                                            <div class="slds-align_absolute-center">
                                            </div>  
                                        </div>
                                    </td>
                                    <td data-label="Loan_Account_Number__c">
                                        <div class="slds-truncate">
                                        </div>
                                    </td>
                                    <template if:true={isInternalBT}>
                                        <td data-label="BT_Loan_Status__c">
                                            <div class="slds-truncate"><b>Total POS</b>
                                            </div>
                                        </td>
                                        <td data-label="POS__c">
                                            <div class="slds-truncate"><b>{totalPOS}</b>
                                            </div>
                                        </td>
                                    </template>
                                    <template if:false={isInternalBT}>
                                        <td data-label="Financial_Institute_Name__c">
                                            <div class="slds-truncate">
                                            </div>
                                        </td>
                                        <td data-label="NOC_before_Disbursement__c">
                                            <b><div class="slds-truncate"><b>Total Amount</b>
                                            </div></b>
                                        </td>
                                        <td data-label="BT_Amount__c">
                                           <b><div class="slds-truncate"><b>{totalPOS}</b>
                                        </div></b> 
                                        </td>
                                    </template>
                                </tr>
                            </tbody>
                        </table>
                </lightning-layout-item>
            </lightning-layout>
            </div>
        </lightning-card>
    </template>

    <template if:true={displayButtons}>
        <template if:true={readOnly}>
            <div class="slds-align_absolute-center">
                <span slot="actions">
                    <lightning-icon class="slds-m-around_x-small" icon-name="action:edit" size="xx-small" onclick={handleEdit}></lightning-icon>
            </span>
            </div>
        </template>
        <template if:false={readOnly}>
            <div class="slds-align_absolute-center">
    
                    <lightning-icon class="slds-m-around_x-small" icon-name="action:approval"  size="xx-small" onclick={handleSave}></lightning-icon>
                    <template if:false={isDelete}>
                        <lightning-icon class="slds-m-around_x-small" icon-name="action:new" size="xx-small" onclick={handleAddNewBTInternalRecord}></lightning-icon>
                    </template>
                    <template if:true={isDelete}>
                        <lightning-icon class="slds-m-around_x-small" icon-name="action:delete" size="xx-small" onclick={handleDeleteAction}></lightning-icon>
                    </template>
                </div>
        </template>
    </template>
    <!--<template if:false={addBT}>
        <article class="slds-card slds-card_boundary">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name=custom:custom9 size="medium"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <a class="slds-card__header-link slds-truncate" title="Balance Transfer"
                                onclick={handleGotoRelatedList}>
                                <span>{loanApp.BT_Type__c} Balance Transfer ({recordCount})</span>
                            </a>
                        </h2>
                    </div>
                    <div class="slds-no-flex">
                        <lightning-icon icon-name=action:new size="xx-small" onclick={handleAddNewBTInternalRecord}></lightning-icon>
                    </div>
                </header>
            </div>

            <div class="slds-p-top_small">
                <div class="slds-card__body slds-card__body_inner">
                    <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                        <template for:each={btList} for:item="relatedRecord" for:index="index">
                            <li class="slds-size_1-of-2 slds-small-size_3-of-6 slds-p-horizontal_small slds-p-bottom_small" key={keyIndex}>
                                <c-balance-transfer-child bt-type={btType} is-record-saved={relatedRecord.isSaved} ondeletebt={handleDeleteAction} inserted-bt={relatedRecord} onrowaction={handleRowAction} add-b-t={addBT}  key-id={relatedRecord.keyId} loan-app={loanApp}></c-balance-transfer-child>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>

            <lightning-card class="slds-align_absolute-center slds-p-around_small">
                <template if:true={isInternalBT}>
                    <h1 slot="title" class="slds-align_absolute-center">
                        Total POS: <span class="slds-badge badgeProperty">
                                    <lightning-formatted-number value={totalPOS} format-style="currency" 
                                                                currency-code="INR"></lightning-formatted-number>
                            </span>
                    </h1>
                </template>
                <template if:true={isExternalBT}>
                    <h1 slot="title" class="slds-align_absolute-center">
                        Total BT Amount: <span class="slds-badge badgeProperty">
                                    <lightning-formatted-number value={totalPOS} format-style="currency" 
                                                                currency-code="INR"></lightning-formatted-number>
                            </span>
                    </h1>
                </template>
            </lightning-card>
        </article>
    </template>

    <template if:true={addBT}>
            <c-balance-transfer-child bt-type={btType} type={type} collateral={collateral} product-details={productDetails} inserted-bt={btRecord} ondeletebt={handleDeleteAction} onrowaction={handleRowAction} add-b-t={addBT} onsavebt={handleSave} key-id={keyId} loan-app={loanApp}></c-balance-transfer-child>
    </template>-->
        
</template>

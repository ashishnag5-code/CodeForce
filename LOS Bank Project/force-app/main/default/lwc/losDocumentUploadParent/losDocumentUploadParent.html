            <label class="slds-form-element__label">Additional Information &nbsp;&nbsp;

            </label>
            <lightning-icon icon-name=action:new size="xx-small" onclick={handleAdditionalInformationClick}>
            </lightning-icon>
        </div>
        <lightning-layout multiple-rows class="slds-var-p-bottom_small" if:true={isShowAdditionalInformationsPicklist}>
            <lightning-layout-item size="12" small-device-size="12" large-device-size="12" flexibility="auto"
                class="slds-var-p-horizontal_small">
                <div class="slds-var-m-top_medium">
                    <lightning-combobox class="slds-form-element__label" data-index={index} variant="label-hidden"
                        name="AdditionalInformation" label="Additional Information" value={AdditionalInformationvalue}
                        placeholder="Select Document type" options={AdditionalInformationoptions}
                        onchange={handleAdditionalInformationChange}>
                    </lightning-combobox>
                    <template for:each={fileUploadWrapper} for:item="item" for:index="index">
                        <lightning-pill key={item.doName} label={item.uploadTypeName} name={item.docName} onremove={handleRemove}></lightning-pill>
                    </template>
                </div>
                <div class="slds-var-m-top_medium">
                    <template for:each={fileUploadWrapper} for:item="item" for:index="index">
                        <span key={item}>
                            <c-los-generic-document-upload doc-name={item.docName} upload-type-name={item.uploadTypeName} applicant-id={recordId}></c-los-generic-document-upload>

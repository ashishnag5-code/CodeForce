<template>
    <template if:true={isModalOpen}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Scheme is not eligible</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_small" id="modal-content-id-1">
                    To select this scheme, following parameters to be met:
                    <div class="slds-grid">
                        <span class="slds-size_1-of-2">
                            <span class="slds-p-around_small">
                                <p class="slds-text-heading_small">Option 1: Update Loan Details</p>
                                <p><b>ROI</b> - {schemeRecord.MINROI__c} to {schemeRecord.MAXROI__c}</p>
                                <p><b>Amount</b> - {schemeRecord.MINLOANAMOUNT__c} to {schemeRecord.MAXLOANAMOUNT__c}</p>
                                <p><b>Tenure</b> - {schemeRecord.MINTENURE__c} to {schemeRecord.MAXTENURE__c}</p>
                            </span>
                        </span>
                        <span class="slds-size_1-of-2 slds-border_left slds-p-left_medium">
                            <p class="slds-text-heading_small">Option 2: Choose other scheme</p>
                        </span>
                    </div>
                    </br>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-grid slds-grid_align-spread slds-modal__footer">
                    <!-- <lightning-button-group> -->
                        <lightning-button label="Update Loan Details" onclick={updateDetails}></lightning-button>
                        <lightning-button label="Choose Scheme" onclick={closeModal}></lightning-button>
                    <!-- </lightning-button-group> -->
                    <!--<button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={updateDetails} title="UpdateLoanAppDetail">UpdateLoanDetails</button>-->
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

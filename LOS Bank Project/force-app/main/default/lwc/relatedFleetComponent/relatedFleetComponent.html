<template>
	<!--<div if:true={isLoaded} class="slds-is-relative">
		<lightning-spinner alternative-text="Loading..." variant="brand">
		</lightning-spinner>
	</div>-->
	<c-custom-spinner show-spinner={isLoading} spinner-image={spinnerImage}></c-custom-spinner>
	
	<!--Generic Applicant Selection--> <!--This will be shown oly when cbs Loan records of wheelss product is present-->
	<template lwc:if={isLoanRecords}>
		<c-applicant-selection record-val={recordId} onselection={handleChange}
			label-text='Applicant List'></c-applicant-selection>
		<lightning-layout multiple-rows class="slds-p-bottom_small">
			<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
				class="slds-p-horizontal_small" flexibility="auto">
				<lightning-button class="slds-m-top--medium" label='Fetch' onclick={handleEnquiry}
					variant="brand"></lightning-button>
			</lightning-layout-item>
		</lightning-layout>
	</template>
	<!--End-->
	
	<!-- Existing Fleet Section-->
	<template if:true={showMainSection}>
		<template if:false={addNewFleet}>
			<div class="slds-card__header slds-grid ">
				<header class="slds-media slds-media_center slds-has-flexi-truncate">
					<div class="slds-media__figure">
						<lightning-icon icon-name=custom:custom9 size="medium"></lightning-icon>
					</div>
					<div class="slds-media__body">
						<h2 class="slds-card__header-title">
	
							<a class="slds-card__header-link slds-truncate" title="Fleets"
								onclick={handleGotoRelatedList}>
								<span>Fleets ({recordCount})</span>
							</a>
						</h2>
					</div>
					<div class="slds-no-flex">
						<template if:true={showFleetInsertion}>
							<lightning-icon icon-name=action:new size="small" onclick={handleFleetInformationClick}>
							</lightning-icon>
						</template>
					</div>
				</header>
			</div>
	
			<div class="slds-card__body slds-card__body_inner">
				<ul class="slds-grid slds-wrap slds-grid_pull-padded">
					<template for:each={fleetsLst} for:item="relatedRecord">
	
						<li class="slds-size_1-of-1 slds-medium-size_3-of-6 slds-p-horizontal_small slds-p-bottom_small"
							key={relatedRecord.Id} data-id={relatedRecord.Id} data-record-name="ViewMoreInformation">
							<article class="slds-box">
								<div class="slds-card__header slds-grid">
									<header class="slds-media slds-media_center slds-has-flexi-truncate">
										<div class="slds-media__figure">
											<lightning-icon icon-name=custom:custom9 size="small">
											</lightning-icon>
										</div>
										<div class="slds-media__body">
											<h2 class="slds-card__header-title">
												<a class="slds-card__header-link slds-truncate"
													title={relatedRecord.Name} data-id={relatedRecord.Id}
													onclick={navigateToAppRecordPage}>{relatedRecord.Name}</a>
											</h2>
										</div>
										<div class="slds-no-flex slds-grid">
											<div class="slds-size_1-of-2">
												<lightning-icon icon-name=action:delete size="x-small"
													data-id={relatedRecord.Id} data-button="delete"
													data-record-name={relatedRecord.Name}
													alternative-text={relatedRecord.Name} title={relatedRecord.Name}
													onclick={handleRowAction}>
												</lightning-icon>
											</div>
											<div class="slds-size_1-of-2 slds-p-left_xxx-small">
												<lightning-icon icon-name=action:edit size="x-small"
													data-id={relatedRecord.Id} data-button="edit"
													data-record-name={relatedRecord.Name}
													alternative-text={relatedRecord.Name} title={relatedRecord.Name}
													onclick={handleRowAction}>
												</lightning-icon>
											</div>
										</div>
									</header>
	
								</div>
								<div class="slds-card__body slds-card__body_inner">
									<div class="slds-form-element" key={relatedRecord.Id}>
										<span class="slds-form-element__label">Name</span>
										<div class="slds-form-element__control">
											<div class="slds-form-element__static">
												{relatedRecord.Name}
											</div>
										</div>
										<span class="slds-form-element__label">Relationship with borrower</span>
										<div class="slds-form-element__control">
											<div class="slds-form-element__static">
												{relatedRecord.Relationship_with_borrower__c}
											</div>
										</div>
										<span class="slds-form-element__label">Type of Vehicle</span>
										<div class="slds-form-element__control">
											<div class="slds-form-element__static">
												{relatedRecord.Type_of_Vehicle__c}
											</div>
										</div>
										<span class="slds-form-element__label">Vehicle Number</span>
										<div class="slds-form-element__control">
											<div class="slds-form-element__static">
												{relatedRecord.Vehicle_Number__c}
											</div>
										</div>
										<span class="slds-form-element__label">Vehicle Make/Model</span>
										<div class="slds-form-element__control">
											<div class="slds-form-element__static">
												{relatedRecord.Vehicle_Make_Model__c}
											</div>
										</div>
									</div>
								</div>
							</article>
						</li>
					</template>
				</ul>
			</div>
		</template>
	</template>
	<!--End -->
	
	
	
	<!-- Add New Fleet  Details-->
	<template if:true={addNewFleet}>
		<lightning-card title="Add New Fleet Information" icon-name="standard:address" class="slds-box">
			<lightning-layout multiple-rows class="slds-p-bottom_small">
				<!-- R2 || Changes Added for All Products || START -->
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<lightning-combobox
						name="applicant"
						label="Applicant Name"
						options={applicantListOptions}
						value={applicantValue}
						onchange={handleChange}>
					</lightning-combobox>
				</lightning-layout-item>
				
				<!-- R2 ||Show Name Field only if they select Others -->
				<template if:true={showNameField}>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label"></abbr>Name</label>
					<lightning-input type="text" name="Name" label="Name" data-name="Name" class=""
						variant="label-hidden" value={fleetRecord.Name} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				</template>
				<!--End -->
				<!-- R2 || TRACTOR and COMMERCIAL SPECIFIC || START -->
				<template lwc:if={isTractorOrCommercial}>
					<template lwc:if={isTractor}>
						<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
							class="slds-p-horizontal_small" flexibility="auto">
							<label class="slds-form-element__label">Fleet owned by</label>
							<lightning-combobox name="Fleet_owned_by__c" label="Fleet owned by"
								data-name="Fleet_owned_by__c" class="" variant="label-hidden"
								value={fleetRecord.Fleet_owned_by__c} options={fleetOwnedOptions}
								onchange={handleValueChange}></lightning-combobox>
						</lightning-layout-item>
					</template>
					<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
						class="slds-p-horizontal_small" flexibility="auto">
						<label class="slds-form-element__label"><abbr class="slds-required" title="required">* </abbr>Type of vehicle</label>
						<lightning-combobox name="Type_of_Vehicle__c" label="Fleet owned by" class="validate " required
							data-name="Type_of_Vehicle__c" variant="label-hidden"
							value={fleetRecord.Type_of_Vehicle__c} options={typeVehicleOptions}
							onchange={handleValueChange}></lightning-combobox>
					</lightning-layout-item>
				</template>
				<!-- R2 || TRACTOR OR COMMERCIAL SPECIFIC || END -->
	
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">Relationship with borrower</label>
					<lightning-combobox name="Relationship_with_borrower__c" label="Relationship with borrower"
						data-name="Relationship_with_borrower__c" class="" variant="label-hidden" disabled={relationDisabled}
						value={fleetRecord.Relationship_with_borrower__c} options={rltnshpWthBrwrOptions}
						onchange={handleValueChange}></lightning-combobox>
				</lightning-layout-item>
				<!-- R2 || TRACTOR SPECIFIC || START -->
				<template lwc:if={showRelatedPicklist}>
					<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
						class="slds-p-horizontal_small" flexibility="auto">
						<label class="slds-form-element__label">Relationship to consider</label>
						<lightning-combobox name="Relationship to consider" label="Relationship to consider"
							data-name="Relationship to consider" class="" variant="label-hidden"
							value={relationShipValue} options={relationOptions}
							onchange={handleRelationChange}></lightning-combobox>
					</lightning-layout-item>
				</template>
				<!-- R2 || TRACTOR SPECIFIC || END -->
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">Vehicle Number</label>
					<lightning-input type="text" name="Vehicle_Number__c" label="Vehicle Number" pattern="^[a-zA-Z0-9\s]*$"
						data-name="Vehicle_Number__c" class="" variant="label-hidden"  min-length="6" 
						value={fleetRecord.Vehicle_Number__c} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">Vehicle Make Model</label>
					<lightning-input type="text" name="Vehicle_Make_Model__c" label="Vehicle Make Model" pattern="^[a-zA-Z0-9\s]*$"
						data-name="Vehicle_Make_Model__c" class="" variant="label-hidden"
						value={fleetRecord.Vehicle_Make_Model__c} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">MFG Year</label>
					<lightning-combobox name="MFG_Year__c" label="MFG Year" data-name="MFG_Year__c" class="" pattern="^[a-zA-Z0-9\s]*$"
						variant="label-hidden" value={fleetRecord.MFG_Year__c} options={mfgYearOptions}
						onchange={handleValueChange}></lightning-combobox>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">HPN Status</label>
					<lightning-combobox name="HPN_Status__c" label="HPN Status" data-name="HPN_Status__c" class=""
						variant="label-hidden" value={fleetRecord.HPN_Status__c} options={hpnStatusOptions}
						onchange={handleValueChange}></lightning-combobox>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<c-generic-custom-lookup data-id='Financial_Institution__c'
						selected-record={recordSelected.Bank_Name__c} name="Financial_Institution__c"
						label="Finance Institution Name" record-type-name="Financial Institution Name" search-fields=""
						stepid="0" fieldapi="Financial_Institution__c" object-name="Generic Master"
						s-object-api-name="Generic_Master__c" required="" onlookupselect={handleLookupSelect}>
					</c-generic-custom-lookup>
				</lightning-layout-item>
				<!-- R2 || COMMERCIAL PRODUCT SPECIFIC || START -->
				<template lwc:if={isCommercial}>
					<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
						class="slds-p-horizontal_small" flexibility="auto">
						<label class="slds-form-element__label">Loan Amount</label>
						<lightning-input type="number" name="Loan_Amount__c" label="Loan Amount"
							data-name="Loan_Amount__c" class="" variant="label-hidden"
							value={fleetRecord.Loan_Amount__c} onchange={handleValueChange}>
						</lightning-input>
					</lightning-layout-item>
				</template>
				<!-- R2 || COMMERCIAL PRODUCT SPECIFIC || END -->
				<!-- R2 || Changes APPLICABLE FOR ALL PRODUCTS -->
				<template lwc:if={showLoanFields}>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label"><abbr class="slds-required" title="required">* </abbr> Loan Tenure (months)</label>
					<lightning-input type="number" name="Loan_Tenure__c" label="Loan Tenure" data-name="Loan_Tenure__c" max="1000" required
						class="validate " variant="label-hidden" value={fleetRecord.Loan_Tenure__c} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label"><abbr class="slds-required" title="required">* </abbr>Installment Paid</label>
					<lightning-input type="number" name="Installment_Paid__c" label="Installment Paid"  max="1000" required
						data-name="Installment_Paid__c" class="validate " variant="label-hidden"
						value={fleetRecord.Installment_Paid__c} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				</template>
				<!--End -->
			</lightning-layout>
			<lightning-layout multiple-rows class="slds-p-around_small">
				<div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium">
					<lightning-icon icon-name="action:reject" size="x-small" alternative-text="Cancel"
						onclick={handleRecordInsertionCancel}></lightning-icon>
					<lightning-icon icon-name="action:approval" size="x-small" alternative-text="Save"
						onclick={handleRecordInsertionSave} class="slds-m-left_small"></lightning-icon>
				</div>
			</lightning-layout>
		</lightning-card>
	</template>
	<!--End -->
	
	<!-- Edit Fleet Section-->
	<template if:true={editFleet}>
		<lightning-card title="Edit Fleet Information" icon-name="custom:custom9" class="slds-box">
			
				
			<lightning-layout multiple-rows class="slds-p-bottom_small">
				<!-- R2 || Changes Added for All Products || START -->
			<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
			class="slds-p-horizontal_small" flexibility="auto">
			<lightning-combobox
				name="applicant"
				label="Applicant Name"
				options={applicantListOptions}
				value={applicantValue}
				onchange={handleChange}>
			</lightning-combobox>
				</lightning-layout-item>
				<!-- R2 ||Show Name Field only if they select Others -->
				<template if:true={showNameField}>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label"></abbr>Name</label>
					<lightning-input type="text" name="Name" label="Name" data-name="Name" class=""
						variant="label-hidden" value={fleetRecord.Name} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				</template>
				<!-- R2 || TRACTOR SEPECIFIC || START -->
				<template lwc:if={isTractorOrCommercial}>
					<template lwc:if={isTractor}>
						<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
							class="slds-p-horizontal_small" flexibility="auto">
							<label class="slds-form-element__label">Fleet owned by</label>
							<lightning-combobox name="Fleet_owned_by__c" label="Fleet owned by"
								data-name="Fleet_owned_by__c" class="" variant="label-hidden"
								value={fleetRecord.Fleet_owned_by__c} options={fleetOwnedOptions}
								onchange={handleValueChange}></lightning-combobox>
						</lightning-layout-item>
					</template>
					<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
						class="slds-p-horizontal_small" flexibility="auto">
						<label class="slds-form-element__label"><abbr class="slds-required" title="required">* </abbr>Type of vehicle</label>
						<lightning-combobox name="Type_of_Vehicle__c" label="" data-name="Type_of_Vehicle__c" class="validate " required
							variant="label-hidden" value={fleetRecord.Type_of_Vehicle__c} options={typeVehicleOptions}
							onchange={handleValueChange}></lightning-combobox>
					</lightning-layout-item>
				</template>
				<!-- R2 || TRACTOR SEPECIFIC || END -->
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">Relationship with borrower</label>
					<lightning-combobox name="Relationship_with_borrower__c" label="Relationship with borrower"
						data-name="Relationship_with_borrower__c" class="" variant="label-hidden"
						value={fleetRecord.Relationship_with_borrower__c} options={rltnshpWthBrwrOptions} disabled={relationDisabled}
						onchange={handleValueChange}></lightning-combobox>
				</lightning-layout-item>
				<!-- R2 || TRACTOR SPECIFIC || START -->
				<template lwc:if={showRelatedPicklist}>
					<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
						class="slds-p-horizontal_small" flexibility="auto">
						<label class="slds-form-element__label">Relationship to consider</label>
						<lightning-combobox name="Relationship to consider" label="Relationship to consider"
							data-name="Relationship to consider" class="" variant="label-hidden"
							value={relationShipValue} options={relationOptions}
							onchange={handleRelationChange}></lightning-combobox>
					</lightning-layout-item>
				</template>
				<!-- R2 || TRACTOR SPECIFIC || END -->
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">Vehicle Number</label>
					<lightning-input type="text" name="Vehicle_Number__c" label="Vehicle Number" pattern="^[a-zA-Z0-9\s]*$"
						data-name="Vehicle_Number__c" class="" variant="label-hidden"  min-length="6" 
						value={fleetRecord.Vehicle_Number__c} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">Vehicle Make Model</label>
					<lightning-input type="text" name="Vehicle_Make_Model__c" label="Vehicle Make Model" pattern="^[a-zA-Z0-9\s]*$"
						data-name="Vehicle_Make_Model__c" class="" variant="label-hidden"
						value={fleetRecord.Vehicle_Make_Model__c} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">MFG Year</label>
					<lightning-combobox name="MFG_Year__c" label="MFG Year" data-name="MFG_Year__c" class=""
						variant="label-hidden" value={fleetRecord.MFG_Year__c} options={mfgYearOptions}
						onchange={handleValueChange}></lightning-combobox>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label">HPN Status</label>
					<lightning-combobox name="HPN_Status__c" label="HPN Status" data-name="HPN_Status__c" class=""
						variant="label-hidden" value={fleetRecord.HPN_Status__c} options={hpnStatusOptions}
						onchange={handleValueChange}></lightning-combobox>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<!--c-generic-custom-lookup data-id="Financial_Institution__c" selected-record={recordSelected.Bank_Name__c} name="Financial_Institution__c" label="Financial Institution Name"
						record-type-name="Financial Institution Name" dependent-field-api="" dependent-picklist-value=""
						dependent-field-second-api="" dependent-picklist-second-value="" dependent-field-third-api=""
						dependent-picklist-third-value="" dependent-field-fourth-api=""
						dependent-picklist-fourth-value="" search-fields="" stepid="0"
						fieldapi="Financial_Institution__c" object-name="Generic Master"
						s-object-api-name="Generic_Master__c" default-record-id="" required=""
						onlookupselect={handleLookupSelect}>
					</c-generic-custom-lookup-->
					<c-generic-custom-lookup data-id='Financial_Institution__c'
						selected-record={recordSelected.Bank_Name__c} name="Financial_Institution__c"
						label="Finance Institution Name" record-type-name="Financial Institution Name" search-fields=""
						stepid="0" fieldapi="Financial_Institution__c" object-name="Generic Master"
						s-object-api-name="Generic_Master__c" required="" onlookupselect={handleLookupSelect}>
					</c-generic-custom-lookup>
				</lightning-layout-item>
				<!-- R2 || COMMERCIAL PRODUCT SPECIFIC || START -->
				<template lwc:if={isCommercial}>
					<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
						class="slds-p-horizontal_small" flexibility="auto">
						<label class="slds-form-element__label">Loan Amount</label>
						<lightning-input type="number" name="Loan_Amount__c" label="Loan Amount" pattern="[0-9]"
							data-name="Loan_Amount__c" class="" variant="label-hidden"
							value={fleetRecord.Loan_Amount__c} onchange={handleValueChange}>
						</lightning-input>
					</lightning-layout-item>
				</template>
				<!-- R2 || COMMERCIAL PRODUCT SPECIFIC || END -->
				<!-- R2 || Changes APPLICABLE FOR ALL PRODUCTS -->
				<template lwc:if={showLoanFields}>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label"> <abbr class="slds-required" title="required">* </abbr> Loan Tenure</label>
					<lightning-input type="number" name="Loan_Tenure__c" label="Loan Tenure" data-name="Loan_Tenure__c" max="1000" required
						class="validate " variant="label-hidden" value={fleetRecord.Loan_Tenure__c} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				<lightning-layout-item size="12" small-device-size="12" large-device-size="6"
					class="slds-p-horizontal_small" flexibility="auto">
					<label class="slds-form-element__label"><abbr class="slds-required" title="required">* </abbr> Installment Paid</label>
					<lightning-input type="number" name="Installment_Paid__c" label="Installment Paid" max="1000" required
						data-name="Installment_Paid__c" class="validate " variant="label-hidden"
						value={fleetRecord.Installment_Paid__c} onchange={handleValueChange}>
					</lightning-input>
				</lightning-layout-item>
				</template>
			</lightning-layout>
			<lightning-layout multiple-rows class="slds-p-around_small">
				<div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium">
					<lightning-icon icon-name="action:reject" size="x-small" alternative-text="Cancel"
						onclick={handleRecordCancel}></lightning-icon>
					<lightning-icon icon-name="action:approval" size="x-small" type="submit" alternative-text="Save"
						onclick={handleRecordUpdate} class="slds-m-left_small"></lightning-icon>
				</div>
			</lightning-layout>
		</lightning-card>
	</template>
	<!--End -->

							class="slds-p-horizontal_small" flexibility="auto">

							<lightning-button class="slds-m-top--medium buttonClass" label='Submit File' onclick={handleSave}

<template>
    <c-custom-spinner show-spinner={isLoading} spinner-image={spinnerImage}></c-custom-spinner>
    <template if:false={boolIsVisible}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open modalScroll">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Restricted Access
                        </h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        {message}
                    </div>
                    <template if:false={isMobile}>
                        <footer class="slds-modal__footer">
                            <lightning-button-group>
                                &nbsp; <lightning-button label="Back" title="Back" icon-name="action:back"
                                    onclick={closeModal} icon-position="right"></lightning-button>
                            </lightning-button-group>
                        </footer>
                    </template>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open backDropBgColor" role="presentation"></div>
    </template>


</template>

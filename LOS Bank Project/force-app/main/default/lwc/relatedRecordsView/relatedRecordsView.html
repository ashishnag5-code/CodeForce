<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-page-header slds-page-header_joined slds-page-header_bleed slds-shrink-none test-headerRegion slds-is-relative"
            style="border-bottom: solid #c9c9c9 1px; border-bottom-left-radius: 0px; border-bottom-right-radius: 0px;">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-standard-opportunity">
                                <lightning-icon icon-name={iconName} alternative-text={sectionLabel} title={sectionLabel} size="small">
                                </lightning-icon>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h2>
                                        <span class="slds-page-header__title slds-truncate" style="font-size: 14px">{sectionLabel} ({countOfRecords})</span>
                                    </h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-meta">
                    <p class="slds-page-header__meta-text slds-text-body--small" style="padding-top: 5px">{countOfRecords}</p>
                </div>
            </div>
        </div>
        <div class="slds-grid listDisplays">
            <div class="slds-grid slds-border__left slds-border__right listViewContainer">
                <lightning-datatable class="slds-max-medium-table_stacked" show-row-number-column key-field="id" data={data} columns={columns} onrowaction={handleRowAction}>
                </lightning-datatable>
            </div>
        </div>
        <template if:false={hideViewAll}>
            <div class="slds-align_absolute-center" style="padding:5px">
                <lightning-button variant="base" label="View All" title="View All" onclick={handleViewAll} class="slds-m-left_x-small"></lightning-button>
            </div>
        </template>
    </article>

    <template if:true={showEditModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Edit Record</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-record-form object-api-name={childAPIName} record-id={currentEditRecordId}
                        layout-type="Full" mode="edit" columns="2" onsuccess={handleSuccess} onerror={handleError} oncancel={closeModal}>
                    </lightning-record-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

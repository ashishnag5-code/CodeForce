<template>
    <template if:true={isRenderPermissionSetCOmplete}>
        <template if:false={isFi}>

            <c-field-investigation-agent-mapping record-id={recordId} object-api-name={objectApiName} is-reassign-permission={isReassignPermission} is-retrigger-permission={isRetriggerPermission}
                is-re-trigger=true></c-field-investigation-agent-mapping>
        </template>

    </template>
    
    <template if:true={isFi}>
        <template if:true={isRetriggerPermission}>
            <lightning-button variant="brand" label="Re-Trigger FI" onclick={openRetriggerModal} class="slds-m-left_x-small buttonColor">
            </lightning-button>

            <template if:true={openModal}>
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <!-- Modal/Popup Box LWC header here -->
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeRetriggerModal}>
                                <lightning-icon icon-name="utility:close"
                                    alternative-text="close"
                                    variant="inverse"
                                    size="small" ></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Re-Trigger FI Record</h2>
                        </header>
                        <!-- Modal/Popup Box LWC body starts here -->
                        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                            <p class="slds-align--absolute-center">
                                Do you want to Re Trigger the Record?
                            </p>
                        </div>
                        <!-- Modal/Popup Box LWC footer starts here -->
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={closeRetriggerModal} title="Cancel">Cancel</button>
                            <button class="slds-button slds-button_brand buttonColor" onclick={handleReTrigger} title="OK">Re Trigger</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </template>
        
    </template>
    <c-common-toast></c-common-toast>
    
</template>

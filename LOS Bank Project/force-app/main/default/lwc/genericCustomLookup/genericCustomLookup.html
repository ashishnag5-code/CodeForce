<template>
    <!-- <div class="slds-form-element" onmouseleave={handleToggleResult} data-source="lookupContainer"> -->
    <div class="slds-form-element" onmouseleave={handleToggleResult} data-source="lookupContainer">
        <div class="slds-combobox_container slds-has-selection">
            <template if:false={hideInputLabel}>
                <template if:true={isRequired}>
                    <label class="slds-form-element__label" for="combobox-id-1">
                            <abbr class="slds-required" title="required">* </abbr>
                        {label}</label>
                </template>
                <template if:false={isRequired}>
                    <label class="slds-form-element__label" for="combobox-id-1">{label}</label>
                </template>
            </template>
            <div class="lookupInputContainer slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
                aria-expanded="false" aria-haspopup="listbox" role="combobox">
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right" role="none">
                    <div class="searchBoxWrapper slds-show">
                        <!--Lookup Input Field-->
                        <lightning-input type="search" data-source="searchInputField" onclick={handleToggleResult}
                            onchange={handleKeyChangeValue} is-loading={isSearchLoading} value={searchKey}
                            variant="label-hidden" placeholder={placeholder} disabled={isDisabled}></lightning-input>
                    </div>
                    <!--Lookup Selected record pill container start-->
                    <div class="pillDiv slds-hide">
                        
                        <template if:true={isPurchaseCityLookup}>    
                            <input type="text" dataset-name="Purchase_City__c" id="combobox-id-1" title={selectedRecord.Purchase_City__c}
                                   value={selectedRecord.Purchase_City__c}
                                class="slds-input slds-combobox__input slds-combobox__input-value" readonly />                                                                                                        
                        </template>   
                        <template if:true={isSourcingNameLookup}>                         
                            <input type="text" dataset-name="Source_Name__c" id="combobox-id-8" title={selectedRecord.Name}
                                   value={selectedRecord.Name}
                                class="slds-input slds-combobox__input slds-combobox__input-value" readonly />                                                                                                        
                        </template>                     
                        <template if:true={isCompanyLookup}>
                            <input type="text" id="combobox-id-3" title={selectedRecord.Company_Name__c}
                                value={selectedRecord.Company_Name__c}
                                class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
                        </template>
                        <template if:true={isBankMasterLookup}>
                            <input type="text" id="combobox-id-4" title={selectedRecord.Bank_Name__c}
                                value={selectedRecord.Bank_Name__c}
                                class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
                        </template>
                        <template if:true={isDealerStateLookup}>
                            <input type="text" dataset-name="Purchase_State__c" id="combobox-id-5" title={selectedRecord.Purchase_State__c}
                                value={selectedRecord.Purchase_State__c}
                                class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
                        </template>
                        <template if:true={isDealerNameLookup}>
                            <input type="text" dataset-name="Account_Name__c" id="combobox-id-6" title={selectedRecord.Name}
                                value={selectedRecord.Name}
                                class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
                        </template>
                        <template if:true={isOutletNameLookup}>
                            <input type="text" dataset-name="Outlet_Name__c" id="combobox-id-7" title={selectedRecord.Outlet_Name__c}
                                value={selectedRecord.Outlet_Name__c}
                                class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
                        </template>
                        <template if:true={isFinancialInstituteLookup}>
                            <input type="text" id="combobox-id-13" title={selectedRecord.Bank_Name__c}
                                value={selectedRecord.Bank_Name__c}
                                class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
                        </template>
                        <template if:false={isPurchaseCityLookup}>
                            <template if:false={isSourcingNameLookup}>  
                            <template if:false={isCompanyLookup}>
                                <template if:false={isBankMasterLookup}>
                                    <template if:false={isDealerStateLookup}>
                                        <template if:false={isDealerNameLookup}>
                                            <template if:false={isOutletNameLookup}>
                                                <template if:false={isFinancialInstituteLookup}>
                                                <span class="slds-icon_container slds-combobox__input-entity-icon">
                                                    <lightning-icon icon-name={iconName} size="x-small" alternative-text="icon">
                                                    </lightning-icon>
                                                </span>
                                                <input type="text" id="combobox-id-2" title={selectedRecord.Name}
                                                    value={selectedRecord.Name} dataset-name={recordTypeName}
                                                    class="slds-input slds-combobox__input slds-combobox__input-value" readonly />
                                                </template>    
                                            </template>
                                        </template>
                                    </template>
                                </template>
                            </template>
                            </template>
                        </template>
                        <button if:false={isDealerDetail} class="slds-button slds-button_icon slds-input__icon slds-input__icon_right slds-button slds-button_icon"
                        title="Remove selected option" disabled={isDisabled}>
                        <lightning-icon icon-name="utility:close" size="x-small" alternative-text="close icon"
                            onclick={handleRemove}></lightning-icon>
                    </button>
                    <button if:true={isDealerDetail} class="slds-button slds-button_icon slds-input__icon slds-input__icon_right slds-button slds-button_icon"
                        title="Remove selected option">
                        <lightning-icon icon-name="utility:close" size="x-small" alternative-text="close icon"
                            onclick={handleRemove}></lightning-icon>
                    </button>
                    </div>                  
                </div>
                <!-- lookup search result part start-->
                <div style="margin-top:0px" id="listbox-id-5"
                    class="slds-dropdown slds-dropdown_length-with-icon-5 slds-dropdown_fluid" role="listbox">
                    <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                        <template for:each={lstResult} for:item="obj">
                            <li key={obj.Id} role="presentation" class="slds-listbox__item">
                                <div data-recid={obj.Id} onclick={handelSelectedRecord}
                                    class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                    role="option">

                                    <template if:true={isPurchaseCityLookup}>
                                        <span style="pointer-events: none;" class="slds-media__body">
                                        <span
                                            class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Purchase_City__c}</span>
                                        </span>
                                    </template>

                                    
                                    <template if:true={isCompanyLookup}>
                                        <span style="pointer-events: none;" class="slds-media__body">
                                            <span
                                                class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Company_Name__c}</span>
                                            </span>
                                     </template>
                                     <template if:true={isBankMasterLookup}>
                                        <span style="pointer-events: none;" class="slds-media__body">
                                            <span
                                                class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Bank_Name__c}</span>
                                            </span>
                                     </template>
                                     <template if:true={isFinancialInstituteLookup}>
                                        <span style="pointer-events: none;" class="slds-media__body">
                                            <span
                                                class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Bank_Name__c}</span>
                                            </span>
                                     </template>
                                     <template if:true={isDealerStateLookup}>
                                        <span style="pointer-events: none;" class="slds-media__body">
                                            <span
                                                class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Purchase_State__c}</span>
                                            </span>
                                     </template>
                                     <template if:true={isDealerNameLookup}>
                                        <span style="pointer-events: none;" class="slds-media__body">
                                            <span
                                                class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Name}</span>
                                            </span>
                                     </template>
                                     <template if:true={isOutletNameLookup}>
                                        <span style="pointer-events: none;" class="slds-media__body">
                                            <span
                                                class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Name}</span>
                                            </span>
                                     </template>
                                    <template if:false={isPurchaseCityLookup}>
                                        <template if:false={isCompanyLookup}>
                                            <template if:false={isBankMasterLookup}>
                                                <template if:false={isDealerStateLookup}>
                                                    <template if:false={isDealerNameLookup}>
                                                        <template if:false={isOutletNameLookup}>
                                                            <template if:false={isFinancialInstituteLookup}>
                                                                <span style="pointer-events: none;"
                                                                    class="slds-media__figure slds-listbox__option-icon">
                                                                    <span class="slds-icon_container">
                                                                        <lightning-icon icon-name={iconName} size="small"
                                                                            alternative-text="icon"></lightning-icon>
                                                                    </span>
                                                                </span>
                                                                <span style="pointer-events: none;" class="slds-media__body">
                                                                    <span
                                                                        class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Name}</span>
                                                                </span>
                                                            </template>
                                                        </template>
                                                    </template>
                                               </template>
                                            </template>
                                        </template>
                                    </template>

                                </div>
                            </li>
                        </template>
                        <!--ERROR msg, if there is no records..-->
                        <template if:false={hasRecords}>
                            <li class="slds-listbox__item" style="text-align: center; font-weight: bold;">No Records
                                Found....</li>
                        </template>
                    </ul>
                </div>
            </div>
            <template if:true={customErrorMessage}>
                <div class="slds-form-element__help validateErrorColor" id="form-error-01">{customErrorMessage}</div>
            </template>           
        </div>
    </div>

        </template>

                            <lightning-avatar src={generateDoSanction} size="large"

                        </span>
                    </template>
                </div>
            </div>

    <!---->
    <template if:true={renderRBMTatkalModal}>
        <!-- made class dynamic for R2-2546 -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class={modalClass}>
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">RBM {systemLetterRequest} Request</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p>
                        <template if:false={renderRemarksSection}>
                            <template if:true={renderFIPendingRBMTatkal}>
                                FI is pending so RBM approval required. Do you want to proceed to raise the request for the generation of {systemLetterRequest}?
                            </template>
                            <template if:true={renderESignPendingRBMTatkal}>
                                E sign is triggered so RBM approval requried. Do you want to proceed to raise the request for the generation of {systemLetterRequest}?
                            </template>
                            <template if:true={renderGenericPendingRBMTatkal}>
                                Do you want to proceed to raise the request for the generation of {systemLetterRequest}?
                            </template>
                        </template>
                    </p>
                    <template if:true={renderRemarksSection}>
                        <lightning-textarea data-id="remarks"
                                        name="remarks" label="Remarks" disabled={disabledValue}
                                        value={approvalRemarks} onchange={handleRemarkChange} >
                        </lightning-textarea>

                    </template>
                    
                    
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand buttonClass" onclick={generateApprovalRequest} data-id={nextButtonLabel} title="Request">{nextButtonLabel}</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

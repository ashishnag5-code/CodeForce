<template>

    <template if:false={addBT}>
        <article class="slds-box">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <template if:true={isRecordSaved}>
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom9" size="small"></lightning-icon>
                        </div>
                    </template>
                    <template if:false={isRecordSaved}>
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:warning" variant="warning" size="small"></lightning-icon>
                        </div>
                    </template>
                    
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <a class="slds-card__header-link slds-truncate"
                                title={btRecord.Name} data-id={btRecord.Name}
                                onclick={navigateToAppRecordPage}>{btRecord.Name}</a>
                        </h2>
                    </div>
                    <div class="slds-no-flex">
                        <lightning-icon icon-name="action:edit" size="x-small" onclick={handleRowAction}></lightning-icon>
                        <lightning-icon icon-name="action:delete" size="x-small" variant="success"
                                    onclick={deleteBT} class="slds-m-around_medium"></lightning-icon>
                    </div>
                </header>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-form-element">
                    <span class="slds-form-element__label">POS</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{btRecord.POS__c}</div>
                    </div>
                    <span class="slds-form-element__label">BT Loan Status</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{btRecord.BT_Loan_Status__c}</div>
                    </div>
                    <span class="slds-form-element__label">Loan Account Number</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{btRecord.Loan_Number__c}</div>
                    </div>
                </div>
            </div>
        </article>
    </template>
    

    <template if:true={addBT}>
        <lightning-card title="Internal BT" icon-name="custom:custom9">
            <span slot="actions">
                <lightning-icon icon-name="action:reject" size="x-small" onclick={handleReject}></lightning-icon>
            </span>
            <lightning-layout multiple-rows>
                <lightning-layout-item data-id="POS__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange}
                        required
                        disabled
                        type="text" 
                        label="POS"
                        name="POS__c"
                        value={btRecord.POS__c}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item data-id="BT_Loan_Status__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-combobox name="BT_Loan_Status__c"
                    disabled={readOnly}
                    label="Type of Income"
                    options={btLoanStatusOptions}
                    value={btRecord.BT_Loan_Status__c}
                    onchange={handleChange}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item data-id="Loan_Number__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange}
                        required
                        type="text" 
                        label="Loan Number"
                        name="Loan_Number__c"
                        value={btRecord.Loan_Number__c}></lightning-input>
                </lightning-layout-item>
                
            </lightning-layout>  
            <div class="slds-align_absolute-center">
                <lightning-icon icon-name="action:approval" size="x-small" variant="success"
                                    onclick={saveBT} class="slds-m-around_medium"></lightning-icon>
                <lightning-icon icon-name="action:delete" size="x-small" variant="success"
                                    onclick={deleteBT} class="slds-m-around_medium"></lightning-icon>
            </div>  
        </lightning-card>
    </template>
    
</template>

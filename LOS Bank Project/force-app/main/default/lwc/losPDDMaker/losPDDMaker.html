<template>
    <lightning-card title="PDD Maker" icon-name="standard:lead">
        <template if:true={isloading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>

        <lightning-layout if:true={showPage} multiple-rows class="slds-p-bottom_small">

            <lightning-layout-item size="12" small-device-size="12" large-device-size="12"
                class="slds-p-horizontal_small" flexibility="auto">

                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-var-m-top_medium">
                     <!--   <label class="slds-form-element__label">
                            <abbr class="slds-required" title="required">* </abbr>Vehicle Delivery</label> -->
                        <lightning-combobox label="Vehicle Delivery" placeholder="Select Vehicle Delivery"
                            value={dataObj.vehicleDelivery} options={picklistValues.vehicleDelivery} required
                            name="vehicleDelivery" class="validate" onchange={handleInput}
                            disabled={disableDeferral}>
                        </lightning-combobox>
                    </div>
                    <!--SFAU-5835-->
                    <div if:true={dataObj.isUsedOrCOW} class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-var-m-top_medium">
                        <label class="slds-form-element__label">
                            <abbr class="slds-required" title="required">* </abbr>Case In Deferral</label>
                        <lightning-combobox label="Case In Deferral" placeholder="Select Case In Deferral"
                            value={dataObj.caseDeferral} options={picklistValues.caseDeferral} name="caseDeferral"
                            class="validate" variant="label-hidden" onchange={handleInput} read-only="true" disabled>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-var-m-top_medium">

                        <template lwc:if={renderDeferralCategory}>
                            <label class="slds-form-element__label">
                                <abbr class="slds-required" title="required">* </abbr>Deferral Category</label>
                            <lightning-combobox label="Deferral Category" placeholder="Select Deferral Category"
                                value={dataObj.deferralCategory} options={picklistValues.deferralCategory}
                                name="deferralCategory" class="validate" variant="label-hidden" onchange={handleInput}
                                read-only={isReadOnlyDeferralCategory}>
                            </lightning-combobox>
                        </template>
                    </div>
                </div>
                <br>

                <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>

                    <lightning-accordion-section if:true={isOpsUser} name="pddModule" label="PDD Module"
                        class="accordClass">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Product" name="product" disabled
                                    value={dataObj.product}></lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Dealer Name" name="dealerName" disabled
                                    value={dataObj.dealerName}></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Loan Number" name="loanNumber" disabled
                                    value={dataObj.loanNumber}></lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="CustomerName" name="customerName" disabled
                                    value={dataObj.customerName}></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Loan Amount" name="loanAmount" disabled
                                    value={dataObj.loanAmount}></lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Asset Cost (Ex-Showroom Price / On-Road Price)"
                                    name="assetCost" disabled value={dataObj.assetCost}></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Loan Type" name="loanType" disabled
                                    value={dataObj.loanType}></lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Loan Sub Type" name="loanSubType" disabled
                                    value={dataObj.loanSubType}></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Manufacturing Year" name="manufacturingYear"
                                    disabled value={dataObj.manufacturingYear}></lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Maker" name="maker" disabled value={dataObj.maker}>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Model" name="model" disabled value={dataObj.model}>
                                </lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Case In Deferral" name="caseDeferral" disabled
                                    value={dataObj.caseDeferral}></lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Engine Number" name="engineNo" disabled
                                    value={dataObj.engineNo}></lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input lwc:if={isImplement} type="text" label="Serial Number" name="serialNoImplement" disabled
                                    value={dataObj.serialNoImplement}></lightning-input>
                                <lightning-input lwc:else type="text" label="Chassis Number" name="chasisNumber" disabled
                                    value={dataObj.chasisNumber}></lightning-input>
                            </div>
                        </div>
                    </lightning-accordion-section>
                    <br>
                    <template if:false={hideInvoiceSection}>
                    <lightning-accordion-section lwc:if={isInvoiceSectionVisible} name="documentTypeInvoice" label="Invoice" class="accordClass">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="invoiceStatus" label="Invoice Status" onchange={handleInput}
                                    options={picklistValues.invoiceStatus} disabled={disableInvoice} required={invoiceStatusMandatory}
                                    value={dataObj.invoiceStatus}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Invoice Number" name="invoiceNumber" required={invoiceRequired}
                                    onchange={handleInput}  value={dataObj.invoiceNumber} disabled={disableInvoice}
                                    maxlength=255></lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            
                            <div if:false={isImplement} class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="date" name="invoiceDate" onchange={handleInput} required={invoiceRequired}
                                    date-style="short" placeholder="DD/MM/YYYY" disabled={disableInvoice}
                                    message-when-bad-input="Put date in correct format DD/MM/YYYY"
                                    value={dataObj.invoiceDate} label="Invoice Date" >
                                </lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="number" name="invoiceAmount" label="Invoice Amount" required={invoiceRequired} disabled={disableInvoice}
                                    value={dataObj.invoiceAmount} onchange={handleInput}>
                                </lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div if:false={isImplement} class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="hpnInvoice" label="HPN On Invoice" onchange={handleInput} required={invoiceRequired} disabled={disableInvoice}
                                    options={picklistValues.hpnInvoice}  value={dataObj.hpnInvoice}>
                                </lightning-combobox>
                            </div>
<div lwc:if={isEngineNoVisible} class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input  type="text" label="Engine Number" class="engineNo highlightEngine"
                                    name="engineNo" max-length="255" min-length="13" disabled={disableInvoice}
                                    message-when-too-short="Engine number should be min 13 characters."
                                    data-api="Engine_Number__c" required={invoiceRequired} onchange={handleInput}
                                     value={dataObj.engineNo}>
                                </lightning-input>
                            </div>
</div>
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div lwc:if={isSerialNoVisible} class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input  type="text" label="Serial Number" name="serialNoImplement" max-length="255"
                                    class="serialNoImplement highlightSerial"
                                    data-api="PDD_Implement_Serial_No__c" disabled={disableInvoice}
                                    message-when-bad-input="Only Alphabates and numbers are allowed"
                                    required={invoiceRequired} onchange={handleInput} 
                                    value={dataObj.serialNoImplement}>
                                </lightning-input>
                        </div>

                        <div lwc:else class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input  type="text" label="Chassis Number" name="chasisNumber" max-length="255"
                                    min-length="17" class="chasisNumber highlightChasis"
                                    message-when-too-short="Chassis number should be min 17 characters."
                                    data-api="Chasis_Number__c" disabled={disableInvoice}
                                    message-when-bad-input="Only Alphabates and numbers are allowed"
                                    required={invoiceRequired} onchange={handleInput} 
                                    value={dataObj.chasisNumber}>
                                </lightning-input>
                            </div>
<div lwc:if={isNOCFinanceVisible}  class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="originalNocStatus" label="Original NOC Status" onchange={handleInput} required={invoiceRequired} disabled={disableInvoice}
                                    options={picklistValues.originalNocStatus}  value={dataObj.originalNocStatus}>
                                </lightning-combobox>
                            </div>
                            <div lwc:if={isNOCFinanceVisible}  class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <c-generic-custom-lookup data-id='Financial_Institution__c'
                                    selected-record={dataObj.financierName} name="Financial_Institution__c"
                                    label="Financier Name" record-type-name="Financial Institution Name" search-fields="Bank_Name__c"
                                    stepid="0" data-fieldapi="financierName" fieldapi="Financial_Institution__c" object-name="Generic Master"
                                    s-object-api-name="Generic_Master__c"  onlookupselect={handleLookupSelect}>
                                </c-generic-custom-lookup>
                            </div>

                            <div if:false={dataObj.isUsedOrCOW}
                                class="slds-col slds-size_1-of-1 slds-large-size_2-of-12 slds-m-top_x-large">
                                <lightning-button class="buttonClass slds-var-m-top_medium"
                                    label="Check Duplicate Record" stretch variant="neutral" name='duplicateCheck'
                                    disabled={disableDuplicateCheckButton} onclick={getCollateralList}></lightning-button>
                            </div>
                        </div>
                        <template if:true={invoiceDoc}>
                            <div  class="slds-grid slds-wrap slds-gutters">
                                <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                    <lightning-combobox name="opsActionInvoice" label="Ops Action" disabled={isNotOpsMaker}
                                        onchange={handleOpsDetails} value={invoiceDoc.opsAction} options={OpsActionOptions}
                                        >
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                    <lightning-textarea name="opsRemarkInvoice" label="Ops Remark" disabled={isNotOpsMaker}
                                     onchange={handleOpsDetails}
                                    value={invoiceDoc.opsRemark}
                                    >
                                </lightning-textarea>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                    <lightning-input type="text" label="Document Tracker ID" disabled value={invoiceDoc.documentTrackerId}></lightning-input>
                                </div>
                            </div>
    
                            <div class="slds-grid slds-wrap slds-gutters">
                                <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                    <template if:false={disableInvoice}>
                                        <template if:false={invoiceDoc.isUploded}>
                                            <c-los-generic-document-upload isloading={isloading} isdocmanager="true"
                                                show-upload-component="true" hidefiledetails="true"
                                                collateral-id={invoiceDoc.docName.Collateral__c}
                                                doc-name={invoiceDoc.docName.Document_Master__r.Name}
                                                ondocumentsuccess={handleSuccess}
                                                uploadtypename={invoiceDoc.docName.Document_Master__r.Document_Name__c}>
                                            </c-los-generic-document-upload>
                                        </template>
                                    </template>

                                    <template if:true={invoiceDoc.isUploded} for:each={invoiceDoc.filesList}
                                        for:item="fileRecord" for:index="fileIndex">
                                        <div class="slds-grid slds-gutters" key={fileRecord.contentDocId}>
                                            <lightning-button variant="base" label={fileRecord.fileName}
                                                name={fileRecord.recordId} data-filetpe={fileRecord.fileType}
                                                data-url={fileRecord.url} data-id={fileRecord.contentDocId}
                                                title="Document Name" onclick={handlePreviewClick}
                                                class="linkClass slds-size_2-of-3 slds-col slds-cell-wrap slds-truncate">
                                            </lightning-button>
                                            <a if:true={invoiceDoc.canDownload} target="_blank" 
                                                class="slds-col slds-align_absolute-center" href={fileRecord.downloadurl}
                                                download>
                                                <lightning-icon icon-name="utility:download" size="x-small"
                                                    alternative-text="Download" title="Download"></lightning-icon>
                                            </a>
                                            <lightning-icon class="slds-col slds-align_absolute-center"
                                                icon-name="utility:delete" size="x-small" alternative-text="Delete" if:false={disableInvoice}
                                                title="Delete" name={fileRecord.contentVerId} onclick={handleClickDelete}>
                                            </lightning-icon>
                                            <br />
                                        </div>
                                    </template>
    
                                </div>
                            </div>
                        </template>
                    </lightning-accordion-section>
                    <br>
                    </template>

                    <template if:false={hideInsuranceSection}>
                    <lightning-accordion-section name="documentTypeInsurance" label="Insurance" class="accordClass">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="insuranceStatus" label="Insurance Status" disabled={disableInsurance}
                                    required={insuranceStatusMandatory} onchange={handleInput} options={statusValues}
                                     value={dataObj.insuranceStatus}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Insurance Policy Number" name="insuranceNumber" disabled={disableInsurance}
                                    onchange={handleInput}  value={dataObj.insuranceNumber}
                                    required={requiredInsuranceRC} maxlength=255></lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="date" name="insuranceStartDate" onchange={handleInput}
                                    date-style="short" placeholder="DD/MM/YYYY" required={requiredInsuranceRC} disabled={disableInsurance}
                                    message-when-bad-input="Put date in correct format DD/MM/YYYY"
                                    value={dataObj.insuranceStartDate} label="Insurance Start Date" >
                                </lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="date" name="insuranceEndDate" onchange={handleInput} if:false={dataObj.isUsedOrCOW}
                                    date-style="short" placeholder="DD/MM/YYYY" required={requiredInsuranceRC} disabled={disableInsurance}
                                    message-when-bad-input="Put date in correct format DD/MM/YYYY" min={minInsuranceDate}
                                    value={dataObj.insuranceEndDate} label="Insurance End Date" >
                                </lightning-input>
                                <lightning-input type="date" name="insuranceEndDate" onchange={handleInput} if:true={dataObj.isUsedOrCOW}
                                    date-style="short" placeholder="DD/MM/YYYY" required={requiredInsuranceRC}
                                    message-when-bad-input="Put date in correct format DD/MM/YYYY" disabled={disableInsurance}
                                    value={dataObj.insuranceEndDate} label="Insurance End Date" >
                                </lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Insurance IDV" name="insuranceIDV" required={requiredInsuranceRC}
                                    onchange={handleInput}  value={dataObj.insuranceIDV} disabled={disableInsurance}
                                    maxlength=255></lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="hpnInsurance" label="HPN On Insurance" onchange={handleInput}
                                    required={requiredInsuranceRC} options={picklistValues.hpnInsurance} disabled={disableInsurance}
                                     value={dataObj.hpnInsurance}>
                                </lightning-combobox>
                            </div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="ownershipInsurance" label="Ownership Insurance"
                                    required={requiredInsuranceRC} onchange={handleInput} disabled={disableInsurance}
                                    options={picklistValues.ownershipInsurance} 
                                    value={dataObj.ownershipInsurance}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-input type="text" label="Insurance Agent Name" name="insuranceAgentName"
                                    required={requiredInsuranceRC} onchange={handleInput} disabled={disableInsurance}
                                    value={dataObj.insuranceAgentName} maxlength=255></lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <!-- <lightning-input type="text" label="Insurance Company Name" name="insuranceCompanyName"
                                    required={requiredInsuranceFields} onchange={handleInput} disabled={disableInsurance}
                                    value={dataObj.insuranceCompanyName} maxlength=255></lightning-input>
                                 -->
                                 <c-generic-custom-lookup name="Name__c" label="Insurance Company Name"
                                    record-type-name="Previous Insurer" is-disabled={disableInsurance}
                                    fieldapi="Existing_Policy_Insurer_Company__c"
                                    object-name="Generic Master"
data-fieldapi="insuranceCompany"
                                    s-object-api-name="Generic_Master__c"
                                    default-record-id={dataObj.insuranceCompanyName}
                                    onlookupselect={handleLookupSelect}
                                ></c-generic-custom-lookup>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="thirdPartyInsurance" label="Third Party Insurance"
                                    required={requiredInsuranceRC} onchange={handleInput} disabled={disableInsurance}
                                    options={picklistValues.thirdPartyInsurance} 
                                    value={dataObj.thirdPartyInsurance}>
                                </lightning-combobox>
                            </div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="insuranceType" label="Insurance Type" onchange={handleInput}
                                    required={requiredInsuranceRC} options={picklistValues.insuranceType} disabled={disableInsurance}
                                     value={dataObj.insuranceType}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="insuranceEndorsement" label="Insurance Endorsement"
                                    required={requiredInsuranceRC} onchange={handleInput}
                                    options={picklistValues.insuranceEndorsement} disabled={disableInsurance}
                                    value={dataObj.insuranceEndorsement}>
                                </lightning-combobox>
                            </div>
                        </div>

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">
                                <lightning-combobox name="insuranceDoneBy" label="Insurance Done By"
                                    required={requiredInsuranceRC} onchange={handleInput} disabled={disableInsurance}
                                    options={picklistValues.insuranceDoneBy} 
                                    value={dataObj.insuranceDoneBy}>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-var-m-top_medium">

                        <lightning-button label="Cancel" icon-name="utility:close" if:true={showCancel} disabled={disableDeferral}

                            <lightning-button data-id="modifyCollateral" label="Update Collateral" variant="brand" disabled={disableDeferral} if:true={showModifyCollateral}
                            onclick={handleModifyCollateral} class="buttonClass slds-m-right_small"></lightning-button>
                        <lightning-button label="Save" icon-name="utility:chevronright" icon-position="right" disabled={disableDeferral}
                            onclick={checkRCNotification} class="buttonClass slds-m-right_small" >
                        </lightning-button>
                        <lightning-button label="Save & Submit"  if:true={showSubmit} icon-name="utility:chevronright" icon-position="right"
                        onclick={handleReSubmit} class="buttonClass slds-m-right_small">
                    </lightning-button>
                    </div>
                </lightning-layout-item>

            </template>

            <!-- <lightning-layout-item size="12" small-device-size="12" large-device-size="12">
                    <lightning-button label="Cancel" class="slds-m-right_small" variant="brand-outline" name='cancel'
                        onclick={handleCancel}></lightning-button>
                    <lightning-button label="Submit" disabled={disableSubmit} class="disabled-submit-button"
                        variant="brand" name='save' onclick={handleSubmit}></lightning-button>
            </lightning-layout-item> -->
        </lightning-layout>

        <template if:true={showPopup}>
            <!-- Modal/Popup Box LWC starts here -->
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Modal/Popup Box LWC header here -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close"
                                alternative-text="close"
                                variant="inverse"
                                size="small" ></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Do you wish to continue</h2>
                    </header>
                    <!-- Modal/Popup Box LWC body starts here -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        Invoice and RC details do not match, do you wish to continue ?
                    </div>
                    <!-- Modal/Popup Box LWC footer starts here -->
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_brand" onclick={handleSubmit} title="Yes">Yes</button>
                        <button class="slds-button slds-button_brand" onclick={closeModal} title="No">No</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
         
    </lightning-card>

</template>

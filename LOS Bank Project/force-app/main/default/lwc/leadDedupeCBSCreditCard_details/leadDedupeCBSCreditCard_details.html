<template>
    <c-custom-spinner spinner-image={spinnerImage} show-spinner={isLoading}></c-custom-spinner>
    <lightning-accordion allow-multiple-sections-open>
        <lightning-accordion-section name={objAccountRecord.AccountNumber} label={objAccountRecord.AccountNumber}>
            <lightning-layout>
                <lightning-layout-item flexibility="auto" class="slds-card_boundary">
                    <lightning-card  class="no-wrap" icon-name="standard:account" >
                        <h1 slot="title" class="no-wrap"><a>{objAccountRecord.AccountNumber}</a></h1>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">Loan Number</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.AccountNumber}
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">Product</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.Decode}
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">Customer Relationship</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.CustomerAccountRelation}
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">Loan Status</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.LoanStatus}
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">Account Status</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.AccountStatus}
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">Sanctioned Amount</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.SanctionedAmount}
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">Full Name</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.CustomerFullName}
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">Account Opening Date</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.AccountOpenDate}
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">Last Statement Balance</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.LastStatementBalance}
                            </div>
                        </div>
                        <div class="slds-grid slds-wrap slds-p-around_xx-small">
                            <div class="slds-size_1-of-2">
                                <b><label class="slds-form-element__label">DPD Value</label></b>
                            </div>
                            <div class="slds-size_1-of-2">
                                {objAccountRecord.DPDValue}
                            </div>
                        </div>
                    </lightning-card>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-accordion-section>
        <div class="slds-border_bottom"></div>
    </lightning-accordion>
</template>

<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid ">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name=standard:user size="medium"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Sourcing</span>
                        <!--<a href="#" class="slds-card__header-link slds-truncate" title="Address">
                                    <span>Addresses ({recordCount})</span>
                                </a>-->
                    </h2>
                </div>
                <div class="slds-no-flex">
                </div>
            </header>
        </div>


        <div class="slds-card__body slds-card__body_inner">
            <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                <li class="slds-size_1-of-1 slds-medium-size_3-of-3 slds-p-horizontal_small slds-p-bottom_small"
                     onclick={viewMoreHandler}
                     data-record-name="ViewMoreInformation">
                     <article class="slds-box">
                    
                        <div class="slds-card__body slds-card__body_inner">
                            <lightning-layout horizontal-align="space" multiple-rows>
                                <lightning-layout-item size="6" flexibility="auto">
                                    <template if:true={renderDataObj.sourceChannel}>
                                        <div class="slds-form-element slds-form-element_horizontal" data-id="Sourcing_Channel">
                                            <label class="slds-form-element__label">Source Channel Category</label>
                                            <div class="slds-form-element__control" style="margin: 0.6%;">
                                                {opsSourcingWrapper.sourceChannel}
                                            </div>
                                        </div>

                                    </template>
                                    <template if:true={renderDataObj.dealerName}>
                                        <div class="slds-form-element slds-form-element_horizontal" data-id="Vehicle_Delivered_By">
                                            <label class="slds-form-element__label">Vehicle Deivered By Dealer</label>
                                            <div class="slds-form-element__control" style="margin: 0.6%;">
                                                {opsSourcingWrapper.dealerName}
                                            </div>
                                        </div>

                                    </template>
                                    <template if:true={renderDataObj.roCode}>
                                        <div class="slds-form-element slds-form-element_horizontal" data-id="RO_Code">
                                            <label class="slds-form-element__label">RO Code</label>
                                            <div class="slds-form-element__control" style="margin: 0.6%;">
                                                Applicant Name
                                                
                                            </div>
                                        </div>

                                    </template>
                                    
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Physical_File_Custody">
                                        <label class="slds-form-element__label">Physical File Custody</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Balance_Transfer">
                                        <label class="slds-form-element__label">Balance Transfer</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            HUB
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Loan_Transfer">
                                        <label class="slds-form-element__label">Loan Transfer</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Applicant Name
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="NOC_Status">
                                        <label class="slds-form-element__label">NOC Status(SVSH/SVOH)</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                        <label class="slds-form-element__label">Triggers</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Notepad">
                                        <label class="slds-form-element__label">Notepad</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>
                                    <template if:true={renderDataObj.psl}>
                                        <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                            <label class="slds-form-element__label">PSL/BSR</label>
                                            <div class="slds-form-element__control" style="margin: 0.6%;">
                                                {opsSourcingWrapper.psl}
                                                
                                            </div>
                                        </div>

                                    </template>
                                    
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                        <label class="slds-form-element__label">KYC Status</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>
                                    <template if:true={renderDataObj.dob}>
                                        <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                            <label class="slds-form-element__label">DOB</label>
                                            <div class="slds-form-element__control" style="margin: 0.6%;">
                                                {opsSourcingWrapper.dob}
                                                
                                            </div>
                                        </div>
                                    </template>

                                    <template if:true={renderDataObj.applicantName}>
                                        <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                            <label class="slds-form-element__label">Name</label>
                                            <div class="slds-form-element__control" style="margin: 0.6%;">
                                                {opsSourcingWrapper.applicantName}
                                                
                                            </div>
                                        </div>
                                    </template>
                                    
                                    <template if:true={renderDataObj.applicantAddress}>
                                        <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                            <label class="slds-form-element__label">Address</label>
                                            <div class="slds-form-element__control" style="margin: 0.6%;">
                                                {opsSourcingWrapper.applicantAddress}
                                            </div>
                                        </div>
                                    </template>
                                    

                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                        <label class="slds-form-element__label">Sanction Condition</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                        <label class="slds-form-element__label">Document Status</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                        <label class="slds-form-element__label">Vehicle Document</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                        <label class="slds-form-element__label">Payment Favouring</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>

                                    <template if:true={renderDataObj.repaymentMode}>
                                        <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                            <label class="slds-form-element__label">Repayment Mode Tab</label>
                                            <div class="slds-form-element__control" style="margin: 0.6%;">
                                                {opsSourcingWrapper.repaymentMode}
                                            </div>
                                        </div>
                                    </template>
                                   
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Triggers">
                                        <label class="slds-form-element__label">E-sign Status</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Deal Approved By
                                            
                                        </div>
                                    </div>
                                    
                                    
                                    
                                </lightning-layout-item>
                                <lightning-layout-item size="6" flexibility="auto">
                                    <template if:true={renderDataObj.sourceChannel}>
                                        <div class="slds-form-element slds-form-element_horizontal" data-id="Sourcing_Channel">
                                            <label class="slds-form-element__label">Sourcing Channel/ Dealer Name</label>
                                            <div class="slds-form-element__control" style="margin: 0.6%;">
                                                {opsSourcingWrapper.sourceChannel} / {opsSourcingWrapper.dealerName}                                            </div>
                                        </div>
                                    </template>
                                    
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Scheme_Name">
                                        <label class="slds-form-element__label">Scheme Name</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Branch
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="RO_Name">
                                        <label class="slds-form-element__label">RO Name</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            RO Name
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Custodian_Name">
                                        <label class="slds-form-element__label">Custodian Name</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Custodian Name
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Bank_Name">
                                        <label class="slds-form-element__label">Bank/Financier Name</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            Branch
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="Closer_Amount">
                                        <label class="slds-form-element__label">Closer Amount</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            1000
                                            
                                        </div>
                                    </div>
                                    <div class="slds-form-element slds-form-element_horizontal" data-id="External_BT">
                                        <label class="slds-form-element__label">External BT</label>
                                        <div class="slds-form-element__control" style="margin: 0.6%;">
                                            1000
                                            
                                        </div>
                                    </div>
                                    
                                    
                                </lightning-layout-item>
                            </lightning-layout> 

                           
    
                            
                        </div>
                    </article>
                </li>
                    
            </ul>
            <!--End -->
        </div>
    </article>
    
</template>

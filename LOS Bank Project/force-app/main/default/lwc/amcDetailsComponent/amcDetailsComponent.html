<template>
    <lightning-card>
        <div if:true={isLoaded} class="slds-is-relative">
            <lightning-spinner alternative-text="Loading..." variant="brand">
            </lightning-spinner>
        </div>
        <div slot="actions" class="slds-float--right">
            <lightning-button class="buttonColor" label="Back" icon-position="right" icon-name="action:back"
                variant="brand" onclick={showParentTable}></lightning-button>
        </div>
        <!--New Form
        <template if:true={showAmcNewFormView}>
            <div slot="actions" class="slds-float--right slds-m-around--small">
                &nbsp; <lightning-button  class="buttonColor" label="Submit" icon-position="right" icon-name="action:approval"  variant="brand"
                    onclick={handleSubmit}></lightning-button>
            </div>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th class="" scope="col">
                            <div class="slds-truncate" title="Name">Month</div>
                        </th>
                        <th class="" scope="col">
                            <div class="slds-truncate" title="A/C Number"> Year </div>
                        </th>
                        <th class="" scope="col">
                            <div class="slds-truncate" title="IFSC Code"> Credit </div>
                        </th>
                        <th class="" scope="col">
                            <div class="slds-truncate" title="Bank Name"> Salary Credit </div>
                        </th>


                    </tr>

                </thead>
                <tbody>
                    <template for:each={amcList} for:item="item" for:index="index">
                        <tr key={item.Id} class="slds-line-height_reset">

                            <td data-label="Name" scope="row">
                                <div class="slds-truncate">
                                    <lightning-input type="text" variant="label-hidden" name="month"
                                        onchange={handleChange} value={test}>
                                    </lightning-input>
                                </div>
                            </td>
                            <td data-label="">
                                <div class="slds-truncate">
                                    <lightning-input type="text" variant="label-hidden" name="year"
                                        onchange={handleChange} value={test}></lightning-input>
                                </div>
                            </td>
                            <td data-label="">
                                <div class="slds-truncate">
                                    <lightning-input type="number" variant="label-hidden" name="credit"
                                        onchange={handleChange} value={test}></lightning-input>
                                </div>
                            </td>
                            <td data-label="">
                                <div class="slds-truncate">
                                    <lightning-input type="number" variant="label-hidden" name="salarycredit"
                                        onchange={handleChange} value={test}></lightning-input>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <template if:true={showModal}>
                <lightning-card class="slds-align_absolute-center">
                    <h1>
                        Do you want to add New AMC Details?
                        <div class="slds-align_absolute-center">
                            <lightning-icon class="slds-m-around_small" icon-name="action:approval" size="x-small"
                                alternative-text="" onclick={handleOkay}></lightning-icon>
                            <lightning-icon class="slds-m-around_small" icon-name="action:reject" size="x-small"
                                alternative-text="No" onclick={handleReject}>
                            </lightning-icon>
                        </div>
                    </h1>
                </lightning-card>
            </template>

        </template>
        END New Form-->

        <!--View Form -->
        <template if:true={showView}>
            <div class="table-container">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Name">Month</div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="A/C Number"> Year </div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="IFSC Code"> Credit </div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Bank Name"> Salary Credit </div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Bank Name"> Edit </div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Delete">Delete</div>
                            </th>
                        </tr>

                    </thead>
                    <tbody>
                        <template for:each={amcViewRecords} for:item="relatedRecord" for:index="index">
                            <!-- <template if:true={relatedRecord.analysisData}>-->
                            <tr key={relatedRecord.month} class=" rowHeight slds-line-height_reset">

                                <td data-label="Name" scope="row">
                                    <div class="slds-truncate">
                                        {relatedRecord.month}
                                    </div>
                                </td>
                                <td data-label="">
                                    <div class="slds-truncate">
                                        {relatedRecord.year}
                                    </div>
                                </td>
                                <td data-label="">
                                    <div class="slds-truncate">
                                        {relatedRecord.credit}
                                    </div>
                                </td>
                                <td data-label="">
                                    <div class="slds-truncate">
                                        {relatedRecord.salarycredit}
                                    </div>
                                </td>
                                <td data-label="">
                                    <div class="slds-truncate">
                                        <template if:true={relatedRecord.manualcheck}>
                                            <lightning-icon icon-name=action:edit size="x-small"
                                                title={relatedRecord.month} data-id={relatedRecord.recordId}  alternative-text={relatedRecord.credit}
                                                data-record-name={relatedRecord.year} onclick={handleRowAction}>
                                            </lightning-icon>
                                        </template>
                                    </div>
                                </td>
                                <td data-label="">
                                    <div class="slds-truncate">
                                        <template if:true={relatedRecord.manualcheck}>
                                            <lightning-icon icon-name=action:delete size="x-small"
                                                title={relatedRecord.month} data-id={relatedRecord.recordId}  alternative-text={relatedRecord.credit}
                                                data-record-name={relatedRecord.year} onclick={handleRowDeleteAction}>
                                            </lightning-icon>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                            <!-- </template>-->

                        </template>
                        <!--New Form Section-->
                        <template if:true={showAmcNewFormView}>
                            <template for:each={amcList} for:item="item" for:index="index">
                                <tr key={item.Id} class="slds-line-height_reset">

                                    <td data-label="Name" scope="row">
                                        <div class="slds-truncate">
                                            <lightning-input type="text" variant="label-hidden" name="month"
                                                onchange={handleChange} value={test}>
                                            </lightning-input>
                                        </div>
                                    </td>
                                    <td data-label="">
                                        <div class="slds-truncate">
                                            <lightning-input type="text" variant="label-hidden" name="year"
                                                onchange={handleChange} value={test}></lightning-input>
                                        </div>
                                    </td>
                                    <td data-label="">
                                        <div class="slds-truncate">
                                            <lightning-input type="number" variant="label-hidden" name="credit"
                                                onchange={handleChange} value={test}></lightning-input>
                                        </div>
                                    </td>
                                    <td data-label="">
                                        <div class="slds-truncate">
                                            <lightning-input type="number" variant="label-hidden" name="salarycredit"
                                                onchange={handleChange} value={test}></lightning-input>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </template>
                        <!--End-->
                    </tbody>
                </table>

                <!--Buttons Section-->
                <template if:true={showAmcNewFormView}>
                    <div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium">
                        &nbsp; <lightning-button class="buttonColor" label="Back" icon-position="right"
                            icon-name="action:back" variant="brand" onclick={handleNewFormBack}></lightning-button>
                        <lightning-button class="buttonColor  slds-m-left_small" label="Submit" icon-position="right"
                            icon-name="action:approval" variant="brand" onclick={handleSubmit}></lightning-button>

                    </div>
                   <!-- <template if:true={showModal}>
                        <lightning-card class="slds-align_absolute-center">
                            <h1>
                                Do you want to add New AMC Details?
                                <div class="slds-align_absolute-center">
                                    <lightning-icon class="slds-m-around_small" icon-name="action:approval"
                                        size="x-small" alternative-text="" onclick={handleOkay}></lightning-icon>
                                    <lightning-icon class="slds-m-around_small" icon-name="action:reject" size="x-small"
                                        alternative-text="No" onclick={handleReject}>
                                    </lightning-icon>
                                </div>
                            </h1>
                        </lightning-card>
                    </template>-->
                </template>
                <template if:false={showAmcNewFormView}>
                    <div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium">
                        <lightning-button class="buttonColor" label="Add New" icon-position="right"
                            icon-name="action:new" variant="brand" onclick={handleNew}>
                            <lightning-button class=" buttonColor slds-m-left_small" label="Back" icon-position="right"
                                icon-name="action:back" variant="brand" onclick={showParentTable}></lightning-button>
                        </lightning-button>
                    </div>
                </template>
                <!--End Button Section-->

                <!--Average Details Section-->
                <lightning-layout multiple-rows class="slds-p-left--x-small">
                    <lightning-layout-item padding="around-small" size="12" small-device-size="6" large-device-size="3">
                        <div class="component">
                            <label class="slds-form-element__label"><b> Credit Average </b></label>
                            {creditAverage}
                        </div>
                    </lightning-layout-item>
                    <lightning-layout-item padding="around-small" size="12" small-device-size="6" large-device-size="3">
                        <div class="component">
                            <label class="slds-form-element__label"><b> Salary Credit Average </b></label>
                            {salaryCreditAverage}
                        </div>
                    </lightning-layout-item>
                </lightning-layout>
                <!--End-->
            </div>
        </template>
        <!--End View Form -->

        <!--Edit Form-->
        <template if:true={showEditForm}>
            <lightning-record-edit-form record-id={bankRecordId} object-api-name="Bank_Account_Records__c"
                onsuccess={handleSuccess} onsubmit={handleEditSubmit} mode="readonly">
                <lightning-messages></lightning-messages>

                <lightning-layout multiple-rows class="slds-p-bottom_small">
                    <lightning-layout-item size="12" small-device-size="12" padding="around-small"
                        medium-device-size="12" large-device-size="6">
                        <label class="slds-form-element__label">
                            Month
                        </label>
                        <lightning-input type="text" variant="label-hidden" name="month" onchange={handleEditChange}
                            value={amcSelectedRecords.month}>
                        </lightning-input>


                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" padding="around-small"
                        medium-device-size="12" large-device-size="6">
                        <label class="slds-form-element__label">
                            Year
                        </label>
                        <lightning-input type="text" variant="label-hidden" name="year" onchange={handleEditChange}
                            value={amcSelectedRecords.year}></lightning-input>

                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" padding="around-small"
                        medium-device-size="12" large-device-size="6">
                        <label class="slds-form-element__label">
                            Credit
                        </label>
                        <lightning-input type="text" variant="label-hidden" name="credit" onchange={handleEditChange}
                            value={amcSelectedRecords.credit}></lightning-input>

                    </lightning-layout-item>
                    <lightning-layout-item size="12" small-device-size="12" padding="around-small"
                        medium-device-size="12" large-device-size="6">
                        <label class="slds-form-element__label">
                            Salary Credit
                        </label>
                        <lightning-input type="text" variant="label-hidden" name="salarycredit"
                            onchange={handleEditChange} value={amcSelectedRecords.salarycredit}></lightning-input>
                    </lightning-layout-item>

                </lightning-layout>

                <!--Buttons Section-->
                <lightning-layout multiple-rows class="slds-p-bottom_small">
                    <div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium">
                        &nbsp; <lightning-button class="buttonColor" label="Back" icon-position="right"
                            icon-name="action:back" variant="brand" onclick={handleBack}></lightning-button>
                        <lightning-button class="buttonColor  slds-m-left_small" label="Submit" icon-position="right"
                            icon-name="action:approval" variant="brand" type="submit"></lightning-button>

                    </div>
                </lightning-layout>

            </lightning-record-edit-form>
        </template>
        <!--End Edit Form-->



    </lightning-card>
</template>

<template>
    <div>     
    </div>
    <template if:true={isSanctionRelatedList}>
        <div style="text-align: right; margin-left:10px; margin-bottom:10px;">
            <lightning-button class="slds-m-around_small buttonColor" variant="brand" label="Send Back To Credit" onclick={sendBackToCredit}
                              title="Send Back To Credit">

            </lightning-button>
            <lightning-button class="slds-m-around_small buttonColor" variant="brand" label="Send Back To RO" onclick={sendBackToRO}
                              title='Send Back To RO'>

            </lightning-button>


        </div>
        <div>
            <lightning-datatable columns={columns} 
                                 data={tableData} 
                                 onrowselection={onRowSelection}
                                 key-field="id"></lightning-datatable>
        </div>
    </template>
    <template if:false={isSanctionRelatedList}>
        <div>
            <lightning-datatable columns={columns} 
                                 hide-checkbox-column="true"
                                 data={tableData} 
                                 key-field="id"></lightning-datatable>
        </div>

    </template>

    <template if:true={openRemarksModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Enter Send Back Remarks</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-textarea data-id="remarks"
                                        name="remarks" label="Remarks" disabled={disabledValue}
                                        value={approvalRemarks} onchange={handleRemarkChange} >
                    </lightning-textarea>
                    
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand buttonClass" onclick={sendBackToROSubmit} title="Request">Send Back</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
    
    
</template>

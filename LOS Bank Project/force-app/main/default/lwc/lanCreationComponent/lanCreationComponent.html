<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name=custom:custom9 size="medium"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <a class="slds-card__header-link slds-truncate" title="LAN Creation">
                            <span>LAN Creation</span>
                        </a>
                    </h2>
                </div>

            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                <li class="slds-size_1-of-1 slds-p-horizontal_medium slds-p-bottom_small">
                    <c-lan-creation-card-view user-type={userType} loan-app-record={loanAppRecord}></c-lan-creation-card-view>
                </li>
            </ul>
        </div>
    </article>
</template>

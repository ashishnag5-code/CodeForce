<template>
    <template if:true={isloading}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>
    <div class="slds-var-m-around_medium slds-align_absolute-center">
        
        <template if:true={showCustomUpload}>
            <lightning-input type="file" variant="label-hidden"
            accept={acceptedFormat}
            label="File" onchange={handleClickUpload} data-id="fileId"></lightning-input>
        </template>
        <template if:false={showCustomUpload}>
            <lightning-file-upload
            label="Upload File(Max File size 8Mb)"
            name="fileUploader"
            accept={acceptedFormats}
            record-id={recordId}
            onuploadfinished={handleClickUpload}>
            </lightning-file-upload>
        </template>
    </div>
    <template if:true={showPasswordInput}>
        <lightning-badge class="slds-var-m-top_small slds-var-m-bottom_small slds-align_absolute-center" label="Enter Password if the File is Password Protected"></lightning-badge>
        <lightning-input type="password" 
                                label="Password" 
                                onchange={handlePasswordChange}
                                value={password}></lightning-input>
    </template>
    <template if:false={hidefiledetails}>
        <template if:true={filesUploaded}> 
            <template for:each={uploadedFiles} for:item="item">
                <div key={item.key}>
                    <lightning-accordion allow-multiple-sections-open active-section-name="A">
                        <lightning-accordion-section name="A" label="File Details">
                            <lightning-layout multiple-rows=true>
                                <lightning-layout-item horizontal-align="space">
                                    <lightning-input type="text" readonly label="File Name" value={item.name}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item horizontal-align="space">
                                    <lightning-input type="text" readonly label="File Size" value={item.size}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item horizontal-align="space">
                                    <lightning-input type="text" readonly label="File Status" value={item.status}></lightning-input>
                                </lightning-layout-item>
                                <template if:true={amountNeeded}>
                                    <lightning-layout-item size="12" small-device-size="12" large-device-size="6">
                                        <lightning-input label="Amount" data-id="amountValue" type="number" required formatter="decimal" onchange={handleChange}></lightning-input>
                                    </lightning-layout-item>
                                </template>
                            </lightning-layout>
                            
                        </lightning-accordion-section>
                    </lightning-accordion>
                    <div class="slds-align_absolute-center">
                        <template if:true={showButtons}>
                        <lightning-button size="x-small" disabled={disableDelete} label="Delete File" class="buttonClass slds-var-m-around_small" icon-name="action:delete" onclick={handleDeleteFile}></lightning-button>
                        <lightning-button label="Submit File" size="x-small" class="buttonClass slds-var-m-around_small" icon-name="action:approval" onclick={doSave}></lightning-button>
                        </template>
                    </div>
                </div>
            </template>
        </template>
    </template>
    <template if:true={showSummaryCart}>
            <template for:each={uploadedFiles} for:item="item">
                <div key={item.key}>
                    <lightning-accordion allow-multiple-sections-open active-section-name="A">
                        <lightning-accordion-section name="A" label="File Details">
                            <lightning-layout multiple-rows=true>
                                <lightning-layout-item horizontal-align="space">
                                    <lightning-input type="text" readonly label="File Name" value={item.name}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item horizontal-align="space">
                                    <lightning-input type="text" readonly label="File Size" value={item.size}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item horizontal-align="space">
                                    <lightning-input type="text" readonly label="File Status" value={item.status}></lightning-input>
                                </lightning-layout-item>
                            </lightning-layout>
                            
                        </lightning-accordion-section>
                    </lightning-accordion>
                    <div class="slds-align_absolute-center">
                        <template if:true={showButtons}>
                            <lightning-button label="Submit File" size="x-small" class="slds-var-m-around_small" icon-name="action:approval" onclick={submitToCart}></lightning-button>
                        </template>
                    </div>
                </div>
            </template>
    </template>
    
    <!--<lightning-button variant="brand" label="Submit" title="Submit" onclick={doSave} class="slds-var-m-left_x-small slds-align_absolute-center slds-var-m-top_large slds-var-m-bottom_large"></lightning-button>-->
</template>

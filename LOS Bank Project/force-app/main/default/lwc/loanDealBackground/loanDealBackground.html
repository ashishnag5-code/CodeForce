<template>
    <lightning-card>
        <div class="slds-size_1-of-1 deal-summary__input">

            <lightning-input-rich-text
                value={dealSummary}
                lwc:ref="dealBackground"
                lwc:if={isReadOnly}
            ></lightning-input-rich-text>

            <div class="slds-box" if:false={isReadOnly}>
                <lightning-formatted-rich-text
                    value={dealSummary}
                ></lightning-formatted-rich-text>
            </div>
        </div>

        <div class="slds-align_absolute-center slds-size_1-of-2 slds-p-around_small deal-summary__actions" lwc:if={isReadOnly}>
            <span class="slds-size_1-of-1 slds-grid slds-grid_align-space">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={closeDealBackground}
                ></lightning-button>
    
                <lightning-button
                    label="Save"
                    variant="brand"
                    onclick={saveDealBackground}
                ></lightning-button>
            </span>
        </div>
    </lightning-card>
</template>

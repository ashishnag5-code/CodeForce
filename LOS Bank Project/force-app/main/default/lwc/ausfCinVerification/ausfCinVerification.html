<template>
    <div if:true={isloading}>
        <lightning-spinner alternative-text="Loading...">
        </lightning-spinner>
    </div>

    <lightning-layout>
        <template if:false={showCINData}>
        <lightning-layout-item size="12" small-device-size="12" medium-device-size="12" large-device-size="12">
            <div class="slds-card__body slds-card__body_inner">
                <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                        <li class="slds-size_1-of-1 slds-medium-size_3-of-6 slds-var-p-horizontal_small slds-var-p-bottom_small"
                            data-record-name="ViewMoreInformation">
                            <article class="slds-box">
                                <div class="slds-card__header slds-grid">
                                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                        <div class="slds-media__body">
                                            <h2 class="slds-card__header-title">MCA
                                            </h2>
                                        </div>
                                        <div class="slds-no-flex">
                                            <template if:false={isVerified}>
                                                <lightning-button  style="display:flex;" type="neutral"
                                                name="CIN__c" label="Fetch" onclick={handleVerify}>
                                                </lightning-button>
                                            </template>
                                            <template if:true={isVerified}>
                                                <lightning-icon size="small" variant="success"
                                                    icon-name="utility:success"></lightning-icon>
                                            </template>
                                        </div>
                                    </header>
                                </div>
                                <div class="slds-card__body slds-card__body_inner">
                                    <div class="slds-form-element">
                                        <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                            <div class="slds-size_1-of-1">
                                                <div class="slds-form-element__control">
                                                    <div class="slds-form-element__static">
                                                        <label class="slds-form-element__label">
                                                                <abbr class="slds-required" title="required">* </abbr>Company Name</label>
                                                        <div class="buttonIn">
                                                            <lightning-input type="text" label="Company Name" class="input"
                                                                value={documentCheckListRecord.Document_Number__c} variant="label-hidden"
                                                                name="CIN__c" disabled="true">
                                                            </lightning-input>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <template if:true={showCinNum}>
                                <div class="slds-card__body slds-card__body_inner">
                                    <div class="slds-form-element">
                                        <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                            <div class="slds-size_1-of-1">
                                                <div class="slds-form-element__control">
                                                    <div class="slds-form-element__static">
                                                        <label class="slds-form-element__label">
                                                            Cin Number</label>
                                                        <div class="buttonIn">
                                                            <lightning-input type="text" label="Cin Number" class="input"
                                                                value={cmpCinNum} variant="label-hidden"
                                                                name="CIN__c" disabled="true">
                                                            </lightning-input>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        
                            </article>
                        </li>
                </ul>
            </div>
        </lightning-layout-item>
   
    </template>
    
        <template if:true={showCINData}>
            <lightning-layout-item size="12" small-device-size="12" medium-device-size="12" large-device-size="12">
                <c-generic-data-display onverified={handleIdentifierVerification} identifier-documents={identifierDocuments} onback={showDetails} display-type={dispType} pan-response={response}>
                </c-generic-data-display>
             </lightning-layout-item>
        </template>
    </lightning-layout>
    <lightning-layout>
        <lightning-layout-item size="12" small-device-size="12" medium-device-size="12" large-device-size="12">
            <template if:true={directorDetails}>
                <lightning-datatable
                    key-field="id"
                    data={diRresults}
                    columns={columns}
                    hide-checkbox-column="true">
                </lightning-datatable>
            </template>
            </lightning-layout-item>
    </lightning-layout>
    <lightning-layout>
        <lightning-layout-item size="12" small-device-size="12" medium-device-size="12" large-device-size="12">
            <template if:true={displayVerificationButtons}>
                <div class="slds-align_absolute-center">
                    <lightning-icon class="slds-m-around_small" size="x-small" variant="brand" onclick={handleNotVerified}
                    icon-name="action:reject"></lightning-icon>
                    <lightning-icon class="slds-m-around_small" size="x-small" variant="brand" onclick={handleVerified}
                    icon-name="action:approval"></lightning-icon>
                    <!--<lightning-input name='cpvDocVerified' type="checkbox" label="Verified" onclick={handleChange} value={isVerified} checked={isVerified}></lightning-input>
                    <lightning-button class="slds-m-around_small"  variant="brand" onclick={handleVerified} label="Submit"></lightning-button>-->
                </div>
            </template>
            </lightning-layout-item>
    </lightning-layout>
</template>

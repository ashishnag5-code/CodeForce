<template>
    <div class="slds-page-header">
        <div class="slds-page-header__row">
          <div class="slds-page-header__col-title">
            <div class="slds-media">
              <div class="slds-media__figure">
                <span class="slds-icon_container slds-icon-standard-opportunity" title={fiSummaryViewLabel}>
                    <lightning-icon icon-name="standard:today" alternative-text="Approved" title={fiSummaryViewLabel}></lightning-icon>

                  <span class="slds-assistive-text">{fiSummaryViewLabel}</span>
                </span>
              </div>
              <div class="slds-media__body">
                <div class="slds-page-header__name">
                  <div class="slds-page-header__name-title">
                    <h1>
                      <span class="slds-page-header__title slds-truncate" title={fiSummaryViewLabel}>{fiSummaryViewLabel}</span>
                    </h1>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    <template if:false={checkForNullValues}>
        <template if:true={fiList}>
            <lightning-datatable class="slds-max-medium-table_stacked" data={fiList} columns={columns} key-field="Id" hide-checkbox-column="true">
            </lightning-datatable>
        </template>
        <template if:true={error}>
            {error}
        </template>
    </template>

    <template if:true={checkForNullValues}>
        <div class="slds-notify_container slds-is-relative">
            <div class="slds-notify slds-notify_toast slds-theme_warning" role="status">
                <span class="slds-assistive-text">warning</span>
                <span
                    class="slds-icon_container slds-icon-utility-warning slds-m-right_small slds-no-flex slds-align-top"
                    title="Description of icon when needed">
                    <svg class="slds-icon slds-icon_small" aria-hidden="true">
                        <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#warning"></use>
                    </svg>
                </span>
                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small ">
                        {showMessage}</h2>
                </div>
            </div>
        </div>
    </template>

</template>

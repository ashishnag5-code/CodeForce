<template>

    <div class="slds-border_top">
        <div class="slds-p-top_medium">

            <lightning-card>
                <lightning-accordion allow-multiple-sections-open active-section-name="A">
                    <lightning-accordion-section name="A" label="Land Income" class="accordClass">

                        <template if:true={edit}>
                            <span slot="actions">
                                <lightning-icon title="Edit Land Income Detail" 
                                icon-name="action:edit" size="x-small" 
                                alternative-text="" 
                                access-key={index}
                                class="slds-m-right_small"
                                onclick={handleEdit}></lightning-icon>
                            </span>
                             <!-- Added in R2-->
                             <template if:true={isDelete}>
                             <span slot="actions">
                                <lightning-icon title="Delete Land Income Detail" 
                                icon-name="action:delete" size="x-small" 
                                alternative-text="" 
                                access-key={index}
                                class="slds-m-right_small"
                                onclick={handleDeleteRow}></lightning-icon>
                            </span>
                            </template>
                        </template>

                        <!--<template if:false={edit}>
                            <template if:true={displayButtons}>
                                <span slot="actions">
                                    <lightning-icon title="Close Land Income Detail" 
                                    icon-name="action:reject" size="x-small" 
                                    alternative-text="" 
                                    access-key={index}
                                    class="slds-m-around_small"
                                    onclick={handleClose}></lightning-icon>
                                </span>
                            </template>
                        </template>-->
                <template if:true={showRecordViewForm}>
                    <div class="slds-form">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Crop_Details__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Crop Details</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Crop_Details__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="MSP__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">MSP</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={MSP__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Irrigartion_Source__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Irrigation Source</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Irrigartion_Source__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Area_under_Crop_Unit__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Area Under Crop Unit</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Area_under_Crop_Unit__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Area_under_crop__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Area Under Crop</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Area_under_crop__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Sowing_Month__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Sowing Month</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Sowing_Month__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Harvesting_Month__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Harvesting Month</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Harvesting_Month__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Estimated_Yield__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Estimated Yield</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Estimated_Yield__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Estimated_Sale_Value__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Estimated Sale Value</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Estimated_Sale_Value__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Cost_of_Cultivation__c" class="slds-hide">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Cost of Cultivation</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Cost_of_Cultivation__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" data-id="Net_Revenue__c">
                                <div class="slds-form-element slds-form-element_stacked">
                                    <label class="slds-form-element__label" for="stacked-input-id-01">Net Revenue</label>
                                    <div class="slds-form-element__control">
                                      <input type="text" placeholder="" readonly="" value={Net_Revenue__c} class="slds-input" />
                                    </div>
                                  </div>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>

                </template>
                <template if:false={showRecordViewForm}>
                    <lightning-layout multiple-rows>

                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                        <lightning-combobox name="Crop_Details__c"
                            access-key={index}
                            class="component slds-hide"
                            data-id="Crop_Details__c"
                            label="Crop Details"
                            options={cropOptions}
                            value={Crop_Details__c}
                            read-only={readOnly}
                            onchange={handleCropValueChange}></lightning-combobox>
                    </lightning-layout-item>
                            
                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                        <lightning-input type="number" name="MSP__c" disabled read-only={readOnly} 
                        class="component slds-hide"
                        data-id="MSP__c"
                        label="MSP" value={MSP__c} access-key={index}></lightning-input>
                        
                    </lightning-layout-item>
                            
                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                        <lightning-combobox read-only={readOnly}
                                            name="Irrigartion_Source__c"
                                            label="Irrigation Source"
                                            required
                                            class="component slds-hide"
                                            data-id="Irrigartion_Source__c"
                                            options={irrigationSourceOptions}
                                            value={Irrigartion_Source__c}
                                            access-key={index}
                                            onchange={handleChange}></lightning-combobox>
                    </lightning-layout-item>
                            
                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                            <lightning-input name="Area_under_crop__c"
                                            label="Area Under Crop"
                                            class="component slds-hide"
                                            data-id="Area_under_crop__c"
                                            type="decimal"
                                            step="0.01"
                                            read-only={readOnly}
                                            access-key={index}
                                            value={Area_under_crop__c}
                                            onchange={handleChange}></lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                        <lightning-combobox read-only={readOnly}
                                            name="Area_under_Crop_Unit__c"
                                            label="Area Under Crop Unit"
                                            class="component slds-hide"
                                            data-id="Area_under_Crop_Unit__c"
                                            options={areaUnderCropUnitOptions}
                                            value={Area_under_Crop_Unit__c}
                                            access-key={index}
                                            onchange={handleChange}></lightning-combobox>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                        <lightning-input type="text" label="Sowing Month" 
                        read-only={readOnly} disabled name="Sowing_Month__c" 
                        class="component slds-hide" data-id="Sowing_Month__c" value={Sowing_Month__c} 
                        access-key={index}></lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                        <lightning-input type="text" label="Harvesting Month" disabled 
                        read-only={readOnly} name="Harvesting_Month__c" 
                        class="component slds-hide" data-id="Harvesting_Month__c" value={Harvesting_Month__c} 
                        access-key={index}></lightning-input>
                    </lightning-layout-item>
                            
                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                        <lightning-input label="Estimated Yield" type="number" 
                        read-only={readOnly} class="component slds-hide" data-id="Estimated_Yield__c"
                        disabled name="Estimated_Yield__c" access-key={index} 
                        value={Estimated_Yield__c}></lightning-input>
                    </lightning-layout-item>
                            
                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                        <lightning-input label="Estimated Sale Value" type="number" read-only={readOnly}
                        disabled name="Estimated_Sale_Value__c" access-key={index} step="0.01"
                        class="component slds-hide" data-id="Estimated_Sale_Value__c"
                        value={Estimated_Sale_Value__c}></lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6" class="slds-hide" data-id="Cost_of_Cultivation__c">
                        <lightning-input label="Cost of Cultivation" type="number" read-only={readOnly}
                        disabled name="Cost_of_Cultivation__c" access-key={index} step="0.01"
                        class="component"
                        value={Cost_of_Cultivation__c}></lightning-input>
                    </lightning-layout-item>
                            
                    <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                        <lightning-input label="Net Revenue" type="number" read-only={readOnly}
                        class="component slds-hide" data-id="Net_Revenue__c"
                        disabled name="Net_Revenue__c" access-key={index} step="0.01"
                        value={Net_Revenue__c}></lightning-input>
                    </lightning-layout-item>
                            
                </lightning-layout>
                <lightning-layout multiple-rows class="slds-p-bottom_small slds-p-left--xxx-small">
                    <lightning-layout-item padding="around-small" size="12" small-device-size="12"
                        large-device-size="6">
                        <c-bank-statement-upload-financials loan-app-id={loanAppId} parent-name='financial' showonly-itr=true
                    applicant-id={applicantId} document-type='Bank Account Statement'
                    read-attribute={disableUpload} heading-value="Upload Bank Statement"
                     applicant-record-id={applicantId}
                   ></c-bank-statement-upload-financials>
                    </lightning-layout-item>
                </lightning-layout>
            </template>

            <div class="slds-align--absolute-center">
                <template if:false={edit}>
                <!--<template if:false={displayButtons}>
                    <lightning-icon title="Close Land Income Detail" class="slds-m-around_x-small" icon-name="action:reject" size="x-small" alternative-text="" id={index} onclick={handleClose} 
                        access-key={index}></lightning-icon> 
                </template>
                <template if:true={displayButtons}>
                    <lightning-icon title="Delete Land Income" class="slds-m-around_small" icon-name="action:delete" size="x-small" alternative-text="" id={index} 
                        access-key={key} onclick={handleDeleteRow}></lightning-icon>
                </template>-->
                <lightning-icon title="Close Land Income Detail" class="slds-m-around_x-small" icon-name="action:reject" size="x-small" alternative-text="" id={index} onclick={handleClose} 
                        access-key={index}></lightning-icon> 
                <lightning-icon  title="Save Land Income" class="slds-m-around_small" icon-name="action:approval" size="x-small" alternative-text="" id={index} 
                access-key={index} onclick={saveIncome}></lightning-icon>
            </template>
            </div>

        </lightning-accordion-section>
        </lightning-accordion>
</lightning-card>
    </div>
    </div>
</template>

<template>
    <lightning-card>
        <div class="slds-var-m-around_medium">
        <article class="slds-card">
            <div class="slds-card__header slds-grid">
              <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                  <span class="slds-icon_container slds-icon-standard-account" title="account">
                    <svg class="slds-icon slds-icon_small" aria-hidden="true">
                      <use xlink:href="/assets/icons/standard-sprite/svg/symbols.svg#account"></use>
                    </svg>
                    <span class="slds-assistive-text">Field Investigation</span>
                  </span>
                </div>
                <div class="slds-media__body">
                  <h2 class="slds-card__header-title">
                    <a href="#" class="slds-card__header-link slds-truncate" title="Accounts">
                      <span>Field Investigation </span>
                    </a>
                  </h2>
                </div>
              </header>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <lightning-record-edit-form object-api-name="Field_Investigation__c" onsuccess={handleSuccess} onsubmit ={onSubmitHandler} record-id={recordId}>
                    <lightning-messages>
                    </lightning-messages>
                    <lightning-output-field field-name='Loan_Application__c'></lightning-output-field>
                    <lightning-output-field field-name='FI_Allocation_Date_Time__c' value={currentDateTime}></lightning-output-field>
    
                    <lightning-output-field field-name='FI_Submission_Date_Time__c' value={currentDateTime}></lightning-output-field>
    
                    <lightning-output-field field-name='Name_of_Party__c'></lightning-output-field>
                    <lightning-output-field field-name='Applicant_Type__c'></lightning-output-field>
    
    
    
                    <lightning-output-field field-name='DOB__c'></lightning-output-field>
                    <lightning-output-field field-name='Gender__c'></lightning-output-field>
                    <lightning-output-field field-name='Father_Husband_Name__c'></lightning-output-field>
                    <lightning-output-field field-name='Mobile_No__c'></lightning-output-field>
    
    
    
                    <lightning-output-field field-name='Branch_Name_Code__c'></lightning-output-field>
                    <lightning-output-field field-name='Proposed_vehicle__c'></lightning-output-field>
                    <lightning-output-field field-name='Loan_Amount__c'></lightning-output-field>
                    <lightning-output-field field-name='Loan_Type__c'></lightning-output-field>
                    <lightning-output-field field-name='Type_of_address__c'></lightning-output-field>
                    <lightning-output-field field-name='Full_Allocated_Address__c'></lightning-output-field>
                    <lightning-output-field field-name='Area_Name__c'></lightning-output-field>
                    <lightning-output-field field-name='Business_Name__c'></lightning-output-field>
                    <lightning-input-field field-name='Opening_Remarks__c' required="true" onchange={handleConditions}></lightning-input-field>
                    <template if:true={showQuestionnaireLink}>
                        <lightning-button variant="base" label="Questionnaire Screen" title="Looks like a link" onclick={navigateWithoutAura} class="slds-m-left_x-small"></lightning-button>
    
                    </template>
                    <lightning-input-field field-name='Remarks__c' required={isRemarksMandatory}></lightning-input-field>
                    <lightning-input-field field-name='Address_match__c' onchange={handleConditions}></lightning-input-field>
                    <lightning-input-field field-name='Address__c' required={isAddressMandatory}></lightning-input-field>
                    <lightning-input-field field-name='Punch_the_Location_for_Geo_tag__c' value={currentLocation} disabled="true"></lightning-input-field>
                    <lightning-input-field field-name='FI_Status__c'></lightning-input-field>
                    <lightning-input-field field-name='Negative_Reason__c' ></lightning-input-field>
                    <lightning-input-field field-name='Remark__c' ></lightning-input-field>
    
    
    
                    <lightning-button class="slds-m-top_small" type="submit" label="Update">
                    </lightning-button>
                </lightning-record-edit-form>
            </div>
            </article>
        </div>
        </lightning-card>
</template>

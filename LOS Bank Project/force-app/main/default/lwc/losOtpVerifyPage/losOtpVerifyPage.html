<template>
    <div class="form-group row">
        <div class="col-sm-9" style="padding-right: 0px;">
            <!--Added for Country Code Flag Picker-->
            <p>test</p>
            <div class="iti iti--allow-dropdown">
                <div class="iti__flag-container">
                    <div onclick={toggleIntTelFlagList} class="iti__selected-flag" role="combobox"
                        aria-controls="iti-0__country-listbox" aria-owns="iti-0__country-listbox" aria-expanded="false"
                        tabindex="0" title="India (भारत): +91" aria-activedescendant="iti-0__item-in-preferred">
                        <div class="iti__flag iti__in selectedFlag">
                        </div>
                        <div class="iti__arrow">
                        </div>
                    </div>
                    <ul onclick={handleCountryChange} class="iti__country-list iti__hide" id="iti-0__country-listbox"
                        role="listbox" aria-label="List of countries">
                        <li aria-selected="true" data-country-code="in" data-dial-code="91" role="option"
                            id="iti-0__item-in-preferred" tabindex="-1" class="iti__country iti__preferred iti__active">
                            <div class="iti__flag-box">
                                <div class="iti__flag iti__in">
                                </div>
                            </div>
                            <span class="iti__country-name">
                                India (भारत)</span>
                            <span class="iti__dial-code">
                                +91</span>
                        </li>
                        <li class="iti__divider" role="separator" aria-disabled="true">
                        </li>
                    </ul>
                </div>
                <input class="did-floating-input form-control" disabled={OTPVerified} name="telField" maxlength="14"
                    type="tel" id="phone" data-id="telField" placeholder="e.g. +91  99999-99999" value="+91"
                    autocomplete="off" data-intl-tel-input-id="0" onblur={handleChangePhoneNumberOnBlur}
                    onkeyup={handleChangePhoneNumberOnKeyUp}>
                <label style="display:none;" class="did-floating-label">Mobile</label>
            </div>
        </div>
        <label if:false={isResend} for="inputEmail3" onclick={handleSendOTP} class={OTPClass}>SEND OTP</label>
        <label if:true={isResend} for="inputEmail3" onclick={handleSendOTP} class={OTPClass}>RESEND OTP</label>
    </div>
    <p style="display:none;" data-id="telFieldValidationError" class="red">Please enter a valid mobile number</p>
    <p if:true={wrongCountryCode} class="red">Country code is different from the country which is selected</p>
    <p if:true={pauseResendOTP} style="margin-top:-15px;color:#00000066;" class="red">Resend OTP in <span
            style="color:#00000066;" data-id="sendOTPTimer">30</span> Seconds</p>

    <div class={otpParentDivClass}>
        <div class="col-sm-9  did-floating-label-content" style="padding-right: 0px;">
            <input class="did-floating-input form-control fieldDisabled" data-id="OTPInput" type="text" placeholder=" "
                id="mobile" name="otpField" onblur={handleOTPChangeOnBlur} onkeyup={handleOTPChange} value={otpEntered}
                disabled={disableOTP} maxlength="6">
            <label class={otpLabelClass}>Enter OTP</label>
        </div>
        <template if:false={OTPVerified}><label for="inputEmail3" data-id="verifyOTP"
                class="col-sm-13 col-form-label blue-text otp p-t-14"
                onclick={handleOTPVerification}>VERIFY</label></template>
        <template if:true={OTPVerified}><label for="inputEmail3"
                class="col-sm-13 col-form-label green-text calicon p-t-14"><img src={checkIcon}
                    style="padding-bottom: 3px;"> Verified</label></template>
    </div>
    <p style="display:none;" data-id="otpFieldValidationError" class="red">Enter a valid OTP</p>
    <p if:true={wrongOTP} class="red">The OTP you have entered is wrong.</p>
    <p if:true={wrongOTPLimitHit} class="red">You have entered wrong OTP too many times. Retry in
        {wrongOTPLimitHitCounter} Seconds</p>

</template>

<template>
    <template if:true={isCreditPopOver}>
        <c-ausf-fetch-button-component loan-id={loanId} applicant-id={applicantId} 
                        customer-id={customerId} is-credit-pop-over={isCreditPopOver} ondpdfetched={handleDPDFetched}>
                    </c-ausf-fetch-button-component>
    </template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Check DPD
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    {message}
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button-group>
                        &nbsp; <lightning-button label="Back" title="Back" icon-name="action:back"
                            onclick={closeModal} icon-position="right"></lightning-button>
                    </lightning-button-group>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
</template>

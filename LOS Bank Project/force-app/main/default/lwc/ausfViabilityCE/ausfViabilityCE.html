<template>
    <template lwc:if={isMobile}>
        <lightning-card>
            <h1 slot="title">
                <span style="color: rgb(100, 0, 134)">
                    <lightning-icon class="slds-p-around_small slds-current-color" icon-name="action:adjust_value"
                        size="medium"></lightning-icon>
                </span>&nbsp;
                VIABILITY
            </h1>

            <lightning-accordion allow-multiple-sections-open active-section-name="A">
                <lightning-accordion-section name="A" label="Details" class="accordClass">
                    <span slot="actions">
                        <template if:false={isEdit}>
                            <lightning-icon icon-name="action:edit" onclick={handleOnEditClick}
                                size="x-small"></lightning-icon>
                        </template>
                    </span>
                     <!-- Added in R2-->
                     <template if:true={isDelete}>
                        <template if:false={isEdit}>
                            <span slot="actions">
                                <lightning-icon title="Delete Other Income Detail" icon-name="action:delete" size="x-small"
                                    alternative-text="" access-key={index} class="slds-m-right_small slds-m-left--small"
                                    onclick={handleDeleteRow}></lightning-icon>
                            </span>
                        </template>
                    </template>
                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="text" onchange={handleChange}
                                value={viFinancialRecord.Name_of_Construction_Equipment__c} class="validate" required
                                label="Name of Construction Equipment" name="Name_of_Construction_Equipment__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="text" onchange={handleChange}
                                value={viFinancialRecord.Type_of_work__c} class="validate" required label="Type of work"
                                name="Type_of_work__c">
                            </lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-accordion-section>
                <lightning-accordion-section name="B" label="Income :" class="accordClass">
                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} class="validate" required step="0.01"
                                value={viFinancialRecord.No_of_hours_day__c} label="No of hours / day"
                                name="No_of_hours_day__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} class="validate" required step="0.01"
                                value={viFinancialRecord.No_of_working_days_per_month__c}
                                label="No. of working days per month" name="No_of_working_days_per_month__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} disabled step="0.01"
                                value={viFinancialRecord.Monthly_running_in_hours__c} label="Monthly running in hours"
                                name="Monthly_running_in_hours__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} class="validate" required step="0.01"
                                value={viFinancialRecord.Rate_hour__c} label="Rate / hour" name="Rate_hour__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} disabled step="0.01"
                                value={viFinancialRecord.Monthly_charges_for_hire__c} label="Monthly charges for hire"
                                name="Monthly_charges_for_hire__c">
                            </lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-accordion-section>
                <lightning-accordion-section name="C" label="Expenses :" class="accordClass">
                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} class="validate" required step="0.01"
                                value={viFinancialRecord.Fuel_average_in_liter_per_hour__c}
                                label="Fuel average in liter per hour" name="Fuel_average_in_liter_per_hour__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} class="validate" required step="0.01"
                                value={viFinancialRecord.Cost_per_liter_of_fuel__c} label="Cost per liter of fuel"
                                name="Cost_per_liter_of_fuel__c">
                            </lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-accordion-section>
                <lightning-accordion-section name="D" label="COST OF OWNERSHIP :" class="accordClass">

                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} disabled step="0.01"
                                value={viFinancialRecord.Fuel_Cost__c} label="Fuel Cost" name="Fuel_Cost__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} class="validate" required step="0.01"
                                value={viFinancialRecord.Drivers_Salary_Allowances__c}
                                label="Drivers Salary + Allowances" name="Drivers_Salary_Allowances__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} class="validate" required step="0.01"
                                value={viFinancialRecord.Insurance_taxes__c} label="Insurance/taxes etc"
                                name="Insurance_taxes__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} class="validate" required step="0.01"
                                value={viFinancialRecord.Repair_Servicing_Miscellaneous_Charges__c}
                                label="Repair, Servicing & Miscellaneous Charges"
                                name="Repair_Servicing_Miscellaneous_Charges__c">
                            </lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} disabled step="0.01"
                                value={viFinancialRecord.Total_Expenses__c} label="Total Expenses"
                                name="Total_Expenses__c">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} disabled step="0.01"
                                value={viFinancialRecord.Free_Cash_Flow__c} label="Free Cash Flow"

                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">
                            <lightning-input type="Number" onchange={handleChange} class="validate" required step="0.01"

                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" large-device-size="4" small-device-size="12"
                            padding="around-small">

                                name="FCF_EMI__c">
                            </lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-accordion-section>
            </lightning-accordion>
            <template if:true={isEdit}>
                <lightning-button class="slds-align_absolute-center buttonColor" variant="brand" label="Save Template"
                    onclick={handleSave}></lightning-button>
            </template>
        </lightning-card>

<template>

    <template if:false={addSchedule}>
        <article class="slds-box">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <template if:true={isRecordSaved}>
                        <div class="slds-media__figure">
                            <lightning-icon icon-name=custom:custom9 size="small"></lightning-icon>
                        </div>
                    </template>

                    <template if:false={isRecordSaved}>
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:warning" variant="warning" size="small"></lightning-icon>
                        </div>
                    </template>
                    
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <a class="slds-card__header-link slds-truncate"
                                title={emiSchedule.Name} data-id={emiSchedule.Id}
                                onclick={navigateToAppRecordPage}>{emiSchedule.Name}</a>
                        </h2>
                    </div>
                    <div class="slds-no-flex">
                        <lightning-icon icon-name=action:edit size="x-small" onclick={handleRowAction}></lightning-icon>
                    </div>
                </header>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-form-element">
                    <span class="slds-form-element__label">Stage Number</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{emiSchedule.Stage_Number__c}</div>
                    </div>
                    <span class="slds-form-element__label">Installment Number</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{emiSchedule.Installment_Number__c}</div>
                    </div>
                    <span class="slds-form-element__label">Installment Amount</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{emiSchedule.Installment_Amount__c}</div>
                    </div>
                </div>
            </div>
        </article>
    </template>
    

    <template if:true={addSchedule}>
        <lightning-card title="Schedule" icon-name="custom:custom9">
            <span slot="actions">
                <lightning-icon icon-name="action:reject" size="x-small" onclick={handleReject}></lightning-icon>
            </span>
            <lightning-layout multiple-rows>
                <lightning-layout-item padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange}
                        required
                        type="Number" 
                        label="Stage Number"
                        name="Stage_Number__c"
                        value={emiSchedule.Stage_Number__c}
                        disabled></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange} type="Number" 
                        required
                        label="Installment Number"
                        name="Installment_Number__c"
                        value={emiSchedule.Installment_Number__c}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange} type="Number" 
                        required
                        label="Installment Amount"
                        name="Installment_Amount__c"
                        value={emiSchedule.Installment_Amount__c}></lightning-input>
                </lightning-layout-item>
            </lightning-layout>  
            <div class="slds-align_absolute-center">
                <lightning-icon icon-name="action:approval" size="x-small" variant="success"
                                    onclick={saveSchedule} class="slds-m-around_medium"></lightning-icon>
            </div>  
        </lightning-card>
    </template>
    
</template>

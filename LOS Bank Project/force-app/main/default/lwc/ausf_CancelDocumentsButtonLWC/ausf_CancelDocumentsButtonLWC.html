<template>
    <c-custom-spinner spinner-image={spinnerImage} show-spinner={isSending}></c-custom-spinner>
    <template if:true={isShowModal}>
        <template if:true={isSmallDevice}>
            <div class="slds-p-around_small" style="text-align :center;">
                <div class="slds-grid slds-gutters">
                    <template if:false={isDisabledSactionLetter}>
                        <div class="slds-col">
                            <span>
                                <lightning-avatar src={cancelDoSanction} size="large"
                                    onclick={handleSanctionLetterCancellation}></lightning-avatar>
                            </span><br />
                            <span>
                                Cancel Sanction
                            </span>
                        </div>
                    </template>
                    <template if:false={isDisabledDOLetter}>
                        <div class="slds-col">
                            <span>
                                <lightning-avatar src={cancelDoSanction} size="large" 
                                    onclick={handleDOLetterCancellation}></lightning-avatar>
                            </span><br />
                            <span>
                                Cancel DO
                            </span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
        <template if:true={isLargeDevice}>
            <div style="text-align :center;">
                <div class="slds-grid slds-gutters slds-grid_align-end">
                    <template if:false={isDisabledSactionLetter}>
                        <span style="margin:0.5%;">
                            <!-- <lightning-button label="Submit to Ops Maker" name="Submit to Ops Maker"
                            onclick={handleSubmitToMaker}></lightning-button>  -->
                            <span>Cancel Sanction</span><br/>
                            <lightning-avatar src={cancelDoSanction} size="large" title="Cancel Sanction Letter"
                                        onclick={handleSanctionLetterCancellation}></lightning-avatar>
                        </span>
                    </template>
                    <template if:false={isDisabledDOLetter}>
                        <span style="margin:0.5%;">
                            <!-- <lightning-button label="Generate DO/Sanction" name="Generate DO/Sanction"
                            onclick={handleDocumentGenerate}></lightning-button>  -->
                            <span>Cancel DO</span><br/>
                            <lightning-avatar src={cancelDoSanction} size="large" title="Cancel DO Letter"
                                        onclick={handleDOLetterCancellation}></lightning-avatar>
                        </span>
                    </template>
                </div>
            </div>
        </template>

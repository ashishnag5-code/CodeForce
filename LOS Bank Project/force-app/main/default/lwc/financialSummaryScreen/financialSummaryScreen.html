<template>
    <div  class="slds-var-p-around_large slds-border_bottom slds-border_right slds-border_left slds-border_top"><!--class="slds-box slds-m-top--small"-->
          <lightning-accordion allow-multiple-sections-open class="example-accordion" active-section-name={activeSubSections}
          >
          <lightning-accordion-section name="B" label="Summary Details">
              <br/>
          <template for:each={applicantsSummaryData} for:item="relatedRecord">
                 <li class="slds-size_1-of-1 slds-medium-size_3-of-6 slds-large-size_3-of-6 slds-p-horizontal_small slds-p-bottom_small"
                          key={relatedRecord.applicantId}>
                          <article class="slds-box">
                              <div class="slds-card__header slds-grid">
                                  <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                      <div class="slds-media__figure">
                                          <lightning-icon icon-name=standard:user size="small">
                                          </lightning-icon>
                                      </div>
                                      <div class="slds-media__body">
                                          <h2 class="slds-card__header-title">
                                              {relatedRecord.applicantName}
                                          </h2>
                                      </div>
                                      <div class="slds-no-flex">
                                      </div>
                                      
                                  </header>
                              </div>
                          <div class="slds-card__body slds-card__body_inner">
                          <div class="slds-grid slds-gutters slds-wrap">
                              <div class="slds-col slds-size_1-of-2">
                                  <span class="slds-form-element">
                                      <label class="slds-form-element__label"><strong>Ownership</strong></label>
                                      <div class="slds-form-element__control" style="margin-top:0.6%;">
                                          {relatedRecord.Ownership}
                                      </div> 
                                  </span> 
                                  <span class="slds-form-element">
                                      <label class="slds-form-element__label"><strong>Method of
                                          assessment</strong></label>
                                      <div class="slds-form-element__control" style="margin-top:0.6%;">
                                          {relatedRecord.MtAssessment}
                                      </div> 
                                  </span> 
                                  <span class="slds-form-element">
                                      <label class="slds-form-element__label"><strong>Total Monthly Income</strong></label>
                                      <div class="slds-form-element__control" style="margin-top:0.6%;">
                                          {relatedRecord.TotalMonthlyIncome}
                                      </div> 
                                  </span> 
                                  <span class="slds-form-element">
                                      <label class="slds-form-element__label">
                                          <strong> Monthly Obligation  </strong></label>
                                      <div class="slds-form-element__control" style="margin-top:0.6%;">
                                          {relatedRecord.MonthlyObligation}
                                      </div>
                                  </span>
                              </div>
                          </div>
                          </div>
                          </article>
                      </li> 
          </template>
          </lightning-accordion-section>
          </lightning-accordion>
      </div>
</template>

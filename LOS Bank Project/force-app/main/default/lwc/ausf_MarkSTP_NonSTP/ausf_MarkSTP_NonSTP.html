<template>
    <template if:true={renderComponent}>
        <lightning-button label="Mark STP" variant="slds-brand" onclick={handleSTPClick}
                          style="float: none;text-align: right;padding-left: 93%;"></lightning-button>


        <template if:true={renderSTPComponent}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Modal/Popup Box LWC header here -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={cancelSTPModal}>
                            <lightning-icon icon-name="utility:close"
                                alternative-text="close"
                                variant="inverse"
                                size="small" ></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Mark STP</h2>
                    </header>
                    <!-- Modal/Popup Box LWC body starts here -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <p class="slds-align--absolute-center">Do you want to Mark the STP OK/ Not Ok?</p>
                        <div>
                            <lightning-textarea data-id="remarks" name="" label="Remarks"  onchange={handleRemarkChange}
                                                value={remarks}></lightning-textarea>

                        </div>
                    </div>
                    <!-- Modal/Popup Box LWC footer starts here -->
                    <footer class="slds-modal__footer">
                        <lightning-button label="Not Ok" class="slds-button_neutral" onclick={markOk_NotOkSTP} data-id="Not Ok" title="Not Ok"></lightning-button>
                        <lightning-button label="Ok" class="slds-m-left--small" variant="brand" onclick={markOk_NotOkSTP} data-id="Ok" title="OK"></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
                          
    </template>
    
</template>

<template>
    <div if:true={isLoaded} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
    </div>
    <template if:false={addNominee}>
        <article class="slds-card slds-card_boundary">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name=custom:custom9 size="medium"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <a class="slds-card__header-link slds-truncate" title="Nominee"
                                onclick={handleGotoRelatedList}>
                                <span>Nominee ({recordCount})</span>
                            </a>
                        </h2>
                    </div>
                    <div class="slds-no-flex">
                        <lightning-icon icon-name=action:new size="xx-small" onclick={handleAddNewNominee}></lightning-icon>
                    </div>
                </header>
            </div>

            <div class="slds-p-top_small">
                <div class="slds-card__body slds-card__body_inner">
                    <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                        <template for:each={nomineeList} for:item="relatedRecord" for:index="index">
                            <li class="slds-size_1-of-1 slds-large-size_3-of-6 slds-p-horizontal_small slds-p-bottom_small" key={keyIndex}>
                                <c-nominee-child is-record-saved={relatedRecord.isSaved} ondeletenominee={handleDeleteAction} inserted-nominee={relatedRecord} onrowaction={handleRowAction} add-nominee={addNominee}  key-id={relatedRecord.keyId} loan-app={loanApp}></c-nominee-child>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </article>
    </template>

    <template if:true={addNominee}>
            <c-nominee-child relation-options={relationOptions} inserted-nominee={nomineeRecord} ondeletenominee={handleDeleteAction} onrowaction={handleRowAction} add-nominee={addNominee} onsavenominee={handleSave} key-id={keyId} loan-app={loanApp}></c-nominee-child>
    </template>
</template>

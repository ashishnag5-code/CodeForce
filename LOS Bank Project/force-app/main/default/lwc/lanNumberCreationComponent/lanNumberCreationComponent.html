        <lightning-accordion active-section-name='LANCreation' allow-multiple-sections-open>
            <lightning-accordion-section name="LANCreation" label="LAN Creation" class="accordClass">
                <template if:true={loadLANSection}>
                    <div class="slds-card__body slds-card__body_inner">
                        <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                            <li class="slds-size_1-of-1 slds-large-size_3-of-6 slds-p-horizontal_medium slds-p-bottom_small">
                                <c-lan-creation-card-view user-type={userType} loan-type={loanType} oncollateraldetails={getCollateralDetails} ondisplayloandetails={showLoanDetailsCmp} primary-applicant={primaryApplicant} loan-app-record-parameter={loanAppRecord}></c-lan-creation-card-view>
                            </li>
                        </ul>
                    </div>
                    <template if:true={showCollateralList}>
                        <lightning-card title="Existing Collateral Details" style="padding-top:30px;" >
                            <template if:false={viewMoreFull}>
                                <div class="slds-scrollable--y" style="max-height: 300px;">
                                    <lightning-datatable class="slds-max-medium-table_stacked" key-field="strCollateralId" data={collateralDetails} columns ={tablecolumn} hide-checkbox-column="true"  show-row-number-column="true" onrowaction={viewMoreHandler}> 
                                    </lightning-datatable>
                                </div>
                            </template>
                            <template if:true={viewMoreFull}>
                                <lightning-layout>
                                    <lightning-layout-item flexibility="auto" class="slds-card_boundary">
                                        <lightning-card icon-name="standard:account" >
                                            <h1 slot="title"><a>{collateralRecord.strCollateralId}</a></h1>
                                            <div slot="actions">
                                                <a><lightning-icon icon-name="utility:back" onclick={viewLessHandler} class="slds-float_right" size="small" alternative-text="Close" title="Close"></lightning-icon></a>
                                            </div>
                                       <!--     <template if:true={isAutomobileView}> -->
                                                <c-ausf-collatral-detail collateral-list={collatralDetailAutomobile} section-title="Collatral Detail"></c-ausf-collatral-detail>
                                                <c-ausf-collatral-detail collateral-list={linkageDetailAutomobile} section-title="Linkage Detail"></c-ausf-collatral-detail>
                                                <c-ausf-collatral-detail collateral-list={automobileDetail} section-title="Automobile Detail"></c-ausf-collatral-detail>
                                          <!--  </template> -->

                                        </lightning-card>
                                    </lightning-layout-item>
                                </lightning-layout>
                            </template>
                        </lightning-card>   
                       
                    </template>
                </template>
            </lightning-accordion-section>
        </lightning-accordion>
    <!--</article>-->

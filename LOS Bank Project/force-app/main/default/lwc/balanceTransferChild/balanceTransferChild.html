<template>
    <!--<tr class="slds-hint-parent">  -->
    
        <td data-label="Check">
            <div class="slds-truncate">
                <div class="slds-align_absolute-center">
                    <lightning-input onchange={handleChange} disabled={readOnly} name="isChecked" access-key={btRecord.key} variant="label-hidden" type="checkbox" value={btRecord.isChecked} checked={btRecord.isChecked}></lightning-input>
                </div>  
            </div>
        </td>
        <td data-label="Loan Account Number">
            <lightning-combobox name="Loan_Number__c"
                            required
                            read-only={readOnly}
                            variant="label-hidden"
                            options={loanNumberOptions}
                            value={btRecord.Loan_Number__c}
                            onchange={handleChange}></lightning-combobox>
        </td>
        <template if:true={isInternal}>
            
                <td data-label="BT_Loan_Status__c">


                    <div style="overflow:visible !important">
                        <lightning-combobox name="BT_Loan_Status__c"
                        required
                        read-only={readOnly}
                        variant="label-hidden"
                        options={btLoanStatusOptions}
                        value={btRecord.BT_Loan_Status__c}
                        onchange={handleChange}></lightning-combobox>
                    </div>
                        
                </td>
                
            
            <td data-label="POS__c">
                <div class="slds-truncate">
                    <lightning-input class="slds-text-body_small" read-only=true name="POS__c" variant="label-hidden" access-key={btRecord.key} type="number" value={btRecord.POS__c} required onchange={handleChange}></lightning-input>                    
                </div>
            </td>
        </template>
        
        <template if:false={isInternal}>
            <template if:true={loadIt}>
                <template if:true={readOnly}>
                    <td data-label="Financial_Institute_Name__c">   
                        <lightning-input variant="label-hidden"
                        read-only={readOnly}
                        value={btRecord.Financial_Institute_Name__c}></lightning-input>
                    </td>
                </template>
                
                <template if:false={readOnly}>
                    <td data-label="Financial_Institute_Name__c">                      
                        <c-generic-custom-lookup name="Financial_Institute_Name__c" record-type-name="Financial Institution Name"
                        hide-input-label={hideInpLabel} search-fields="" stepid="0" default-record-id={defaultInstitute}
                            fieldapi="Financial_Institute_Name__c" object-name="Generic Master"
                            s-object-api-name="Generic_Master__c" required=""
                            onlookupselect={handleLookupSelect}>
                        </c-generic-custom-lookup>
                    </td>
                </template>
                
            </template>
            <td data-label="NOC_before_Disbursement__c">                      
                <div class="slds-m-top_x-large">
                    <lightning-input onchange={handleChange}
                    disabled={readOnly}
                    type="checkbox" 
                    variant="label-hidden"
                    name="NOC_before_Disbursement__c"
                    value={btRecord.NOC_before_Disbursement__c}
                    checked={btRecord.NOC_before_Disbursement__c}></lightning-input>
                </div>
            </td>
            <td data-label="BT_Amount__c">                
                <lightning-input onchange={handleChange}
                    read-only={readOnly}
                    required
                    type="text" 
                    variant="label-hidden"
                    name="BT_Amount__c"
                    value={btRecord.BT_Amount__c}></lightning-input>
            </td>            
            
            
        </template>
<!--</tr>-->

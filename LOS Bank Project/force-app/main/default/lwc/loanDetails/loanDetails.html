            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">

                    <c-pan-verification-modal applicant-record={appl} key={appl.Id}></c-pan-verification-modal>
                </template>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

            <lightning-layout-item data-id="Schedule_Code__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-input name="Schedule_Code__c"
                            type="text"
                            oncontextmenu={handleContext} 
                            onpaste={handlePaste}
                            label="Schedule Code"
                            data-name="Schedule_Code__c"
                            required={requiredAtDDE}
                            disabled={readOnly}
                            value={loanApp.Schedule_Code__c}
                            onchange={handleChange}></lightning-input>
            </lightning-layout-item>

            <lightning-layout-item data-id="Emi_Frequency__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                
                <lightning-combobox lwc:if={applicableTractorQdeUIChange}
                            name="Emi_Frequency__c"
                            label="EMI Frequency"
                            oncontextmenu={handleContext} 
                            onpaste={handlePaste}
                            disabled={readOnly}
                            data-name="Emi_Frequency__c"
                            required
                            options={emiFrequencyOptions}
                            value={loanApp.Emi_Frequency__c}
                            onchange={handleChange}></lightning-combobox>
                
                <lightning-combobox lwc:else
                            name="Emi_Frequency__c"
                            label="EMI Frequency"
                            oncontextmenu={handleContext} 
                            onpaste={handlePaste}
                            disabled={readOnly}
                            data-name="Emi_Frequency__c"
                            required={requiredAtDDE}
                            options={emiFrequencyOptions}
                            value={loanApp.Emi_Frequency__c}
                            onchange={handleChange}></lightning-combobox>
            </lightning-layout-item>

            <!--<lightning-layout-item data-id="Schedule_Type__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-combobox name="Schedule_Type__c"
                            label="Schedule Type"
                            required={requiredAtDDE}
                            disabled={readOnly}
                            options={scheduleTypeOptions}
                            value={loanApp.Schedule_Type__c}
                            onchange={handleChange}></lightning-combobox>
            </lightning-layout-item>-->

            <template if:true={isIOI}>
                <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="6">
                    <lightning-combobox name="Moratorium_Period__c"
                    data-name="Moratorium_Period__c"
                    oncontextmenu={handleContext} 
                    onpaste={handlePaste}
                                    label="Moratorium Period"
                                    disabled={readOnly}
                                    options={moratoriumPeriodOptions}
                                    value={loanApp.Moratorium_Period__c}
                                    onchange={handleChange}></lightning-combobox>
                </lightning-layout-item>
            </template>
            
            <template if:true={isVPI}>
                <lightning-layout-item size="12" small-device-size="12" large-device-size="12">
                    <c-vpi-parent loan-app={loanApp} onvpimodified={handleOnVPIModify}></c-vpi-parent>
                </lightning-layout-item>
            </template>
            
            <lightning-layout-item data-id="Disbursement_Category__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-combobox name="Disbursement_Category__c"
                            label="Disbursement Category"
                            oncontextmenu={handleContext} 
                            onpaste={handlePaste}
                            data-name="Disbursement_Category__c"
                            disabled={disbursementCategoryDisabled}
                            required={requiredAtDDE}
                            options={disbursementCategoryOptions}
                            value={loanApp.Disbursement_Category__c}
                            onchange={handleChange}></lightning-combobox>
            </lightning-layout-item>

            <template if:true={showTrancheSection}>
                <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="12">
                        <c-tranche-parent fields-to-be-disabled={fieldsToBeDisabled} ontranche={handleEvents} loan-app={loanApp}></c-tranche-parent>
                </lightning-layout-item>
            </template>
           
            

            <lightning-layout-item data-id="EMI_Date__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-combobox name="EMI_Date__c"
                            label="EMI Date"
                            data-name="EMI_Date__c"
                            oncontextmenu={handleContext} 
                            onpaste={handlePaste}
                            required={requiredAtDDE}
                            disabled={readOnly}
                            options={emiDateOptions}
                            value={loanApp.EMI_Date__c}
                            onchange={handleChange}></lightning-combobox>
            </lightning-layout-item>

            <template if:false={disableRepaymentStartDate}>
                <lightning-layout-item data-id="Repayment_Start_Date__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                    <lightning-input label="Repayment Start Date" 
                    type="date" 
                    oncontextmenu={handleContext} 
                    onpaste={handlePaste}
                    data-name="Repayment_Start_Date__c"
                    onchange={handleChange}
                    required={requiredAtDDE}
                    name="Repayment_Start_Date__c"
                    value={loanApp.Repayment_Start_Date__c}></lightning-input>
                </lightning-layout-item>
            </template>
            <lightning-layout-item data-id="First_EMI_Date__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-input label="First EMI Date" 
                type="date" 
                data-id="firstemi"
                data-name="First_EMI_Date__c"
                required={requiredAtDDE}
                name="First_EMI_Date__c"
                value={loanApp.First_EMI_Date__c}
                onchange={handleFirstEMIDateChange}
                disabled={readOnly}
                field-level-help="Repayment Start Date"></lightning-input>
            </lightning-layout-item>

            <lightning-layout-item data-id="IFSC_Code__c" size="12" class="component slds-hide" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-input label="Repayment IFSC Code" 
                type="text" 
                oncontextmenu={handleContext} 
                onpaste={handlePaste}
                onchange={handleChange}
                    required={requiredAtDDE}
                data-name="IFSC_Code__c"
                min-length="11"
                max-length="11"
                pattern="^[A-Za-z]{4}[0][a-zA-Z0-9]{6}$"
                message-when-pattern-mismatch="Please enter valid IFSC Code"
                name="IFSC_Code__c"
                value={loanApp.IFSC_Code__c}></lightning-input>
            </lightning-layout-item>

            <lightning-layout-item data-id="MICR_Code__c" size="12" class="component slds-hide" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-input label="Repayment MICR Code" 
                type="text" 
                oncontextmenu={handleContext} 
                onpaste={handlePaste}
                data-name="MICR_Code__c"
                name="MICR_Code__c"
                value={loanApp.MICR_Code__c}
                disabled></lightning-input>
            </lightning-layout-item>

            <lightning-layout-item data-id="Repayment_Bank_Name__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                <template if:true={loadIt}>
                    <template if:true={bankNameReadOnly}>
                        <lightning-input label="Repayment Bank Name" data-name="Repayment_Bank_Name__c"
                            oncontextmenu={handleContext} 
                            onpaste={handlePaste}
                            required={requiredAtDDE}
                            disabled
                            value={loanApp.Repayment_Bank_Name__c}></lightning-input>
                    </template>
                    <template if:false={bankNameReadOnly}>
                            <c-generic-custom-lookup name="Repayment_Bank_Name__c" label="Repayment Bank Name" record-type-name="Bank Master"
                            search-fields="" stepid="0" loan-app={loanApp} is-required={isRequired}
                            fieldapi="Bank_Name__c" object-name="Generic Master"
                            s-object-api-name="Generic_Master__c" default-record-id={bankRecordId}
                            onlookupselect={handleLookupSelect}>
                        </c-generic-custom-lookup>
                    </template>
                    <lightning-formatted-text class="emandateText" value={eligibleForEmandate}></lightning-formatted-text>
                </template>
            </lightning-layout-item>

            <lightning-layout-item data-id="Repayment_Mode__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-combobox name="Repayment_Mode__c"
                            dropdown-alignment='auto'
                            label="Repayment Mode"
                            data-name="Repayment_Mode__c"
                            oncontextmenu={handleContext} 
                            onpaste={handlePaste}
                            required={requiredAtDDE}
                            disabled={readOnly}
                            options={repaymentModeOptions}
                            value={loanApp.Repayment_Mode__c}
                            onchange={handleChange}></lightning-combobox>
            </lightning-layout-item>

            <lightning-layout-item data-id="Repayment_Account_Type__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-combobox name="Repayment_Account_Type__c"
                dropdown-alignment='auto'
                required={requiredAtDDE}
                data-name="Repayment_Account_Type__c"
                oncontextmenu={handleContext} 
                onpaste={handlePaste}
                label="Repayment Account Type"
                options={repaymentAccountTypeOptions}
                value={loanApp.Repayment_Account_Type__c}
                onchange={handleChange}></lightning-combobox>
            </lightning-layout-item>

            <lightning-layout-item data-id="Repayment_Account_Number__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                <template if:true={manualEntryForAccNo}>
                    <lightning-input label="Repayment Account Number" 
                    type="text" pattern="^[0-9]*" 
                    required={requiredAtDDE}
                    disabled={readOnly} message-when-pattern-mismatch="Please enter only numeric values."
                    data-name="Repayment_Account_Number__c"
                    oncontextmenu={handleContext} 
                    onpaste={handlePaste}
                    onchange={handleChange}
                    name="Repayment_Account_Number__c"
                    value={loanApp.Repayment_Account_Number__c}></lightning-input>
                </template>
                <template if:false={manualEntryForAccNo}>
                    <lightning-combobox name="Repayment_Account_Number__c"
                    dropdown-alignment='auto'
                    required={requiredAtDDE}
                    label="Repayment Account Number"
                    data-name="Repayment_Account_Number__c"
                    oncontextmenu={handleContext} 
                    onpaste={handlePaste}
                    disabled={readOnly}
                    options={repaymentAccountNumberOptions}
                    value={loanApp.Repayment_Account_Number__c}
                    onchange={handleChange}></lightning-combobox>
                </template>
            </lightning-layout-item>

            <lightning-layout-item data-id="Repayment_By__c"  size="12" class="component slds-hide" padding="around-small" small-device-size="12" large-device-size="6">
                <lightning-combobox name="Repayment_By__c"
                data-name="Repayment_By__c"
                dropdown-alignment='auto'
                    oncontextmenu={handleContext} 
                    onpaste={handlePaste}
                            required={requiredAtDDE}
                    label="Repayment By"
                    options={applicantOptions}
                    value={repaymentByValue}
                    onchange={handleRepaymentByChange}></lightning-combobox>
            </lightning-layout-item>

            <template if:true={displayBTSection}>
                <lightning-layout-item data-id="BT_Type__c" class="component slds-hide" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                    <lightning-combobox name="BT_Type__c"
                                dropdown-alignment='auto'
                                label="Balance Transfer Type"
                                data-name="BT_Type__c"
                                options={btOptions}
                                required={isBTTypeRequired}
                                value={loanApp.BT_Type__c}
                                onchange={handleChange}></lightning-combobox>
                </lightning-layout-item>
            </template>


            
            <template if:true={isBTInternal}>
                <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="12">
                    <c-balance-transfer-parent fields-to-be-disabled={fieldsToBeDisabled} bt-case-type={btCaseType} bt-type={loanApp.BT_Type__c} product-details={productDetails} collateral={collateralDetails} loan-app={loanApp}></c-balance-transfer-parent>
                </lightning-layout-item>
            </template>
            <template if:true={isBTExternal}>
                <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="12">
                    <c-balance-transfer-parent fields-to-be-disabled={fieldsToBeDisabled} bt-case-type={btCaseType} bt-type={loanApp.BT_Type__c} product-details={productDetails} collateral={collateralDetails} loan-app={loanApp}></c-balance-transfer-parent>
                </lightning-layout-item>
            </template>

            <template if:true={isCustomerVisitForPDMandatory}>
                <lightning-layout-item data-id="Visited_Customer_for_PD__c" size="12" padding="around-small" small-device-size="12" large-device-size="6">
                    <lightning-combobox name="Visited_Customer_for_PD__c" class="validate" oncontextmenu={handleContext} onpaste={handlePaste} data-name="Visited_Customer_for_PD__c" label="I have visited the Customer's address and verified it"
                        options={visitedCustomerPDOptions} value={loanApp.Visited_Customer_for_PD__c} onchange={handleChange} required disabled={readOnly}></lightning-combobox>
                </lightning-layout-item>
            </template>

            <!--<template if:true={addNominee}>
                <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="12">
                    <lightning-accordion allow-multiple-sections-open active-section-name="A">
                        <lightning-accordion-section name="A" label="Nominee Details">
                            <c-nominee-parent show-details={showNominee} onnominee={handleEvents} loan-app={loanApp}></c-nominee-parent>
                        </lightning-accordion-section>
                    </lightning-accordion>
                </lightning-layout-item>class="component slds-hide" data-id="EMI__c"
            </template>-->
    </lightning-layout>
    <br/><br/>
    
        <lightning-card class="slds-align_absolute-center">
            <h1 slot="title" style="text-align: center;" class="component slds-hide" data-id="EMI__c">
                EMI: <span class="slds-badge badgeProperty">
                            <lightning-formatted-number value={loanApp.EMI__c} format-style="currency" 
                                                        currency-code="INR"
                                                        ></lightning-formatted-number>
                    </span>
                    <br/>
                    <template if:false={boolHideCalculateEMI}>
                        <template if:true={showEMIDisclaimerMsg}>
                        <div style="font-size: small;">
                        *{LOAN_DETAILS_EMI_DISCLAIMER}
                        </div>
                        </template>
                    </template>
            </h1>
        </lightning-card>
    <template if:false={boolHideCalculateEMI}>
        <lightning-button class="slds-align_absolute-center buttonColor" variant="brand" label="Calculate EMI"
        onclick={calculateEMI}></lightning-button>
    </template>

    <lightning-layout multiple-rows>
        <template if:true={addNominee}>
            <lightning-layout-item size="12" padding="around-small" small-device-size="12" large-device-size="12">
                <lightning-accordion allow-multiple-sections-open active-section-name="A">
                    <lightning-accordion-section name="A" label="Nominee Details">
                        <c-nominee-parent show-details={showNominee} onnominee={handleEvents} loan-app={loanApp}></c-nominee-parent>
                    </lightning-accordion-section>
                </lightning-accordion>
            </lightning-layout-item>
        </template>
    </lightning-layout>

    <template if:true={displaySaveButton}>
        
        <div class="slds-align_absolute-center">
            <!--<lightning-icon icon-name="action:reject" size="x-small" variant="success"
                                onclick={closeLoanDetails} class="slds-m-around_medium"></lightning-icon>-->
            <lightning-icon icon-name="action:approval" size="x-small"
                                onclick={saveLoanDetails} class="slds-m-around_medium"></lightning-icon>
            
        </div>
    </template>
</lightning-card>
</template>

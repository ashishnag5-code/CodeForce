<template>
    <c-custom-spinner show-spinner={isLoaded} spinner-image={spinnerImage}></c-custom-spinner>

    <template if:true={showVehicle}>
        <template if:true={showSection}>
            <!-- Add new Collateral -->
            <lightning-card>
                <div class="slds-card__header slds-grid ">
                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name=custom:custom31 size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">
    
                                <a class="slds-card__header-link slds-truncate" title="Applicants"
                                    onclick={handleGotoRelatedList}>
                                    <span>Vehicle</span>
                                </a>
                            </h2>
                        </div>
                        <div class="slds-no-flex">
                            <template if:true={showApplicantInsertion}>
                                <lightning-icon icon-name=action:new size="small"
                                    onclick={handleAdditionalInformationClick}></lightning-icon>
                            </template>
                        </div>
                    </header>
                </div>
    
                <!-- Vehicle detail card -->
                <template if:true={showMainSection}>
                    <lightning-layout>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="12"
                            large-device-size="12">
                            <div class="slds-card__body slds-card__body_inner">
                                <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                                    <template if:false={viewMorePartial}>
                                        <template for:each={applicantLst} for:item="relatedRecord">
    
                                            <li class="slds-size_1-of-1 slds-medium-size_3-of-6 slds-var-p-horizontal_small slds-var-p-bottom_small"
                                                key={relatedRecord.Id} data-id={relatedRecord.Id}
                                                data-record-name="ViewMoreInformation">
                                                <article class="slds-box">
                                                    <div class="slds-card__header slds-grid">
                                                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                                            <div class="slds-media__figure">
                                                                <lightning-icon icon-name=custom:custom31 size="small"></lightning-icon>
                                                            </div>
                                                            <div class="slds-media__body">
                                                                <h2 class="slds-card__header-title">
                                                                    <a class="slds-card__header-link slds-truncate" title={relatedRecord.Name} data-id={relatedRecord.Id}>
                                                                        {relatedRecord.Collateral_ID__c}
                                                                    </a>
                                                                </h2>
                                                            </div>
                                                            <div class="slds-no-flex">
    
                                                                <!-- Collateral Edit Action -->
                                                                <lightning-icon
                                                                    icon-name=action:edit
                                                                    size="x-small"
                                                                    data-id={relatedRecord.Id}
                                                                    data-record-name={relatedRecord.Name}
                                                                    alternative-text={relatedRecord.Name}
                                                                    title={relatedRecord.Name}
                                                                    onclick={handleRowAction}
                                                                ></lightning-icon>
                                                    
                                                                <!-- Collateral Delete Action -->
                                                                <lightning-icon
                                                                    icon-name=action:delete
                                                                    size="x-small"
                                                                    data-id={relatedRecord.Id}
                                                                    data-record-name={relatedRecord.Name}
                                                                    alternative-text={relatedRecord.Name}
                                                                    title={relatedRecord.Name}
                                                                    onclick={handleDeleteAction}
                                                                    if:true={canDeleteCollateral}
                                                                ></lightning-icon>
                                                            </div>
                                                        </header>
    
                                                    </div>
                                                    <div class="slds-card__body slds-card__body_inner">
                                                        <div class="slds-form-element">
    
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Collateral ID</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Collateral_ID__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
    
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Collateral Type</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Collateral_Name__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
    
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span
                                                                        class="slds-form-element__label">Product</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Loan__r.Product__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
    
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Make variant</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Variant__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
    
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Cost</span>
                                                                </div>
                                                                <div class="slds-form-element__control">
                                                                    <div class="slds-form-element__static">
                                                                        {relatedRecord.Final_Cost__c}
                                                                    </div>
                                                                </div>
                                                            </div>
    
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Apportioned Loan Amount</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Apportioned_Loan_Amount__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
    
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Final Cost LTV</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.LTV_offered_On_final_cost__c}<span if:true={relatedRecord.LTV_offered_On_final_cost__c}>%</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small" if:true={isFourWheeler}>
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Ex-Showroom LTV</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.LTV_offered_Ex_showroom__c}<span if:true={relatedRecord.LTV_offered_Ex_showroom__c}>%</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </article>
                                            </li>
                                        </template>
                                    </template>
                                </ul>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
            </lightning-card>
        </template>
    
        <!-- Add Vehicle Information -->
        <lightning-card title={title} icon-name="custom:custom31" class="slds-box" if:true={addVehicleInformation}>
            <template if:false={showBackButton}>
                <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                    <lightning-accordion-section name="A" label="Vehicle Details">
                        <div class="slds-p-around_small slds-size_1-of-1 slds-grid slds-wrap">
            
                            <!-- Auto generated Collateral Id -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Collateral_ID__c">
                                <label class="slds-form-element__label"></abbr>Collateral ID</label>
                                <lightning-input type="text" variant="label-hidden" disabled value={newVehicleRecord.Collateral_ID__c}></lightning-input>
                            </div>
        
                            <!-- Product -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Product__c">
                                <label class="slds-form-element__label"></abbr>Product</label>
                                <lightning-input type="text" variant="label-hidden" disabled value={productName}></lightning-input>
                            </div>
        
                            <!-- Collateral Type -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Collateral_Name__c">
                                <label class="slds-form-element__label"></abbr>Collateral Type</label>
                                <lightning-combobox
                                    name="Collateral_Name__c"
                                    label="Collateral Type"
                                    data-name="Collateral_Name__c"
                                    class="validate"
                                    variant="label-hidden"
                                    value={newVehicleRecord.Collateral_Name__c}
                                    options={collateralNames}
                                    onchange={handleCollateralName}
                                    required
                                    disabled
                                ></lightning-combobox>
                            </div>

                            <!--  Type of Collateral ( New / Existing )-->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Collateral_Type__c">
                                <label class="slds-form-element__label"></abbr>Type</label>
                                <lightning-combobox
                                    name="Collateral_Type__c"
                                    data-name="Collateral_Type__c"
                                    class="validate" variant="label-hidden"
                                    required disabled
                                    value={newVehicleRecord.Collateral_Type__c}
                                    options={collateralTypes}
                                    onchange={handleValueChange}
                                ></lightning-combobox>
                            </div>

                            <!--  Parent Loan Application - (Primary Asset loan) -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small " lwc:if={isBodyLoan}>
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Parent Loan Application
                                </label>
                                <div class="slds-grid slds-grid_reverse">
                                    <lightning-input
                                        type="text"
                                        variant="label-hidden"
                                        class="validate"
                                        label="Parent Loan Application"
                                        value={parentLoanIdentifier}
                                        name="Parent_Loan__c"
                                        style="flex:1;"
                                        required
                                        lwc:ref="parentLoan"
                                        onchange={handleParentLoanChange}
                                        disabled={isCollateralUpdatedPostCreation}
                                    ></lightning-input>

                                    <!-- Validate Parent Loan -->
                                    <lightning-button
                                        variant="base"
                                        class="slds-is-absolute slds-p-right_small"
                                        label={parentLoanValiationButtonLabel}
                                        title="validate"
                                        onclick={validateParentLoan}
                                        disabled={allowParentLoanValidate}
                                    ></lightning-button>
                                </div>
                            </div>
        
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Make__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Make
                                </label>
                                <lightning-combobox
                                    name="Make__c"
                                    label="Make"
                                    class="validate"
                                    disabled={disabledFields.Make__c}
                                    required
                                    variant="label-hidden"
                                    value={makeOptionValue}
                                    options={makeOptions}
                                    onchange={handleMakeValueChange}
                                ></lightning-combobox>
                            </div>

                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Model__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Model
                                </label>
                                <lightning-combobox
                                    name="Model__c"
                                    label="Model"
                                    class="validate"
                                    disabled={disabledFields.Model__c}
                                    required
                                    variant="label-hidden"
                                    value={modelOptionValue} options={modelOptions}
                                    onchange={handleModelValueChange}
                                ></lightning-combobox>
                            </div>


                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Variant__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Variant
                                </label>
                                <lightning-combobox
                                    name="Variant__c"
                                    label="Variant__c"
                                    data-name="Variant__c"
                                    class="validate"
                                    variant="label-hidden"
                                    required
                                    value={variantOptionValue}
                                    options={variantOptions}
                                    disabled={disabledFields.Variant__c}
                                    onchange={handleVaiantValueChange}
                                ></lightning-combobox>
                            </div>

                            <!-- Chassis / Fully Built - Cowl chassis / Cab Chassis / Fully built -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Built__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Built Type
                                </label>
                                <lightning-combobox
                                    name="Built__c"
                                    label="Built Type"
                                    data-name="Built__c"
                                    class="validate"
                                    variant="label-hidden"
                                    required value={newVehicleRecord.Built__c}
                                    options={builtOptions}
                                    onchange={handleValueChange}
                                ></lightning-combobox>
                            </div>

                            <!-- Vehicle Type - "for Loading - Truck /Trailer/Tipper  | for passenger - School Bus/ Staff Bus/ Route Bus/ Contract carriage Bus" -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Vehicle_Type__c" lwc:if={isVehicleTypeApplicable}>
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Vehicle Type
                                </label>
                                <lightning-combobox
                                    name="Vehicle_Type__c"
                                    label="Vehicle Type"
                                    data-name="Vehicle_Type__c"
                                    class="validate"
                                    variant="label-hidden"
                                    disabled={disabledFields.Vehicle_Type__c}
                                    required value={newVehicleRecord.Vehicle_Type__c}
                                    options={vehicleTypeOptions}
                                    onchange={handleValueChange}
                                ></lightning-combobox>
                            </div>
                            
                            <!-- Registrable - CE  -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Registrable__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Registrable
                                </label>
                                <lightning-combobox
                                    name="Registrable__c"
                                    label=""
                                    data-name="Registrable__c"
                                    class="validate"
                                    variant="label-hidden"
                                    required value={newVehicleRecord.Registrable__c}
                                    options={regisOptions}
                                    onchange={handleValueChange}
                                ></lightning-combobox>
                            </div>

                            <!-- Body Type - Goods Carrier / Container etc -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Body_Type__c" lwc:if={isBodyTypeApplicable}>
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Body Type
                                </label>
                                <lightning-combobox
                                    name="Body_Type__c"
                                    label="Body Type"
                                    data-name="Body_Type__c"
                                    class="validate"
                                    variant="label-hidden"
                                    disabled={disabledFields.Body_Type__c}
                                    required value={newVehicleRecord.Body_Type__c}
                                    options={bodyTypeOptions}
                                    onchange={handleValueChange}
                                ></lightning-combobox>
                            </div>

                            <!-- If Body invoice is GST paid? -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Body_invoice_is_GST_paid__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Body invoice is GST paid?
                                </label>
                                <lightning-combobox
                                    name="Body_invoice_is_GST_paid__c"
                                    label="Body invoice is GST paid?"
                                    data-name="Body_invoice_is_GST_paid__c"
                                    class="validate"
                                    variant="label-hidden"
                                    required value={newVehicleRecord.Body_invoice_is_GST_paid__c}
                                    options={bodyInvoiceGstPaidOptions}
                                    onchange={handleValueChange}
                                ></lightning-combobox>
                            </div>
        
                            <!-- Capacity -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Seating_Capacity__c" lwc:if={isSeatingCapacityApplicable}>
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Capacity
                                </label>
                                <lightning-input
                                    type="number"
                                    name="Seating_Capacity__c"
                                    label="Capacity"
                                    data-name="Seating_Capacity__c"
                                    class="validate"
                                    variant="label-hidden"
                                    required
                                    value={newVehicleRecord.Seating_Capacity__c}
                                    onchange={handleValueChange}
                                ></lightning-input>
                            </div>
        
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Fuel_Type__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Fuel Type
                                </label>
        
                                <lightning-combobox
                                    name="Fuel_Type__c"
                                    label="Fuel Type"
                                    variant="label-hidden"
                                    required
                                    value={newVehicleRecord.Fuel_Type__c}
                                    disabled={disabledFields.Fuel_Type__c}
                                    class="validate"
                                    options={fuelTypeOptions}
                                    onchange={handleValueChange}
                                ></lightning-combobox>
                            </div>
        
                            <!-- Manufacturer Year -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Manufacture_year_month__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>Manufacture Year</label>
                                <lightning-combobox
                                    name="Manufacture_year_month__c"
                                    options={manufactureYearOptions}
                                    variant="label-hidden"
                                    label="manufactureYear"
                                    class="validate"
                                    value={manufactureYear}
                                    onchange={handleValueChange}
                                ></lightning-combobox>
        
                                <!-- Manufacture month -->
                                <label class="slds-form-element__label" if:true={allowMonthSelection}>
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Manufacture Month
                                </label>
                                <lightning-combobox if:true={allowMonthSelection}
                                    name="Manufacture_year_month__c"
                                    class="validate"
                                    label="manufactureMonth"
                                    variant="label-hidden"
                                    value={manufactureMonth}
                                    disabled={dataFromApi.manufactureMonth}
                                    options={manufactureMonthOptions}
                                    required
                                    onchange={handleValueChange}>
                                </lightning-combobox>
                            </div>
                            <!-- Vehicle Category -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Vehicle_Category__c">
                                <label class="slds-form-element__label">
                                    <abbr class="slds-required" title="required">* </abbr>
                                    Vehicle Category
                                </label>
                                <lightning-combobox
                                    name="Vehicle_Category__c"

                            </div>
        
                            <!-- Customer Equity -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Customer_equity__c">
                                <label class="slds-form-element__label">Customer equity</label>
                                <lightning-input
                                    type="text"
                                    variant="label-hidden"
                                    label="Customer Equity"
                                    name="Customer_equity__c"
                                    disabled
                                    value={newVehicleRecord.Customer_equity__c}
                                    onchange={handleValueChange}
                                ></lightning-input>
                            </div>
            
                            <!-- Approved Customer Equity -->
                            <template if:true={isCeAssessmentMethod}>
                                <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component" data-id="Approved_Customer_equity__c">
                                    <label class="slds-form-element__label">Approved Customer equity</label>
                                    <lightning-input
                                        type="text"
                                        variant="label-hidden"
                                        label="Approved Customer Equity"
                                        name="Approved_Customer_equity__c"
                                        disabled
                                        value={newVehicleRecord.Approved_Customer_equity__c}
                                        onchange={handleValueChange}
                                    ></lightning-input>
                                </div>
                            </template>
        
                            <!-- LTV Offered on Ex-Showroom Price -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="LTV_offered_Ex_showroom__c">
                                <label class="slds-form-element__label">LTV offered % (Ex showroom)</label>
                                <lightning-input
                                    type="text"
                                    variant="label-hidden"
                                    label="LTV offered % (Ex-Showroom)"
                                    name="LTV_offered_Ex_showroom__c"
                                    disabled
                                    value={ltvofferedExshowroomPrice}
                                ></lightning-input>
                            </div>
        
                            <!-- LTV Offered on On Road Price -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="LTV_offered_On_road__c">
                                <label class="slds-form-element__label">LTV offered % (On road)</label>
                                <lightning-input
                                    type="text"
                                    variant="label-hidden"
                                    label="LTV offered % (On road)"
                                    name="LTV_offered_On_road__c"
                                    disabled
                                    value={ltvOfferedOnroadPrice}>
                                </lightning-input>
                            </div>
        
                            <!-- LTV Offered on Final Cost Price -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="LTV_offered_On_final_cost__c">
                                <label class={ltvOfferedLabelStyles}>LTV offered % (On final cost)</label>
                                <lightning-input
                                    type="text"
                                    variant="label-hidden"
                                    label="LTV offered % (On Final Cost)"
                                    class={ltvOfferedStyles}
                                    name="LTV_offered_On_final_cost__c"
                                    disabled
                                    value={ltvOfferedOnFinalCost}
                                ></lightning-input>
                                <p class="slds-text-color_error" if:true={isLTVInvalid}>The calculated LTV offered % can not be greater than 100.</p>
                            </div>
        
                            <!-- Quantity -->
                            <div class="slds-large-size_1-of-2 slds-small-size_1-of-1 slds-x-small-size_1-of-1 slds-xx-small-size_1-of-1 slds-medium-size_1-of-1 slds-p-horizontal_x-small component slds-hide" data-id="Quantity__c">
                                <label class="slds-form-element__label"></abbr>Quantity</label>
                                <lightning-input
                                    type="number"
                                    variant="label-hidden"
                                    label="Quantity"
                                    name="Quantity__c"
                                    value={newVehicleRecord.Quantity__c}
                                    disabled
                                ></lightning-input>
                            </div>
                        </div>
                    </lightning-accordion-section>
                </lightning-accordion>

                <!-- Existing Collateral Section -->
                <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                    <lightning-accordion-section name="E" label="Existing Collateral Detail">

                        <c-applicant-selection
                            record-val={recordId}
                            onselection={handleChange}
                            label-text={labelVal}
                        ></c-applicant-selection>
    
                        <c-ausf-existing-collateral-detail-card
                            existing-collateral-list={existingCollateralListCBS}
                            loan-id={recordId}
                            label="Existing Collaterals"
                            onexistingcollateral={handleActionOnExistingCollateral}
                        ></c-ausf-existing-collateral-detail-card>

                        <c-ausf-customer-collateral-enquiry
                            is-checked={isChecked}
                            bool-norecords-full={boolNorecordsFull}
                            total-applicants-full={totalApplicantsFull}
                            onselectedcoll={getSelectedCollateral}
                            lwc:if={showCollateral}
                        ></c-ausf-customer-collateral-enquiry>
                    </lightning-accordion-section>
                </lightning-accordion>

                <div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium" if:false={showBackButton}>
                    <lightning-button
                        variant="brand-outline"
                        class="slds-var-m-left_medium"
                        label="Additional Collateral Detail"
                        onclick={handleAdditionalClick}
                    ></lightning-button>
                </div>
            </template>

            <c-ausf-add-manual-collateral
                record-id={recordId}
                if:true={showManualCollDetail}
            ></c-ausf-add-manual-collateral>

            <!-- Collateral Actions - Cancel / Save details -->
            <div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium">
                <lightning-icon icon-name="action:reject" size="x-small" alternative-text="Cancel" onclick={handleCancelForm} if:true={showCancelButton}></lightning-icon>

                <lightning-icon icon-name="action:approval" size="x-small" alternative-text="Save" class="slds-var-m-left_small" onclick={handleSubmitForm} if:false={showBackButton}></lightning-icon>

                <lightning-icon icon-name="action:back" size="x-small" alternative-text="Back" class="slds-var-m-left_small" onclick={handleBack} if:true={showBackButton}></lightning-icon>
            </div>
            </lightning-card>


        </template>

    <!-- Update loan detail section - appears as modal -->
    <c-ausf-update-loan-application
        is-modal-open={isModalOpen}
        scheme-record={schemeMasterRecord}
        onshowloandetails={showDetails}
        onclosemodal={closeModal}
        if:true={isModalOpen}
    ></c-ausf-update-loan-application>

    <c-loan-details
        class="component"
        record-id={loanApplicationRecord.Id}
        show-save
        onshowvehicle={showVehicleDetail}
        if:true={showLoanDetails}
    ></c-loan-details>

</template>

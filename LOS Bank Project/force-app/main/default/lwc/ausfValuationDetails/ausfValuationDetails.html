<template>

    <template if:true={isloading}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>


    <!--New Form Details-->
    <template if:true={showValuation}>
    <lightning-card title="Valuation Details" icon-name="standard:budget_category_value">
        <div slot="actions">
            <lightning-icon icon-name="action:back" onclick={handleBackAction} size="x-small" alternative-text="Close"
                title="Close"></lightning-icon>
        </div>
        <div class="slds-box">
            <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                    class="slds-var-p-horizontal_small" flexibility="auto">

                    <label class="slds-form-element__label">REFERENCE ID</label>
                    <lightning-input type="text" variant="label-hidden" class="" label="REFERENCE ID"
                        name="Reference_ID__c" value={referenceId} disabled="true">
                    </lightning-input>
                    <label class="slds-form-element__label">Product</label>
                    <lightning-input type="text" variant="label-hidden" class="" label="Branch" name="Branch__c"
                        value={valuationRecord.Product__c} disabled="true">
                    </lightning-input>
                    <label class="slds-form-element__label">Collateral Type</label>
                    <lightning-input type="text" variant="label-hidden" class="" label="Collateral Type"
                        name="Collateral_Type__c" value={collateralName} disabled="true">
                    </lightning-input>
                    <label class="slds-form-element__label">MMV</label>
                    <lightning-input type="text" variant="label-hidden" class="" label="MMV" name="MMV_Master__c"
                        value={mmvMasterName} disabled="true">
                    </lightning-input>
                    <label class="slds-form-element__label">Vehicle Number</label>
                    <lightning-input type="text" variant="label-hidden" class="" label="Vehicle Number"
                        name="Vehicle_Number__c" value={valuationRecord.Vehicle_Number__c} disabled="true">
                    </lightning-input>
                    <label class="slds-form-element__label">ACTION</label><!--options={actions}-->
                    <lightning-combobox label="ACTION" placeholder="Select Action" value={actionVal} options={actionOptions}
                         name="Action__c" class="validate" variant="label-hidden"
                        disabled={actionDisableCheck} onchange={handleChange}>
                    </lightning-combobox>
                </lightning-layout-item>

                <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                    class="slds-var-p-horizontal_small" flexibility="auto">

                    <label class="slds-form-element__label">Valuer Name Code</label>
                    <lightning-combobox label="" placeholder="Select Reference"
                        value={valuerName} options={valuerNameCodeOptions}
                        name="Valuer_Name_Code__c" class="validate" variant="label-hidden" disabled={valuerDisable}
                        onchange={handleChange}>
                    </lightning-combobox>

                    <template if:true={showOtherPicklist}>
                        <label class="slds-form-element__label">Other state and list from master</label>
                        <lightning-combobox label="" placeholder="Select Other State"
                        value={stateVal} options={stateList}
                        name="Other_state_and_list_from_master__c" class="validate" variant="label-hidden"
                        onchange={handleChange}></lightning-combobox>

                        <label class="slds-form-element__label">Contact Person Name to coordinate for valuation</label>
                        <lightning-combobox name="Coordinate_for_valuation_POC__c" options={contactOptions}
                            variant="label-hidden" class="" label="Branch" onchange={handleChange}
                            value={contactName}></lightning-combobox>

                        <label class="slds-form-element__label">Contact Person Mobile Number</label>
                        <lightning-input type="text" variant="label-hidden" class="" label="Branch"
                            onchange={handleChange} name="Contact_Person_Mobile_Number__c" value={phoneVal}>
                        </lightning-input>
                    </template>

                    <template if:false={showOtherPicklist}>
                        <template if:true={showContactPicklist}>
                            <label class="slds-form-element__label">Contact Person Name to coordinate for
                                valuation</label>
                            <lightning-input type="text" variant="label-hidden" class="" label="Branch"
                                onchange={handleChange} name="Coordinate_for_valuation_POC__c"
                                value={contactName}
                                disabled={onValuationDisableCheck}>
                            </lightning-input>

                            <label class="slds-form-element__label">Contact Person Mobile Number</label>
                            <lightning-input type="text" variant="label-hidden" class="" label="Branch"
                                onchange={handleChange} name="Contact_Person_Mobile_Number__c"
                                value={phoneVal}
                                disabled={onValuationDisableCheck}>
                            </lightning-input>
                        </template>
                    </template>

                    <label class="slds-form-element__label">Allocation Date and Time</label>
                    <lightning-input type="text" variant="label-hidden" class="" label="Allocation Date Time"
                        name="Allocation_Date_Time__c" value={allocationDateAndTime} disabled="true">
                    </lightning-input>

                    <label class="slds-form-element__label">Completion Date and Time</label>
                    <lightning-input type="date" variant="label-hidden" class="" label="Branch"
                        name="Completion_Date_Time__c" value={valuationRecord.Completion_Date_Time__c} disabled="true">
                    </lightning-input>

                </lightning-layout-item>

            </lightning-layout>
           <!-- <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                    class="slds-var-p-horizontal_small" flexibility="auto">

                        class="slds-m-left_x-small"></lightning-button>
                </lightning-layout-item>
            </lightning-layout>-->
            <div slot="footer" class="slds-align--absolute-center">
                <template if:false={onValuationDisableCheck}>
                <lightning-button label="Send for Valuation" title="Submit" onclick={handleSubmit}
                    disabled={showCancelButton}></lightning-button>
                </template>
                <template if:true={showCancelButton}>
                    <lightning-button label="Cancel for Valuation" title="Submit"  class="slds-m-left_x-small" onclick={handleSubmit}>
                    </lightning-button>
                </template>
            </div>

        <template if:true={showDocumentPopup}>
            <lightning-card title="Document Upload" icon-name="standard:budget_category_value">
                <div class="slds-box">
                    <lightning-layout multiple-rows class="slds-var-p-bottom_small">

                            <c-los-generic-document-upload hidefiledetails={trueValue} isloading ={isloading} isdocmanager={trueValue} show-upload-component ={trueValue} collateral-id={collateralId}  show-input-box={falseValue} doc-name = "AUWheels0014" ondocumentsuccess={handleSuccess} uploadtypename = "Valuation Report With Vehicle Photo">

                                <lightning-input type="text" variant="label-hidden" class="" label=""
                                    onchange={handleChange} name="Valuation_Amount__c" value={valuationAmount}>
                                </lightning-input>

                            </lightning-layout-item>

                    </lightning-layout>

                    <lightning-layout multiple-rows class="slds-p-bottom_small">
                        <div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium">
                            <lightning-button label="Submit" title="Download action" class="buttonClass"
                                icon-name="action:submit_for_approval" onclick={handleOkay} icon-position="right">
                            </lightning-button>
                            &nbsp; <lightning-button label="Back" title="Download action" icon-name="action:back" class=" buttonClass slds-m-left_x-small" 
                                onclick={closeModal} icon-position="right"></lightning-button>
                        
                        </div>
                        </lightning-layout>
                </div>
                </lightning-card>
        </template>

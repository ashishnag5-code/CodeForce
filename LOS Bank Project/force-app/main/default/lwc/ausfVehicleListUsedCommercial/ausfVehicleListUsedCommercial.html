<template>
    <template if:true={isLoaded}>
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
    </template>
    <template if:true={isModalOpen}>
        <c-ausf-update-loan-application is-modal-open={isModalOpen} scheme-record={schemeMasterRecord}
            onshowloandetails={showDetails} onclosemodal={closeModal}></c-ausf-update-loan-application>
    </template>
    <template if:true={showLoanDetails}>
        <c-loan-details class="component" record-id={loanApplicationRecord.Id} show-save=true
            onshowvehicle={showVehicleDetail}>
        </c-loan-details>
    </template>
    <!-- Existing Applicant Section-->
    <!--<template if:false={editVehicleRecordPage}>-->

    <template if:true={showVehicle}>
        <template if:true={showSection}>
            <lightning-card>
                <!-- <article class="slds-card slds-card_boundary">-->
                <div class="slds-card__header slds-grid ">
                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name=standard:work_order size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">

                                <a class="slds-card__header-link slds-truncate" title="Applicants"
                                    onclick={handleGotoRelatedList}>
                                    <span>Vehicle</span>
                                </a>
                            </h2>
                        </div>
                        <div class="slds-no-flex">
                            <template if:true={showApplicantInsertion}>
                                <lightning-icon icon-name=action:new size="small"
                                    onclick={handleAdditionalInformationClick}></lightning-icon>
                            </template>
                        </div>
                    </header>
                </div>
                <template if:true={showMainSection}>
                    <lightning-layout>
                        <lightning-layout-item size="12" small-device-size="6" medium-device-size="12"
                            large-device-size="12">
                            <div class="slds-card__body slds-card__body_inner">
                                <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                                    <template if:false={viewMorePartial}>
                                        <template for:each={applicantLst} for:item="relatedRecord">

                                            <li class="slds-size_1-of-1 slds-medium-size_3-of-6 slds-var-p-horizontal_small slds-var-p-bottom_small"
                                                key={relatedRecord.Id} data-id={relatedRecord.Id}
                                                data-record-name="ViewMoreInformation">
                                                <article class="slds-box">
                                                    <div class="slds-card__header slds-grid">
                                                        <header
                                                            class="slds-media slds-media_center slds-has-flexi-truncate">
                                                            <div class="slds-media__figure">
                                                                <lightning-icon icon-name=custom:custom31 size="small">
                                                                </lightning-icon>
                                                            </div>
                                                            <div class="slds-media__body">
                                                                <h2 class="slds-card__header-title">
                                                                    <a class="slds-card__header-link slds-truncate"
                                                                        title={relatedRecord.Name}
                                                                        data-id={relatedRecord.Id}>{relatedRecord.Collateral_ID__c}</a>
                                                                    <!--onclick={navigateToAppRecordPage}-->
                                                                </h2>
                                                            </div>
                                                            <div class="slds-no-flex">
                                                                <lightning-icon icon-name=action:edit size="x-small"
                                                                    data-id={relatedRecord.Id}
                                                                    data-record-name={relatedRecord.Name}
                                                                    alternative-text={relatedRecord.Name}
                                                                    title={relatedRecord.Name}
                                                                    onclick={handleRowAction}>
                                                                </lightning-icon>
                                                                <lightning-icon icon-name=action:delete size="x-small"
                                                                    data-id={relatedRecord.Id}
                                                                    data-record-name={relatedRecord.Name}
                                                                    alternative-text={relatedRecord.Name}
                                                                    title={relatedRecord.Name}
                                                                    onclick={handleDeleteAction}
                                                                    if:true={canDeleteCollateral}
                                                                ></lightning-icon>
                                                            </div>
                                                        </header>

                                                    </div>
                                                    <div class="slds-card__body slds-card__body_inner">
                                                        <div class="slds-form-element">

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Collateral
                                                                        ID</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Collateral_ID__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Collateral
                                                                        Name</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Collateral_Name__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span
                                                                        class="slds-form-element__label">Product</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Loan__r.Product__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Make
                                                                        variant</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Variant__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Cost</span>
                                                                </div>
                                                                <div class="slds-form-element__control">
                                                                    <div class="slds-form-element__static">
                                                                        {relatedRecord.Final_Cost__c}
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Apportioned
                                                                        Loan
                                                                        Amount</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.Apportioned_Loan_Amount__c}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">Final Cost LTV</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.LTV_offered_On_final_cost__c}<span if:true={relatedRecord.LTV_offered_On_final_cost__c}>%</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small" if:true={isTwoWheeler}>
                                                                <div class="slds-size_1-of-2">
                                                                    <span class="slds-form-element__label">On Road LTV</span>
                                                                </div>
                                                                <div class="slds-size_1-of-2">
                                                                    <div class="slds-form-element__control">
                                                                        <div class="slds-form-element__static">
                                                                            {relatedRecord.LTV_offered_On_road__c}<span if:true={relatedRecord.LTV_offered_On_road__c}>%</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <footer class="slds-card__footer"><!--disabled={relatedRecord.isDisableValuation}-->
                                                        <lightning-button data-id={relatedRecord.Id} label="Valuation" title="Valuation"  onclick={handleValuationClick} 
                                                        ></lightning-button>
                                                    </footer>
                                                </article>
                                            </li>
                                        </template>
                                    </template>
                                </ul>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
                <template if:true={showValuationDetail}>
                    <c-ausf-valuation-details  vehicle-record={vehicleRecord} loan-application ={loanApplicationRecord} default-value={defaultValue} valuer-name-code-options={valuerNameCodeOptions} onnavigatehome={navigateHomeView}></c-ausf-valuation-details>
                </template>

                <!--</article>-->
                <!--</template>-->
                <!--End -->
                <template if:true={showSearchScreen}>
                    <lightning-card>
                        <lightning-layout multiple-rows class="slds-var-p-bottom_small" horizontal-align="center">

                            <lightning-layout-item size="12" small-device-size="12" large-device-size="6" class="slds-var-p-horizontal_small" flexibility="auto">

                                <label class="slds-form-element__label">Vehicle Number</label>
                                <lightning-input type="text" variant="label-hidden" label="Vehicle Number" pattern="[A-Za-z0-9]{6,10}"
                                    value={inputSearchParamater.Vehicle_Number__c} name="Vehicle_Number__c" class="searchvehicle" message-when-pattern-mismatch="Please Enter Alphanumeric values"
                                    onchange={handleInputChange}>
                                </lightning-input>

                                <label class="slds-form-element__label">Engine Number</label>
                                <lightning-input type="text" variant="label-hidden" label="Engine no"
                                    value={inputSearchParamater.Engine_Number__c} name="Engine_Number__c"
                                    onchange={handleInputChange}>
                                </lightning-input>

                                <label class="slds-form-element__label">Chassis Number</label>
                                <lightning-input type="text" variant="label-hidden" label="Chasis no"
                                    value={inputSearchParamater.Chasis_Number__c} name="Chasis_Number__c"
                                    onchange={handleInputChange}>
                                </lightning-input></br></br>
                                <lightning-button class="slds-align_absolute-center slds-var-m-left_x-small"
                                    variant="brand" label={searchLabel} title="Primary action" onclick={handleClick}>
                                </lightning-button>

                            </lightning-layout-item>

                        </lightning-layout>
                        <template if:true={showSearchResult}>
                            <c-ausf-vehicle-record-card search-data={searchData} oncopycollateral={handleCopyToCollateral}>
                            </c-ausf-vehicle-record-card>
                        </template>
                        <template if:true={showErrorMessage}>
                            <p>{errorMessage}</p>
                        </template>

                    </lightning-card>
                </template>
            </lightning-card>
        </template>
        <!-- Add New Applicant Details-->
        <template if:true={addNewApplicant}>
            <lightning-card title={title} icon-name="custom:custom31" class="slds-box">
                <template if:false={showBackButton}>
                    <lightning-accordion allow-multiple-sections-open class="example-accordion"
                        active-section-name={activeSections}>
                        <lightning-accordion-section name="A" label="Vehicle Detail">
                            <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                                <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                                    class="slds-var-p-horizontal_small" flexibility="auto">


                                    <div class="component slds-hide" data-id="Collateral_ID__c">
                                        <label class="slds-form-element__label"></abbr>Collateral ID</label>
                                        <lightning-input type="text" variant="label-hidden" disabled
                                            value={newVehicleRecord.Collateral_ID__c}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Collateral_Type__c">
                                        <label class="slds-form-element__label"></abbr>Type</label>
                                        <lightning-combobox name="Collateral_Type__c" data-name="Collateral_Type__c"
                                            class="validate" variant="label-hidden" required disabled
                                            value={newVehicleRecord.Collateral_Type__c} options={collateralTypes}
                                            onchange={handleValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Vehicle_Number__c">
                                        <div class="slds-is-relative ">
                                            <div class="buttonIn">
                                                <label class="slds-form-element__label">
                                                    <abbr class="slds-required" title="required">* </abbr>
                                                    Vehicle Number
                                                </label>
                                                <lightning-input
                                                    type="text"
                                                    variant="label-hidden"
                                                    class="validate input pan"
                                                    label="Vehicle Number"
                                                    value={newVehicleRecord.Vehicle_Number__c}
                                                    name="Vehicle_Number__c"
                                                    pattern="[A-Za-z0-9]{6,10}"
                                                    required
                                                    onchange={handleValueChange}
                                                    message-when-pattern-mismatch="Please Enter Alphanumeric values"
                                                    disabled={dataFromApi.Vehicle_Number__c}
                                                ></lightning-input>

                                                <!-- Fetch Vahan details -->
                                                <lightning-button
                                                    variant="base"
                                                    class="button"
                                                    disabled={disabledFetchVahhan}
                                                    label="Fetch Vehicle Info"
                                                    title="Get Vahaan Details"
                                                    onclick={handleVahaanData}
                                                ></lightning-button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-m-top_medium">
                                        <div class="component slds-hide" data-id="Engine_Number__c">
                                            <label class="slds-form-element__label">
                                                <abbr class="slds-required" title="required">* </abbr>
                                                Engine Number
                                            </label>

                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                class="validate"
                                                label=""
                                                required
                                                value={newVehicleRecord.Engine_Number__c}
                                                name="Engine_Number__c"
                                                disabled={dataFromApi.Engine_Number__c}
                                                onchange={handleValueChange}
                                            ></lightning-input>
                                        </div>
                                    </div>

                                    <div class="component slds-hide" data-id="Chasis_Number__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Chasis Number</label>
                                        <lightning-input type="text" variant="label-hidden" class="validate" label=""
                                            required value={newVehicleRecord.Chasis_Number__c} name="Chasis_Number__c"
                                            disabled={dataFromApi.Chasis_Number__c} onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Make__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>
                                            Manufacturer
                                        </label>
                                        <lightning-combobox name="Make__c" label="Manufacturer" class="validate"
                                            disabled={desableField.Make__c} required variant="label-hidden"
                                            value={makeOptionValue} options={makeOptions}
                                            onchange={handleMakeValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Model__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>
                                            Make
                                        </label>
                                        <lightning-combobox name="Model__c" label="Make" class="validate"
                                            disabled={desableField.Model__c} required variant="label-hidden"
                                            value={modelOptionValue} options={modelOptions}
                                            onchange={handleModelValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Variant__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>
                                            Model
                                        </label>
                                        <lightning-combobox name="Variant__c" label="Model" data-name="Variant__c"
                                            class="validate" variant="label-hidden" required value={variantOptionValue}
                                            options={variantOptions} disabled={desableField.Variant__c}
                                            onchange={handleVaiantValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Vehicle_Category__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>
                                            Equipment Category
                                        </label>
                                        <lightning-combobox name="Vehicle_Category__c" class="validate"
                                            label="Vehicle Usage" variant="label-hidden"
                                            value={newVehicleRecord.Vehicle_Category__c}
                                            disabled={desableField.Fuel_Type__c} options={vehicleCategoryOptions}
                                            required onchange={handleCategoryChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Fuel_Type__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>
                                            Fuel Type
                                        </label>
                                        <lightning-combobox name="Fuel_Type__c" label="Fuel Type" variant="label-hidden"
                                            required value={newVehicleRecord.Fuel_Type__c}
                                            disabled={desableField.Fuel_Type__c} class="validate"
                                            options={fuelTypeOptions} onchange={handleValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <!-- :TODO - Add options BS2/3 -->
                                    <div class="component slds-hide" data-id="Engine_Category__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Engine Category</label>
                                        <lightning-combobox
                                            name="Engine_Category__c"
                                            label="Engine Category"
                                            data-name="Engine_Category__c"
                                            class="validate"
                                            variant="label-hidden"
                                            required
                                            value={newVehicleRecord.Engine_Category__c}
                                            options={engineCategoryOptions}
                                            onchange={handleValueChange}
                                        ></lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Scheme__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Scheme</label>
                                        <lightning-combobox name="Scheme__c" class="validate" label="Vehicle Usage"
                                            variant="label-hidden" value={schemeOptionValue}
                                            disabled={desableField.Scheme__c} options={vehicleSchemeOptions} required
                                            onchange={handleSchemeChange}>
                                        </lightning-combobox>
                                    </div>


                                </lightning-layout-item>

                                <lightning-layout-item size="12" small-device-size="12" large-device-size="6" class="slds-var-p-horizontal_small" flexibility="auto">
                                    <div class="component slds-hide" data-id="Product__c">
                                        <label class="slds-form-element__label"></abbr>Product</label>
                                        <lightning-input
                                            type="text"
                                            variant="label-hidden"
                                            disabled
                                            value={productName}
                                        ></lightning-input>
                                    </div>

                                    <!-- Collateral Type -->
                                    <div class="component slds-hide" data-id="Collateral_Name__c">
                                        <label class="slds-form-element__label"></abbr>Collateral Type</label>
                                        <lightning-combobox
                                            name="Collateral_Name__c"
                                            label="Collateral Type"
                                            data-name="Collateral_Name__c"
                                            class="validate"
                                            variant="label-hidden"
                                            disabled={dataFromApi.Collateral_Name__c}
                                            value={newVehicleRecord.Collateral_Name__c}
                                            options={collateralNames}
                                            onchange={handleCollateralName}
                                        ></lightning-combobox>
                                    </div>

                                    <!-- :TODO - Confirm if Vehicle color is needed ( IBB callout require this ) -->
                                    <div class="component slds-hide" data-id="Vehicle_Color__c">
                                        <c-generic-custom-lookup name="Color_Code__c" label="Vehicle Colour"
                                            record-type-name="Vehicle Color" is-required="True"
                                            dependent-field-api="Color_Code__c" fieldapi="Color_Code__c"
                                            object-name="Generic Master" s-object-api-name="Generic_Master__c" default-record-id={newVehicleRecord.Vehicle_Color__c}
                                            onlookupselect={handleLookupSelect}>
                                        </c-generic-custom-lookup>
                                    </div>

                                    <div class="component slds-hide" data-id="Manufacture_year_month__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>
                                            Manufacture Month
                                        </label>
                                        <lightning-combobox name="Manufacture_year_month__c" class="validate" label="manufactureMonth"
                                            variant="label-hidden" value={manufactureMonth} disabled={dataFromApi.Manufacture_year_month__c}
                                            options={manufactureMonthOptions} required onchange={handleValueChange}>
                                        </lightning-combobox>


                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>
                                            Manufacture Year
                                        </label>

                                        <lightning-input
                                            type="text"
                                            variant="label-hidden"
                                            class="validate year"
                                            pattern="^(0|[1-9][0-9]*)$" 
                                            label="manufactureYear"
                                            required
                                            disabled={dataFromApi.Manufacture_year_month__c}
                                            message-when-pattern-mismatch="Only numbers can be entered"
                                            name="Manufacture_year_month__c"
                                            value={manufactureYear}
                                            maxlength="4"
                                            minlength="4"
                                            formatter="number"
                                            onchange={handleValueChange}
                                        ></lightning-input>

                                    </div>

                                    <div class="component slds-hide" data-id="Kilometer__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Kilometer</label>
                                        <lightning-input type="text" variant="label-hidden" class="validate" label=""
                                            required value={newVehicleRecord.Kilometer__c} name="Kilometer__c"
                                            onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="HPN_With_Financiers_Name__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>HPN With (Financiers Name)</label>
                                        <lightning-input type="text" variant="label-hidden" class="validate" label=""
                                            required name="HPN_With_Financiers_Name__c"
                                            value={newVehicleRecord.HPN_With_Financiers_Name__c}
                                            disabled={dataFromApi.HPN_With_Financiers_Name__c}
                                            onchange={handleValueChange}>
                                        </lightning-input>

                                        <template if:true={showNocStatus}>
                                            <label class="slds-form-element__label">NOC Status</label>
                                            <lightning-input type="text" variant="label-hidden" label=""
                                                required name="NOC_Status__c"
                                                value={newVehicleRecord.NOC_Status__c}
                                                disabled>
                                            </lightning-input>
                                        </template>

                                    </div>

                                    <div class="component slds-hide" data-id="Current_Owner_Name__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Current Owner Name</label>
                                        <lightning-input type="text" variant="label-hidden" class="validate" label=""
                                            required name="Current_Owner_Name__c"
                                            value={newVehicleRecord.Current_Owner_Name__c}
                                            disabled={dataFromApi.Current_Owner_Name__c} onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>

                                            variant="label-hidden"
                                            value={newVehicleRecord.Repo_Sale_Vehicle_CBS__c}

                                            disabled={dataFromApi.Repo_Sale_Vehicle_CBS__c}

                                    <div class="component">

                            </lightning-layout>
                        </lightning-accordion-section>
                    </lightning-accordion>

                    <lightning-accordion allow-multiple-sections-open class="example-accordion" active-section-name={activeSections}>

                                    <div class="component slds-hide" data-id="SVSH_SVOH__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>SVSH/SVOH</label>

                                            label="SVSH/SVOH"

                                            variant="label-hidden"
                                            value={isSameAsVehicleOwner}
                                            options={svshOptions}
                                            onchange={handleValueChange}

                                        ></lightning-combobox>
                                    </div>

                                    <div class="component" data-id="BT_Loan_Status__c" if:true={isSVSH}>
                                        <label class="slds-form-element__label">SVSH Loan Status</label>
                                                <lightning-combobox name="BT_Loan_Status__c"

                                                data-name="BT_Loan_Status__c"
                                                variant="label-hidden"
                                                options={btLoanStatusOptions}

                                    </div>

                                            value={newVehicleRecord.Certified_Value__c} onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Grid_Depreciated_Value__c">
                                        <div class="buttonIn">
                                            <label class="slds-form-element__label">
                                                <abbr class="slds-required" title="required">* </abbr>Grid/Depreciated
                                                Value</label>
                                            <!-- SFAU-3063 - disabled manual edit, will come from master only -->
                                            <lightning-input type="text" variant="label-hidden"
                                                class="validate input pan" label=""
                                                value={newVehicleRecord.Grid_Depreciated_Value__c} disabled
                                                name="Grid_Depreciated_Value__c" required onchange={handleValueChange}>
                                            </lightning-input>
                                            <lightning-button variant="base" class="button" label="Fetch"
                                                title="Get Depreciated Details" onclick={handleGetDepValue}>
                                            </lightning-button>
                                        </div>
                                    </div>


                                    <div class="component slds-hide" data-id="IBB_Value__c">
                                        <div class="buttonIn">
                                            <label class="slds-form-element__label">
                                                <abbr class="slds-required" title="required" if:true={isFourWheeler}>* </abbr>IBB
                                                Value</label>
                                            <lightning-input type="number" variant="label-hidden"
                                                class={ibbValueClasses} label="" required={isFourWheeler} name="IBB_Value__c"
                                                disabled={isIBBValuedisabled} value={newVehicleRecord.IBB_Value__c}
                                                onchange={handleValueChange}>
                                            </lightning-input>
                                            <lightning-button variant="base" class="button" label="Get IBB Value"
                                                title="Get Depreciated Details" onclick={handleIBBValue}>
                                            </lightning-button>
                                        </div>
                                    </div>

                                    <div class="component slds-hide" data-id="Valuation_Amount__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required" if:true={isValuationRequired}>* </abbr>Valuation
                                            Amount</label>
                                        <lightning-input type="number" variant="label-hidden" class={valuationAmountClasses}
                                            label="" required={isValuationRequired} name="Valuation_Amount__c"
                                            value={newVehicleRecord.Valuation_Amount__c}
                                            onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="IDV__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>IDV (Insurance
                                            declared
                                            Value)</label>
                                        <lightning-input type="number" variant="label-hidden" class="validate" label=""
                                            name="IDV__c" required value={newVehicleRecord.IDV__c}
                                            onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Exiting_Policy_Expired__c">
                                        <label class="slds-form-element__label">Exiting Policy Expired</label>
                                        <lightning-combobox name="Exiting_Policy_Expired__c"
                                            label="Exiting Policy Expired" data-name="Exiting_Policy_Expired__c"
                                            variant="label-hidden" value={newVehicleRecord.Exiting_Policy_Expired__c}
                                            options={existingPolicyExpired} onchange={handleValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Invoice_values_OEM_s__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Invoice values (OEM's)</label>
                                        <lightning-input type="number" variant="label-hidden" class="validate" label="" required
                                            name="Invoice_values_OEM_s__c" value={newVehicleRecord.Invoice_values_OEM_s__c}
                                            onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>
                                </lightning-layout-item>
                                <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                                    class="slds-var-p-horizontal_small" flexibility="auto">

                                    <div class="component slds-hide" data-id="Insurance_Expiry_Date__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Insurance Expiry Date</label>
                                        <lightning-input type="date" variant="label-hidden" label=""
                                            name="Insurance_Expiry_Date__c"
                                            value={newVehicleRecord.Insurance_Expiry_Date__c}
                                            onchange={handleValueChange} required class="validate">
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Existing_Policy_Insurer_Company__c">
                                        <!-- <label class="slds-form-element__label">Existing Policy Insurer Company</label>
                                        <lightning-input type="text" variant="label-hidden" label=""
                                            name="Existing_Policy_Insurer_Company__c"
                                            value={newVehicleRecord.Existing_Policy_Insurer_Company__c}
                                            onchange={handleValueChange}>
                                        </lightning-input> -->
                                        <c-generic-custom-lookup name="Name__c" label="Existing Policy Insurer Company"
                                                record-type-name="Previous Insurer"
                                                fieldapi="Existing_Policy_Insurer_Company__c"
                                                object-name="Generic Master"
                                                s-object-api-name="Generic_Master__c"
                                                default-record-id={newVehicleRecord.Existing_Policy_Insurer_Company__c}
                                                onlookupselect={handleLookupSelect}
                                        ></c-generic-custom-lookup>
                                    </div>

                                    <div class="component slds-hide" data-id="Existing_Policy_Type__c">
                                        <label class="slds-form-element__label">Existing Policy Type</label>
                                        <lightning-combobox name="Existing_Policy_Type__c" label="Existing Policy Type"
                                            data-name="Existing_Policy_Type__c" variant="label-hidden"
                                            value={newVehicleRecord.Existing_Policy_Type__c}
                                            options={existingPolicyType} onchange={handleValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="Have_you_made_a_claim_Last_year__c">
                                        <label class="slds-form-element__label">Have you made a claim Last year</label>
                                        <lightning-combobox name="Have_you_made_a_claim_Last_year__c"
                                            label="Exiting Policy Expired"
                                            data-name="Have_you_made_a_claim_Last_year__c" variant="label-hidden"
                                            value={newVehicleRecord.Have_you_made_a_claim_Last_year__c}
                                            options={existingPolicyExpired} onchange={handleValueChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="component slds-hide" data-id="NCB_in_Exisiting_policy__c">
                                        <label class="slds-form-element__label">NCB % in Exisiting policy</label>
                                        <lightning-input type="number" variant="label-hidden" label=""
                                            name="NCB_in_Exisiting_policy__c"
                                            value={newVehicleRecord.NCB_in_Exisiting_policy__c}
                                            onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Vehicle_Cost__c">
                                        <label class="slds-form-element__label">Vehicle Cost</label>
                                        <lightning-input
                                            type="number"
                                            variant="label-hidden"
                                            label=""
                                            disabled
                                            name="Vehicle_Cost__c"
                                            value={vehicleCost}
                                            onchange={handleValueChange}
                                        ></lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Final_Cost__c">
                                        <label class="slds-form-element__label">Final Vehicle Cost</label>
                                        <lightning-helptext content="Vehicle cost +funding item value"></lightning-helptext>
                                        <lightning-input type="number" variant="label-hidden" disabled label=""
                                            name="Final_Cost__c" value={finalPrice}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Apportioned_Loan_Amount__c">
                                        <label class="slds-form-element__label">
                                            <abbr class="slds-required" title="required">* </abbr>Apportioned Loan Amount</label>
                                        <lightning-input
                                            type="number"
                                            variant="label-hidden"
                                            label=""
                                            required
                                            name="Apportioned_Loan_Amount__c"
                                            disabled
                                            value={newVehicleRecord.Apportioned_Loan_Amount__c}
                                            class="validate"
                                            onchange={handleValueChange}
                                        ></lightning-input>
                                    </div>

                                </lightning-layout-item>
                            </lightning-layout>
                        </lightning-accordion-section>
                    </lightning-accordion>

                    <lightning-accordion allow-multiple-sections-open class="example-accordion" active-section-name={activeSections}>
                        <lightning-accordion-section name="C" label="Other Funding Items">
                            <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                                <lightning-layout-item size="12" small-device-size="12" large-device-size="6" class="slds-var-p-horizontal_small" flexibility="auto">
                                    <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                                        <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                                            class="slds-var-p-horizontal_small" flexibility="auto">
                                            <div class="component slds-hide" data-id="Insurance_Funding__c">
                                                <label class="slds-form-element__label">Insurance</label>
                                                <lightning-input type="toggle" variant="label-hidden"
                                                    message-toggle-active="Yes" message-toggle-inactive="No"
                                                    checked={newVehicleRecord.Insurance_Funding__c}
                                                    name="Insurance_Funding__c" onchange={handleToggleChange}>
                                                </lightning-input>

                                            </div>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                                            class="slds-var-p-horizontal_small" flexibility="auto">
                                            <template if:true={newVehicleRecord.Insurance_Funding__c}>
                                                <label class="slds-form-element__label"></abbr>Insurance Amount</label>
                                                <lightning-input type="number" variant="label-hidden" label=""
                                                    name="Insurance_Value__c"
                                                    value={newVehicleRecord.Insurance_Value__c}
                                                    onchange={handleValueChange}>
                                                </lightning-input>
                                            </template>
                                        </lightning-layout-item>
                                    </lightning-layout>
                                </lightning-layout-item>

                                <lightning-layout-item size="12" small-device-size="12" large-device-size="6" class="slds-var-p-horizontal_small" flexibility="auto">
                                    <div class="component slds-hide" data-id="LS__c">
                                        <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                                            <lightning-layout-item size="12" small-device-size="12"
                                                large-device-size="6" class="slds-var-p-horizontal_small"
                                                flexibility="auto">
                                                <label class="slds-form-element__label"></abbr>LS</label>
                                                <lightning-input type="toggle" variant="label-hidden" name="LS__c"
                                                    message-toggle-active="Yes" message-toggle-inactive="No"
                                                    checked={newVehicleRecord.LS__c} onchange={handleToggleChange}>
                                                </lightning-input>

                                            </lightning-layout-item>
                                            <lightning-layout-item size="12" small-device-size="12"
                                                large-device-size="6" class="slds-var-p-horizontal_small"
                                                flexibility="auto">
                                                <template if:true={newVehicleRecord.LS__c}>
                                                    <label class="slds-form-element__label"></abbr>LS Amount</label>
                                                    <lightning-input type="number" variant="label-hidden" label=""
                                                        name="LS_Value__c" value={newVehicleRecord.LS_Value__c}
                                                        onchange={handleValueChange}>
                                                    </lightning-input>
                                                </template>
                                            </lightning-layout-item>
                                        </lightning-layout>
                                    </div>
                                </lightning-layout-item>
                            </lightning-layout>

                        </lightning-accordion-section>
                    </lightning-accordion>

                    <lightning-accordion allow-multiple-sections-open class="example-accordion" active-section-name={activeSections}>
                        <lightning-accordion-section name="D" label="LTV Calculation">
                            <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                                <lightning-layout-item size="12" small-device-size="12" large-device-size="6" class="slds-var-p-horizontal_small" flexibility="auto">
                                    <div class="component slds-hide" data-id="Assessment_Method__c">
                                        <label class="slds-form-element__label"></abbr>Assessment Method</label>
                                        <lightning-input
                                            type="text"
                                            variant="label-hidden"
                                            label=""
                                            name="Assessment_Method__c"
                                            value={newVehicleRecord.Assessment_Method__c}
                                            onchange={handleValueChange}
                                        ></lightning-input>
                                    </div>
            
                                    <div class="component slds-hide" data-id="Approved_LTV__c">
                                        <label class="slds-form-element__label"></abbr>Approved LTV(%)</label>
                                        <lightning-input type="text" variant="label-hidden" label=""
                                            name="Approved_LTV__c" value={newVehicleRecord.Approved_LTV__c}
                                            onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>
                                    <div class="component slds-hide" data-id="Loan_Eligibilty__c">
                                        <label class="slds-form-element__label">Loan Eligibilty</label>
                                        <lightning-input type="text" variant="label-hidden" label=""
                                            name="Loan_Eligibilty__c" value={loanEligibilty} disabled
                                            onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>

                                    <div class="component slds-hide" data-id="Customer_equity__c">
                                        <label class="slds-form-element__label">Customer equity</label>
                                        <lightning-input type="text" variant="label-hidden" label="" disabled
                                            name="Customer_equity__c" value={calculateCustomerEquity}
                                            onchange={handleValueChange}>
                                        </lightning-input>
                                    </div>

                                </lightning-layout-item>
                                <lightning-layout-item size="12" small-device-size="12" large-device-size="6"
                                    class="slds-var-p-horizontal_small" flexibility="auto">

                                    <div class="component slds-hide" data-id="LTV_offered_On_road__c">
                                        <label class="slds-form-element__label">LTV offered % On Vehicle Cost</label>
                                        <lightning-input type="text" variant="label-hidden" label=""
                                            name="LTV_offered_On_road__c" disabled value={ltvOfferedOnVehicleCost}>
                                        </lightning-input>
                                    </div>
                                    
                                    <div class="component slds-hide" data-id="LTV_offered_On_final_cost__c">
                                        <label class={ltvOfferedLabelStyles}>LTV offered % On Final Vehicle Cost</label>
                                        <lightning-input type="text" variant="label-hidden" label=""
                                            name="LTV_offered_On_final_cost__c" disabled={isFourWheeler} class={ltvOfferedStyles}
                                            value={ltvOfferedOnVehicleFinalCost} onchange={handleValueChange}>
                                        </lightning-input>
                                        <p class="slds-text-color_error" if:true={isLTVInvalid}>The calculated LTV offered % can not be greater than 100.</p>
                                    </div>

                                    <div class="component slds-hide" data-id="Quantity__c">
                                        <label class="slds-form-element__label"></abbr>Quantity</label>
                                        <lightning-input type="number" variant="label-hidden" label=""
                                            name="Quantity__c" value={newVehicleRecord.Quantity__c} disabled>
                                        </lightning-input>
                                    </div>
                                </lightning-layout-item>
                            </lightning-layout>
                        </lightning-accordion-section>
                    </lightning-accordion>
                    
                    <lightning-accordion allow-multiple-sections-open class="example-accordion" active-section-name="A">
                        <lightning-accordion-section name="A" label="Existing Collateral Detail">
                            <c-applicant-selection
                                record-val={recordId}
                                onselection={handleChange}
                                label-text={labelVal}
                            ></c-applicant-selection>
        
                            <c-ausf-existing-collateral-detail-card
                                existing-collateral-list={existingCollateralListCBS}
                                label="Existing Collaterals"
                                onexistingcollateral={handleActionOnExistingCollateral}
                                loan-id={recordId}
                            ></c-ausf-existing-collateral-detail-card>

                            <c-ausf-customer-collateral-enquiry
                                is-checked={isChecked}
                                bool-norecords-full={boolNorecordsFull}
                                total-applicants-full={totalApplicantsFull}
                                onselectedcoll={getSelectedCollateral}
                                if:true={showCollateral}
                            ></c-ausf-customer-collateral-enquiry>
                        </lightning-accordion-section>
                    </lightning-accordion>
                </template>

                <template if:false={showBackButton}>
                    <div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium">
                        <lightning-button variant="brand-outline" class="slds-var-m-left_medium" label="Additional Collateral Detail" onclick={handleAdditionalClick} ></lightning-button>
                    </div>
                </template>
                <template if:true={showBackButton}>
                    <template if:false={showManualCollDetail}>
                        <c-ausf-add-manual-collateral record-id={recordId}></c-ausf-add-manual-collateral>
                    </template>

                    <c-ausf-existing-collateral-detail-card
                        existing-collateral-list={existingCollateralListManual}
                        label="Manually Added Collaterals"
                        onexistingcollateral={handleActionOnExistingCollateral}
                        if:true={showManualCollDetail}
                        loan-id={recordId}
                    ></c-ausf-existing-collateral-detail-card>
                </template>

                <!-- Collateral Actions - Save / Cancel / Back -->
                <lightning-layout multiple-rows class="slds-var-p-bottom_small">
                    <div class="button-container-inner slds-align_absolute-center slds-var-m-top_medium">
                        <template if:true={showCancelButton}>
                            <lightning-icon icon-name="action:reject" size="x-small" alternative-text="Cancel" onclick={handleCancelForm}></lightning-icon>
                        </template>
                        <template if:false={showBackButton}>
                            <lightning-icon icon-name="action:approval" size="x-small" alternative-text="Save" class="slds-var-m-left_small" onclick={handleSubmitForm}></lightning-icon>
                        </template>
                        <template if:true={showBackButton}>
                            <lightning-icon icon-name="action:back" size="x-small" alternative-text="Back" class="slds-var-m-left_small" onclick={handleBack}></lightning-icon>
                        </template>
                    </div>
                </lightning-layout>

            </lightning-card>
        </template>
    </template>
</template>

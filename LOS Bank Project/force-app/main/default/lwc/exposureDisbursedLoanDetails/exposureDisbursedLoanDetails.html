<template>
    <div if:true={isLoaded} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
    </div>
    <lightning-layout>
        <lightning-layout-item flexibility="auto" class="slds-card_boundary">
            <lightning-card class="no-wrap" icon-name="standard:account">
                <h1 slot="title" class="no-wrap"><a> {loanNumber}</a></h1> <!--{objAccountRecord.Loan__r.Loan_Number__c}-->
                <div class="component" data-id="Loan_Number__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Application number</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            {loanNumber}
                        </div>
                    </div>
                </div>
                <div class="component" data-id="Customer_Name__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Customer Name</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            <!--{objAccountRecord.Loan__r.Customer_Name__c}-->
                            {customerName}
                        </div>
                    </div>
                </div>
                <div class="component " data-id="Product__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Product </label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                           <!-- {objAccountRecord.Loan__r.Product__c}-->
                           {product}
                        </div>
                    </div>
                </div>
                <div class="component " data-id="Loan_Amount__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Loan Amount</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                            <!--{objAccountRecord.Loan__r.Loan_Amount__c}-->
                            {loanAmount}
                        </div>
                    </div>
                </div>
                <div class="component" data-id="Loan_Sanction_date__c">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Sanction date</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                           <!-- {objAccountRecord.Loan__r.Loan_Sanction_date__c}-->
                           {sanctiondate}
                        </div>
                    </div>
                </div>
                <div class="component slds-hide" data-id="IncludeInExposure">
                    <div class="slds-grid slds-wrap slds-p-around_xx-small">
                        <div class="slds-size_1-of-2">
                            <b><label class="slds-form-element__label">Include In Exposure</label></b>
                        </div>
                        <div class="slds-size_1-of-2">
                          <!--  {objAccountRecord.Include_In_Exposure__c}-->
                            <lightning-combobox name="includeExposure" label="Industry" data-name=""
                                variant="label-hidden" value={includeExposure} options={exposureOptions} disabled={creditOverride}
                                onchange={handleChange}>
                            </lightning-combobox>
                        </div>
                    </div>
                </div>
            </lightning-card>
        </lightning-layout-item>
    </lightning-layout>
    <div class="slds-p-bottom--small"></div>
</template>

<template>
    <!-- <div if:true={isloading} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand">
        </lightning-spinner>
    </div> -->
    <c-custom-spinner
        show-spinner={isloading}
        spinner-image={spinnerImage}
        >
    </c-custom-spinner>
    <lightning-card title={label}>
    <lightning-layout>
        <lightning-layout-item size="12" small-device-size="6" medium-device-size="12"
            large-device-size="12">
            <div class="slds-card__body slds-card__body_inner">
                <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                    <template if:false={viewMorePartial}>
                        <template for:each={existingCollateralList} for:item="rec">
                            <li class="slds-size_1-of-1 slds-medium-size_3-of-6 slds-var-p-horizontal_small slds-var-p-bottom_small"
                                key={rec.Id} data-id={rec.Id}
                                data-record-name="ViewMoreInformation">
                                <article class="slds-box">
                                    <div class="slds-card__header slds-grid">
                                        <header
                                            class="slds-media slds-media_center slds-has-flexi-truncate">
                                            <div class="slds-media__figure">
                                                <lightning-icon icon-name=custom:custom31 size="small">
                                                </lightning-icon>
                                            </div>
                                            <div class="slds-media__body">
                                                <h2 class="slds-card__header-title">
                                                    <a class="slds-card__header-link slds-truncate"
                                                        title={rec.Name}
                                                        data-id={rec.Id}>{rec.Collateral_ID__c}</a>
                                                    <!--onclick={navigateToAppRecordPage}-->
                                                </h2>
                                            </div>
                                            <div class="slds-no-flex">
                                                <!--<lightning-icon icon-name=action:edit size="x-small"
                                                    data-id={rec.Id}
                                                    data-record-name={rec.Name}
                                                    alternative-text={rec.Name}
                                                    title={rec.Name}
                                                    onclick={handleRowAction}>
                                                </lightning-icon>-->
                                                <lightning-icon icon-name=action:delete size="x-small"
                                                    data-id={rec.Id}
                                                    onclick={handleDeleteAction}>
                                                </lightning-icon>
                                            </div>
                                        </header>

                                    </div>
                                    <div class="slds-card__body slds-card__body_inner">
                                        <div class="slds-form-element">

                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                <div class="slds-size_1-of-2">
                                                    <span class="slds-form-element__label">Collateral
                                                        ID</span>
                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-form-element__control">
                                                        <div class="slds-form-element__static">
                                                            {rec.Collateral_ID__c}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                <div class="slds-size_1-of-2">
                                                    <span class="slds-form-element__label">Collateral
                                                        Name</span>
                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-form-element__control">
                                                        <div class="slds-form-element__static">
                                                            {rec.Collateral_Name__c}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                <div class="slds-size_1-of-2">
                                                    <span
                                                        class="slds-form-element__label">Collateral Type</span>
                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-form-element__control">
                                                        <div class="slds-form-element__static">
                                                            {rec.Collateral_Type__c}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                <div class="slds-size_1-of-2">
                                                    <span class="slds-form-element__label">Account Number</span>
                                                </div>
                                                <div class="slds-size_1-of-2">
                                                    <div class="slds-form-element__control">
                                                        <div class="slds-form-element__static">
                                                            {rec.Linked_Account_Number__c}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="slds-grid slds-wrap slds-var-p-around_xx-small">
                                                <div class="slds-size_1-of-2">
                                                    <span class="slds-form-element__label">Customer ID</span>
                                                </div>
                                                <div class="slds-form-element__control">
                                                    <div class="slds-form-element__static">
                                                        {rec.CustomerId__c}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </article>
                            </li>
                        </template>
                    </template>
                </ul>
            </div>
        </lightning-layout-item>
    </lightning-layout>
</lightning-card>
</template>

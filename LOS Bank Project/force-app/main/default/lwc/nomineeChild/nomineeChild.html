<template>

    <c-custom-spinner show-spinner={isLoading} spinner-image={spinnerImage}></c-custom-spinner>
    <template if:false={addNominee}>
        <article class="slds-box">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <template if:true={isRecordSaved}>
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom9" size="small"></lightning-icon>
                        </div>
                    </template>
                    <template if:false={isRecordSaved}>
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:warning" variant="warning" size="small"></lightning-icon>
                        </div>
                    </template>
                    
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <a class="slds-card__header-link slds-truncate"
                                title={nomineeRecord.Name} data-id={nomineeRecord.Name}
                                onclick={navigateToAppRecordPage}>{nomineeRecord.Name}</a>
                        </h2>
                    </div>
                    <div >
                        <lightning-icon icon-name="action:edit" class="slds-m-around_x-small" size="x-small" onclick={handleRowAction}></lightning-icon>
                        <lightning-icon icon-name="action:delete" size="x-small" variant="success"
                                    onclick={deleteNominee} class="slds-m-around_x-small"></lightning-icon>
                    </div>
                </header>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-form-element">
                    <span class="slds-form-element__label">Nominee Name</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{nomineeRecord.Customer_Name__c}</div>
                    </div>
                    <!--<span class="slds-form-element__label">Nominee DOB</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{nomineeRecord.Dob__c}</div>
                    </div>-->
                    <span class="slds-form-element__label">Relation with Applicant</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{nomineeRecord.Relationship_with_applicant__c}</div>
                    </div>
                    <span class="slds-form-element__label">% Share for Nomination</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{nomineeRecord.Percentage_Share_for_Nomination__c}</div>
                    </div>
                    <!--<span class="slds-form-element__label">Address</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{nomineeRecord.Nominee_Address__c}</div>
                    </div>
                    <span class="slds-form-element__label">Contact Number</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{nomineeRecord.Mobile_Number__c}</div>
                    </div>
                    <span class="slds-form-element__label">Profession</span>
                    <div class="slds-form-element__control">
                        <div class="slds-form-element__static">{nomineeRecord.Profile__c}</div>
                    </div>-->
                </div>
            </div>
        </article>
    </template>
    

    <template if:true={addNominee}>
        <lightning-card title="Nominee" icon-name="custom:custom9">
            <span slot="actions">
                <lightning-icon icon-name="action:reject" size="x-small" onclick={handleReject}></lightning-icon>
            </span>
            <lightning-layout multiple-rows>
                <lightning-layout-item data-id="Customer_Name__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange}
                        required
                        message-when-pattern-mismatch="Special characters and numbers are not allowed"
                        pattern="^[a-zA-Z ]+$"
                        type="text" 
                        label="Nominee Name"
                        name="Customer_Name__c"
                        value={nomineeRecord.Customer_Name__c}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item data-id="Dob__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input label="Nominee DOB" 
                            type="date" 
                            message-when-range-underflow="Future Date not allowed"
                            max={todaysDate}
                            onchange={handleChange}
                            disabled={readOnly}
                            name="Dob__c"
                            data-id="Dob"
                            value={nomineeRecord.Dob__c}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item data-id="Relationship_with_applicant__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-combobox name="Relationship_with_applicant__c"
                                                        read-only={readOnly}
                                                        required
                                                        label="Relation with Applicant"
                                                        options={relationOptions}
                                                        value={nomineeRecord.Relationship_with_applicant__c}
                                                        onchange={handleChange}
                                                        data-id="Relationship_with_applicant__c" access-key={index}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item data-id="Percentage_Share_for_Nomination__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange} type="number" formatter="percent-fixed" step="0.01"
                        required
                        data-id="Percentage_Share_for_Nomination__c"
                        label="% Share for Nomination"
                        name="Percentage_Share_for_Nomination__c"
                        value={nomineeRecord.Percentage_Share_for_Nomination__c}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item data-id="Nominee_Address__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange} type="text" 
                        required
                        label="Nominee Address"
                        name="Nominee_Address__c"
                        value={nomineeRecord.Nominee_Address__c}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item data-id="Mobile_Number__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange} type="tel" max-length="10" pattern="[6-9]{1}[0-9]{9}" 
                        required
                        message-when-pattern-mismatch="Please enter a valid phone number"
                        label="Nominee Contact Number"
                        name="Mobile_Number__c"
                        value={nomineeRecord.Mobile_Number__c}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item data-id="Profile__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                    <lightning-input onchange={handleChange} type="text" 
                        required
                        data-id="Profile__c"
                        label="Nominee Profession"
                        name="Profile__c"
                        value={nomineeRecord.Profile__c}></lightning-input>
                </lightning-layout-item>
                <template if:true={showAppointee}>
                    <lightning-layout-item data-id="Appointee_Name__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                        <lightning-input onchange={handleChange} type="text" 
                            data-id="Appointee_Name__c"
                            label="Appointee Name"
                            name="Appointee_Name__c"
                            required
                            value={nomineeRecord.Appointee_Name__c}></lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item data-id="Appointee_DoB__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                        <lightning-input onchange={handleChange} type="date" 
                            data-id="Appointee_DoB__c"
                            label="Appointee DOB"
                            name="Appointee_DoB__c"
                            required
                            value={nomineeRecord.Appointee_DoB__c}
                            message-when-range-underflow="Future Date not allowed"
                            max={todaysDate}></lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item data-id="Appointee_Relationship__c" class="component slds-show" padding="around-small" size="12" small-device-size="12" large-device-size="6">
                        <lightning-combobox name="Appointee_Relationship__c"
                                                            label="Appointee Relationship"
                                                            required
                                                            options={appointeeRelationshipPicklist.data.values}
                                                            value={nomineeRecord.Appointee_Relationship__c}
                                                            onchange={handleChange}
                                                            data-id="Appointee_Relationship__c"></lightning-combobox>
                    </lightning-layout-item>
                </template>
            </lightning-layout>  
            <div class="slds-align_absolute-center">
                <lightning-icon icon-name="action:approval" size="x-small" variant="success"
                                    onclick={saveNominee} class="slds-m-around_medium"></lightning-icon>
                <lightning-icon icon-name="action:delete" size="x-small" variant="success"
                                    onclick={deleteNominee} class="slds-m-around_medium"></lightning-icon>
            </div>  
        </lightning-card>
    </template>
    
</template>

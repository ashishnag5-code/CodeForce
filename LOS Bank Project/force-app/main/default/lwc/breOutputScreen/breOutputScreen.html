<div class="slds-box slds-theme_default slds-m-around_x-small slds-var-m-around_xxx-small">
	<div class="slds-grid slds-wrap slds-var-p-around_xx-small">
		<div class="slds-size_1-of-2">
		Approval Authority
	</div>
		<div class="slds-size_1-of-2">
			<b>
				<label class="slds-form-element__label">{uwAuthority}</label>
			</b>
		</div>
	</div>
	</div>


							<template if:true={showSchemeDecision}>
					
								<c-generic-card-pagination-display displayuwcriteria={renderuwcriteria}
								object-list={schemeDecisionArray} is-decline-response={isShowDeclineReasons}
								enable-selection={isEnableSchemeSelection} record-id={loanAppId}
								bre-response-id={breResponseId} loan-scheme-code={loanSchemeCode} 
								card-title="Eligible Schemes"
								 scheme-add-details={schemeMap} 
								 scheme-deviations={deviationsMap}
								 disableshemeselection={isEnableSchemeSelection}
								class="comwidth" schem-id={schemId}>
								</c-generic-card-pagination-display>
					
							</template>
						

					<!--	</lightning-accordion-section>-->
				<!--	</lightning-accordion>-->
				</template>

				

				<template if:true={isShowDeclineReasons}>
					<lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
						<lightning-accordion-section name="A" label="Application">

							<div class="slds-grid slds-wrap slds-var-p-around_xx-small">
								<div class="slds-size_1-of-2">
									<b><label class="slds-form-element__label">Application Decision</label></b>
								</div>
								<div class="slds-size_1-of-2">
									{applicantDecision}
								</div>
							</div>


							<div class="slds-grid slds-wrap slds-var-p-around_xx-small">
								<div class="slds-size_1-of-2">
									<b><label class="slds-form-element__label">Decision Date Time</label></b>
								</div>
								<div class="slds-size_1-of-2">
									{decisionDateTime}
								</div>
							</div>


						</lightning-accordion-section>
						<template if:true={renderuwcriteria}>
							<lightning-accordion-section name="B" label="UW Criterias">
								<template if:true={showApplicants}>
									<lightning-card>
										<c-generic-card-pagination-display displayuwcriteria={renderuwcriteria}
											object-list={uwCriteriaArray} is-decline-response={isShowDeclineReasons}
											card-title="UW Criteria"></c-generic-card-pagination-display>
									</lightning-card>
								</template>
	
							</lightning-accordion-section>
						</template>

					</lightning-accordion>

				</template>
			</template>
			<template if:true={isShowErrorReasons}>
				<lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
					<lightning-accordion-section name="A" label="Application">

						<div class="slds-grid slds-wrap slds-var-p-around_xx-small">
							<div class="slds-size_1-of-2">
								<b><label class="slds-form-element__label">Application Decision</label></b>
							</div>
							<div class="slds-size_1-of-2">
								{applicantDecision}
							</div>
						</div>


						<div class="slds-grid slds-wrap slds-var-p-around_xx-small">
							<div class="slds-size_1-of-2">
								<b><label class="slds-form-element__label">Decision Date Time</label></b>
							</div>
							<div class="slds-size_1-of-2">
								{decisionDateTime}
							</div>
						</div>


					</lightning-accordion-section>

					<lightning-accordion-section name="B" label="Errors">

						<template if:true={showErrors}>
							<lightning-card>
								<c-generic-card-pagination-display displayuwcriteria={renderuwcriteria}
									object-list={errorDeatilsArray} is-decline-response={isShowDeclineReasons}
									card-title="Error Details"></c-generic-card-pagination-display>
							</lightning-card>
						</template>

					</lightning-accordion-section>
				</lightning-accordion>
			</template>
		</template>
	</template>
	<template if:true={isBreStatusPending}>
		<center>
			<div style="color:red;"> Last BRE run at {lastBreRunAt} and response not received yet</div>
		</center>
	</template>
	<template if:true={isBreStatusNull}>
		<center>
			<div style="color:red;"> BRE is not run yet. Please edit Loan and Run BRE.</div>
		</center>
	</template>
</article>
</template>

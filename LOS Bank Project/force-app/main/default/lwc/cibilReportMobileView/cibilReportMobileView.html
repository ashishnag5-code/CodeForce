<template>
    <!--lightning-modal-header label="CIBIL Report"></lightning-modal-header-->
    <lightning-modal-body>
        <div class="customHeaderStyles">
            <div class="slds-scrollable" id="modal-content-id-1">
                <div class="elementHoldingHTMLContent" lwc:dom="manual"></div>
            </div>
        </div>
        <!-- modal start -->      
        <template if:true={isShowModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" 
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
            <!-- modal header start -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                title="Close" onclick={hideModalBox}>
                    <lightning-icon icon-name="utility:close"
                    alternative-text="close"
                    variant="inverse"
                    size="small" ></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Select User to share</h2>
            </header>
            <!-- modal body start -->
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                <c-generic-custom-lookup selected-record={recordSelected} name="Selectuser" 
                existing-value="" existing-icon={iconname} data-sequence="2"
                label="Select User" record-type-name="" class="validateGenericLookupFld"
                search-fields="" stepid="0" fieldapi="Name" object-name="User" s-object-api-name="User"
                default-record-id="" is-required=true onlookupselect={handleChange}>
                </c-generic-custom-lookup>
            <br>
                <br>
                <br>
                <br>
                <br>
            </div>
            <!-- modal footer start-->
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={shareReportToUser}>Share Cibil Report</button>
                <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
            </footer>

            </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
            <!-- modal end -->
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Close" onclick={closeModal}></lightning-button>&nbsp;&nbsp;
        <lightning-button label="Share File" onclick={shareOrDownloadFile}></lightning-button>
    </lightning-modal-footer>
</template>

<template>
    <c-custom-spinner show-spinner={isLoading} spinner-image={spinnerImage}></c-custom-spinner>


    <template if:true={received}>
        <template if:true={fetchDetailsReceived}>
            <c-generic-data-display onverified={handleDocumentVerified} onnotverified={handleBack}
            cpv-documents={cpvDocuments} match-score={matchScore}  onback={handleonBack} label={label} 
            display-type="Gas Bill Details" type="Gas Bill" api-response={gasBillResponse}></c-generic-data-display>
        </template>

        <template if:false={fetchDetailsReceived}>
	        <template if:false={hideButtons}>
                <lightning-layout>
                    <lightning-layout-item size="6" small-device-size="6" large-device-size="2">
                        <div class="slds-align--absolute-center">
                            <lightning-button-icon variant="brand" icon-name="utility:upload" 
                            onclick={handleUploadFile}></lightning-button-icon> 
                        </div>
                        <div class="slds-align--absolute-center slds-p-top_x-small">Upload</div>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" small-device-size="6" large-device-size="2">
                        <div class="slds-align--absolute-center">
                            <lightning-button-icon variant="brand" onclick={handleFetchApi}
                            icon-name="utility:download"></lightning-button-icon>
                        </div>
                        <div class="slds-align--absolute-center slds-p-top_x-small">Fetch</div>
                    </lightning-layout-item>
                </lightning-layout>
            </template>
            <lightning-layout>
                <lightning-layout-item padding="around-small" size="12" small-device-size="12" large-device-size="12">
                    <lightning-card>
                        <b><lightning-formatted-text value={label}></lightning-formatted-text></b>
                        <b><lightning-formatted-number class="slds-m-left_xx-small" format-style="currency" value={amount}></lightning-formatted-number></b>
                        <template if:false={hideButtons}>
                            <template if:false={fetchFailed}>
                                <lightning-icon size="x-small" class="slds-m-left_small" icon-name="utility:success" alternative-text="Success!" variant="success"></lightning-icon>        
                            </template>
                            <template if:true={fetchFailed}>
                                <lightning-icon size="x-small" class="slds-m-left_small" icon-name="utility:error" alternative-text="Failed!" variant="error"></lightning-icon>        
                            </template>
                        </template>
                    </lightning-card>            
                </lightning-layout-item>
            </lightning-layout>
            <!--lightning-icon size="x-small" class="slds-m-around_small" icon-name="action:back" onclick={handleClose} alternative-text="Back"></lightning-icon-->
        </template>
    </template>

    <template if:false={received}>
        <template if:false={hideButtons}>
            <lightning-layout>
                <lightning-layout-item size="6" small-device-size="6" large-device-size="2">
                    <div class="slds-align--absolute-center">
                        <lightning-button-icon variant="brand" icon-name="utility:upload" 
                        onclick={handleUploadFile}></lightning-button-icon> 
                    </div>
                    <div class="slds-align--absolute-center slds-p-top_x-small">Upload</div>
                </lightning-layout-item>
                <lightning-layout-item size="6" small-device-size="6" large-device-size="2">
                    <div class="slds-align--absolute-center">
                        <lightning-button-icon variant="brand" onclick={handleFetchApi}
                        icon-name="utility:download"></lightning-button-icon>
                    </div>
                    <div class="slds-align--absolute-center slds-p-top_x-small">Fetch</div>
                </lightning-layout-item>
            </lightning-layout>
        </template>

        <template if:true={isUploadFile}>
            <div class="slds-m-around_small">
                <c-upload-multiple-files onhandleclose={handleClose} ondetailsreceived={handleEvent} applicant-id={applicantId} 
                loan-app-id={loanAppId} document-master-name="LPG_Bill" document-type={documentType} heading-value={headingValue}></c-upload-multiple-files>
            </div>
        </template>

        <template if:true={isFetchApi}>
            <template if:true={isVerified}>
                <lightning-layout>
                    <lightning-layout-item size="12" small-device-size="12"
                        large-device-size="4">
                        <article class="slds-box">
                            <lightning-card>
                                <h3 slot="title" style="text-align:center">
                                    <lightning-icon icon-name="utility:success" variant="success" size="medium"></lightning-icon>
                                    &nbsp;&nbsp;{lpgId}
                                    
                                </h3>
                                <div slot="footer">
                                    <div class="slds-grid slds-gutters">
                                        <div class="slds-col">
                                            <span>
                                                <lightning-icon variant="brand" label="View" title="View Details" size="x-small"
                                                onclick={displayMoreDetails} icon-name="action:preview" class="buttonColor slds-m-around_small"></lightning-icon>
                                    
                                            </span><br/>
                                            Preview
                                        </div>     
                                        <div class="slds-col">
                                            <span>
                                                <lightning-icon variant="brand" label="Edit" title="Edit Details" size="x-small"
                                                onclick={editLPGDetails} icon-name="action:edit" class="buttonColor slds-m-around_small"></lightning-icon>
                                            </span><br/>
                                            Edit
                                        </div>
                                        <div class="slds-col">
                                            <span>
                                                <lightning-icon label="Back" class="buttonColor slds-m-around_small" size="x-small" icon-name="action:reject" variant="brand" onclick={handleClose}></lightning-icon>
                                            </span><br/>
                                            Close
                                        </div>
                                    </div>        
                                </div>
                            </lightning-card>


                            
                            

                           
                        </article>

                    </lightning-layout-item>
                </lightning-layout>
            </template>
            <!--<lightning-layout multiple-rows>
                <lightning-layout-item padding="horizontal-medium" size="12" small-device-size="12" large-device-size="12">
                    <div class="slds-size_1-of-1 slds-small-size_1-of-1 slds-large-size_1-of-1">
                        <lightning-card>
                            <template if:true={isVerified}>
                                <b><lightning-formatted-text value={label}></lightning-formatted-text></b>
                                <lightning-icon size="x-small" class="slds-m-left_small" icon-name="utility:success" alternative-text="Success!" variant="success"></lightning-icon>        
                            </template>
                        </lightning-card>
                    </div>
                    
                    
                </lightning-layout-item>
            </lightning-layout>-->
            
        </template>

        <template if:true={editDetails}>
            <div class="slds-size_1-of-1 slds-small-size_1-of-1 slds-large-size_1-of-2">
                <lightning-input label="Document Number" required value={lpgId} type="text" onchange={handleChange} name="Document_Number__c"></lightning-input>
                <div class="slds-align_absolute-center">
                    <lightning-icon class="slds-m-around_small" size="x-small" variant="brand" onclick={handleEditClose}
                    icon-name="action:reject"></lightning-icon>
                    <template if:false={isVerified}>
                        <lightning-icon class="slds-m-around_small" size="x-small" variant="brand" onclick={fetchDetails}
                        icon-name="action:approval"></lightning-icon>
                    </template>
                </div>
            </div>
        </template>
    </template>
    
    
    

    

</template>

<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid ">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name=standard:user size="medium"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Sourcing & Dealer Detail</span>
                        <!--<a href="#" class="slds-card__header-link slds-truncate" title="Address">
                                    <span>Addresses ({recordCount})</span>
                                </a>-->
                    </h2>
                </div>
                <div class="slds-no-flex">
                </div>
            </header>
        </div>


        <div class="slds-card__body slds-card__body_inner">
            <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                <li class="slds-size_1-of-1 slds-medium-size_3-of-3 slds-p-horizontal_small slds-p-bottom_small"
                     onclick={viewMoreHandler}
                     data-record-name="ViewMoreInformation">
                     <lightning-layout horizontal-align="space" multiple-rows>
                        <lightning-layout-item size="12" flexibility="auto">
                            <div class="slds-form-element slds-form-element_horizontal" style="margin:0.6%;" >
                                <label class="slds-form-element__label">Sourcing channel</label>
                                <div class="slds-form-element__control" >
                                    {sourceDetailsWrappr.sourcingChannel}		
                                </div>
                            </div>
                            <div class="slds-form-element slds-form-element_horizontal" style="margin:0.6%;">
                                <label class="slds-form-element__label">Dealer name & TA/NTA</label>
                                <div class="slds-form-element__control" >
                                    {sourceDetailsWrappr.dealerName}			
                                    
                                </div>
                            </div>
                            <div class="slds-form-element slds-form-element_horizontal" style="margin:0.6%;">
                                <label class="slds-form-element__label">Show dealer scheme-Payouts</label>
                                <div class="slds-form-element__control" >
                                    Tej Prakash Kumawat	
                                </div>
                            </div>
                            <div class="slds-form-element slds-form-element_horizontal" style="margin:0.6%;">
                                <label class="slds-form-element__label">DSM Payout:</label>
                                <div class="slds-form-element__control" >
                                    DCC 	
                                </div>
                            </div>
                            <div class="slds-form-element slds-form-element_horizontal" style="margin:0.6%;">
                                <label class="slds-form-element__label">Mapped Dealer/DSA payout</label>
                                <div class="slds-form-element__control" >
                                    1.25%	
                                </div>
                            </div>
                            <div class="slds-form-element slds-form-element_horizontal" style="margin:0.6%;">
                                <label class="slds-form-element__label">Payout on this deal</label>
                                <div class="slds-form-element__control" >
                                    Nill/Half/Full		
                                </div>
                            </div>
                            <div class="slds-form-element slds-form-element_horizontal" style="margin:0.6%;">
                                <label class="slds-form-element__label">RO Name_ Mobile</label>
                                <div class="slds-form-element__control" >
                                    {sourceDetailsWrappr.roName_Mobile}
                                    
                                </div>
                            </div>
                            <div class="slds-form-element slds-form-element_horizontal" style="margin:0.6%;">
                                <label class="slds-form-element__label">BM Name_ Mobile</label>
                                <div class="slds-form-element__control" >
                                    {sourceDetailsWrappr.bmName_Mobile}
                                    
                                </div>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                            
                </li>
            </ul>
            <!--End -->
        </div>
    </article>
    
</template>
